<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>BEEN MATH — 로그인</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#114C56">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --primary:#5B6CF5; --primary-dark:#4F46E5; --primary-light:#EEF2FF;
      --green:#10B981; --red:#F43F5E;
      --text:#0F172A; --text-sub:#334155; --text-muted:#64748B;
      --border:#E2E8F0; --surface:#fff;
      --radius:14px; --radius-sm:9px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Noto Sans KR',-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
      background:linear-gradient(135deg,#5B6CF5 0%,#818CF8 50%,#A78BFA 100%);position:relative;overflow:hidden}
    body::before,body::after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
    body::before{width:380px;height:380px;top:-120px;right:-80px}
    body::after{width:300px;height:300px;bottom:-100px;left:-60px}

    .login-wrap{width:100%;max-width:420px;position:relative;z-index:1}
    .brand{text-align:center;margin-bottom:24px}
    .brand .logo{width:76px;height:76px;display:block;margin:0 auto 12px;border-radius:20px;box-shadow:0 10px 24px rgba(0,0,0,.22)}
    .brand h1{font-size:30px;font-weight:800;color:#fff;letter-spacing:1px}
    .brand h1 .intg{color:#36D399;font-weight:700;padding:0 2px}
    .brand p{font-size:14px;color:rgba(255,255,255,.85);margin-top:6px}

    .card{background:var(--surface);border-radius:var(--radius);padding:28px;box-shadow:0 20px 50px rgba(0,0,0,.2)}

    .role-tabs{display:flex;gap:8px;background:var(--primary-light);padding:5px;border-radius:var(--radius-sm);margin-bottom:22px}
    .role-tab{flex:1;text-align:center;padding:11px;border-radius:7px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;color:var(--text-muted);user-select:none}
    .role-tab.active{background:var(--surface);color:var(--primary);box-shadow:0 2px 5px rgba(0,0,0,.08)}

    .form-group{margin-bottom:16px}
    .hidden{display:none}
    .form-group.hidden{display:none}
    .form-label{display:block;font-size:13px;font-weight:600;color:var(--text-sub);margin-bottom:7px}
    .form-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;color:var(--text);transition:border-color .15s}
    .form-input:focus{outline:none;border-color:var(--primary)}
    .hint{font-size:12px;color:var(--text-muted);margin-top:6px}

    .pw-wrap{position:relative}
    .pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;opacity:.5}

    .btn-login{width:100%;padding:13px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;cursor:pointer;transition:background .15s;font-family:inherit;margin-top:6px}
    .btn-login:hover{background:var(--primary-dark)}
    .btn-login:disabled{opacity:.6;cursor:not-allowed}

    .info-box{background:#F8FAFC;border:1px dashed var(--border);border-radius:var(--radius-sm);padding:14px;margin-top:18px;font-size:12px;color:var(--text-muted);line-height:1.7}
    .info-box strong{color:var(--text-sub)}

    .footer-note{text-align:center;margin-top:20px;font-size:12px;color:rgba(255,255,255,.7);line-height:1.6}

    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1E293B;color:#fff;padding:11px 22px;border-radius:24px;font-size:13px;font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:100;animation:tIn .3s ease;display:flex;align-items:center;gap:8px;max-width:90vw}
    .toast.error{background:var(--red)}
    .toast.success{background:var(--green)}
    @keyframes tIn{from{opacity:0;transform:translate(-50%,15px)}to{opacity:1;transform:translate(-50%,0)}}

    @media(max-width:480px){.card{padding:22px}.brand h1{font-size:26px}}
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="brand">
      <img class="logo" src="icon.svg" alt="BEEN MATH">
      <h1>BEEN MATH</h1>
      <p>혜빈쌤과 함께하는 수학 학습 관리</p>
    </div>

    <div class="card">
      <!-- 역할 선택 -->
      <div class="role-tabs">
        <div class="role-tab active" data-role="student" onclick="setRole('student')">🎒 학생 / 학부모</div>
        <div class="role-tab" data-role="teacher" onclick="setRole('teacher')">👩‍🏫 선생님</div>
      </div>

      <form onsubmit="doLogin(event)">
        <!-- 학생 로그인: 이름 + 개인 비밀번호 (첫 로그인만 핸드폰 뒤4자리로 본인확인) -->
        <div id="studentFields">
          <div class="form-group">
            <label class="form-label">이름</label>
            <input class="form-input" type="text" id="s-name" placeholder="이름을 입력하세요">
          </div>
          <div class="form-group">
            <label class="form-label">비밀번호</label>
            <div class="pw-wrap">
              <input class="form-input" type="password" id="s-pw" placeholder="나만의 비밀번호">
              <button type="button" class="pw-toggle" onclick="toggleSPw()">👁️</button>
            </div>
            <div class="hint">내 비밀번호로 로그인해요</div>
          </div>
          <div class="form-group hidden" id="s-setup">
            <label class="form-label">핸드폰 뒤 4자리 <span style="color:var(--text-muted);font-weight:400">· 처음 1회 본인 확인</span></label>
            <input class="form-input" type="tel" id="s-last4" inputmode="numeric" maxlength="4" placeholder="예: 2222">
            <div class="hint">🔐 첫 로그인이에요! 본인 확인 후, 위에 적은 비밀번호가 내 비밀번호로 설정돼요.</div>
          </div>
        </div>

        <!-- 선생님 로그인: 비밀번호 -->
        <div id="teacherFields" class="hidden">
          <div class="form-group">
            <label class="form-label">선생님 비밀번호</label>
            <div class="pw-wrap">
              <input class="form-input" type="password" id="t-pw" placeholder="비밀번호를 입력하세요">
              <button type="button" class="pw-toggle" onclick="togglePw()">👁️</button>
            </div>
            <div class="hint">처음이면, 입력하는 비밀번호가 그대로 선생님 비밀번호로 설정돼요</div>
          </div>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">로그인</button>
      </form>

      <div class="info-box" id="infoBox">
        🎒 <strong>학생</strong>은 <strong>이름 + 나만의 비밀번호</strong>로 로그인해요.<br>
        처음이면 본인 확인 후 비밀번호를 직접 정해요. 비밀번호를 잊으면 선생님께 초기화를 요청하세요!
      </div>

      <a href="about.html" style="display:block;text-align:center;margin-top:18px;padding:12px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;font-weight:600;color:var(--text-sub);transition:all .15s" onmouseover="this.style.borderColor='var(--primary)';this.style.color='var(--primary)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text-sub)'">📐 BEEN MATH 자세히 살펴보기 →</a>
    </div>

    <div class="footer-note">
      © 2026 BEEN MATH · 문의: 혜빈쌤
    </div>
  </div>

  <!-- Firebase SDK (compat) -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="firebase-init.js?v=2026072602"></script>

  <script>
  // ================================================================
  // 🔐 로그인 유지 — 이미 로그인돼 있으면 바로 포털로 입장
  // ================================================================
  (function autoLogin(){
    const role = localStorage.getItem('bm_role');
    if (role === 'student' && localStorage.getItem('bm_studentId')) { location.replace('student.html'); return; }
    if (role === 'teacher') { location.replace('teacher.html'); return; }
  })();

  // ================================================================
  // 역할 선택
  // ================================================================
  let currentRole = 'student';
  function setRole(role){
    currentRole = role;
    document.querySelectorAll('.role-tab').forEach(t=> t.classList.toggle('active', t.dataset.role===role));
    document.getElementById('studentFields').classList.toggle('hidden', role!=='student');
    document.getElementById('teacherFields').classList.toggle('hidden', role!=='teacher');
    document.getElementById('infoBox').innerHTML = (role==='student')
      ? '🎒 <strong>학생</strong>은 <strong>이름 + 나만의 비밀번호</strong>로 로그인해요.<br>처음이면 본인 확인 후 비밀번호를 직접 정해요. 비밀번호를 잊으면 선생님께 초기화를 요청하세요!'
      : '👩‍🏫 <strong>선생님</strong>은 비밀번호 하나로 로그인해요.<br>가장 먼저 로그인하는 비밀번호가 선생님 비밀번호로 저장돼요. 꼭 기억해두세요!';
  }

  function togglePw(){
    const pw = document.getElementById('t-pw');
    pw.type = pw.type==='password' ? 'text' : 'password';
  }
  function toggleSPw(){
    const pw = document.getElementById('s-pw');
    pw.type = pw.type==='password' ? 'text' : 'password';
  }
  // 비밀번호 해시 (학생ID를 소금으로) — DB에 원문 저장 안 함
  //  ⚠️ 카톡·일부 인앱 브라우저에선 crypto.subtle이 undefined → "undefined is not an object"로 로그인 실패.
  //     그래서 crypto.subtle이 없으면 순수 JS SHA-256으로 대체(같은 결과라 기존 비밀번호 그대로 됨).
  async function hashPw(salt, pw){
    const msg = 'bm:'+salt+':'+pw;
    if(typeof crypto!=='undefined' && crypto.subtle && crypto.subtle.digest){
      try{
        const data = new TextEncoder().encode(msg);
        const buf = await crypto.subtle.digest('SHA-256', data);
        return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
      }catch(e){ /* 인앱 브라우저 등에서 실패 → 아래 JS 폴백으로 */ }
    }
    return sha256Hex(msg);
  }
  // 순수 JS SHA-256 (Web Crypto와 동일 결과, UTF-8) — crypto.subtle 없을 때 폴백
  function sha256Hex(str){
    function rotr(n,x){ return (x>>>n)|(x<<(32-n)); }
    var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
    var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    var bytes=[]; for(var i=0;i<str.length;i++){ var c=str.charCodeAt(i);
      if(c<0x80) bytes.push(c);
      else if(c<0x800) bytes.push(0xc0|(c>>6),0x80|(c&0x3f));
      else if(c<0xd800||c>=0xe000) bytes.push(0xe0|(c>>12),0x80|((c>>6)&0x3f),0x80|(c&0x3f));
      else { i++; var c2=str.charCodeAt(i); var cp=0x10000+(((c&0x3ff)<<10)|(c2&0x3ff)); bytes.push(0xf0|(cp>>18),0x80|((cp>>12)&0x3f),0x80|((cp>>6)&0x3f),0x80|(cp&0x3f)); }
    }
    var bitLen=bytes.length*8;
    bytes.push(0x80); while(bytes.length%64!==56) bytes.push(0);
    bytes.push(0,0,0,0,(bitLen>>>24)&0xff,(bitLen>>>16)&0xff,(bitLen>>>8)&0xff,bitLen&0xff);
    var w=new Array(64);
    for(var j=0;j<bytes.length;j+=64){
      for(var t=0;t<16;t++) w[t]=(bytes[j+t*4]<<24)|(bytes[j+t*4+1]<<16)|(bytes[j+t*4+2]<<8)|(bytes[j+t*4+3]);
      for(t=16;t<64;t++){ var s0=rotr(7,w[t-15])^rotr(18,w[t-15])^(w[t-15]>>>3); var s1=rotr(17,w[t-2])^rotr(19,w[t-2])^(w[t-2]>>>10); w[t]=(w[t-16]+s0+w[t-7]+s1)|0; }
      var a=H[0],b=H[1],c2=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
      for(t=0;t<64;t++){ var S1=rotr(6,e)^rotr(11,e)^rotr(25,e); var ch=(e&f)^(~e&g); var t1=(h+S1+ch+K[t]+w[t])|0; var S0=rotr(2,a)^rotr(13,a)^rotr(22,a); var maj=(a&b)^(a&c2)^(b&c2); var t2=(S0+maj)|0; h=g;g=f;f=e;e=(d+t1)|0;d=c2;c2=b;b=a;a=(t1+t2)|0; }
      H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c2)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
    }
    var hex=''; for(i=0;i<8;i++){ hex+=('00000000'+(H[i]>>>0).toString(16)).slice(-8); }
    return hex;
  }

  function showToast(msg, type=''){
    const old = document.querySelector('.toast');
    if(old) old.remove();
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `${type==='error'?'❌':type==='success'?'✅':'ℹ️'} ${msg}`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 2800);
  }

  // ================================================================
  // 로그인
  // ================================================================
  async function doLogin(e){
    e.preventDefault();
    await window.bmAuthReady;   // 익명 인증(출입증) 완료 후 로그인 조회
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = '로그인 중...';
    try {
      if(currentRole === 'student'){
        await studentLogin();
      } else {
        await teacherLogin();
      }
    } catch(err){
      showToast('오류: ' + err.message, 'error');
    } finally {
      btn.disabled = false; btn.textContent = '로그인';
    }
  }

  // ----- 학생 로그인: 이름 + 개인 비밀번호 (첫 로그인만 핸드폰 뒤4자리로 본인확인) -----
  async function studentLogin(){
    const name = document.getElementById('s-name').value.trim();
    const pw   = document.getElementById('s-pw').value;
    if(!name || !pw){ showToast('이름과 비밀번호를 입력해주세요','error'); return; }

    // 이름으로 후보 조회 (동명이인 대비해 여러 명 가능)
    let cands;
    try{ const snap = await db.collection('students').where('name','==',name).get(); cands = snap.docs.map(d=>({id:d.id,...d.data()})); }
    catch(e){ cands = []; }
    if(!cands.length){ // 띄어쓰기 등 보정 fallback
      const all = await db.collection('students').get();
      cands = all.docs.map(d=>({id:d.id,...d.data()})).filter(s=>(s.name||'').trim()===name);
    }
    if(!cands.length){ showToast('등록되지 않은 이름이에요. 선생님께 문의하세요','error'); return; }

    // 1) 이미 비밀번호를 설정한 학생 중 일치하는지
    for(const c of cands){
      if(c.pwHash){ const h = await hashPw(c.id, pw); if(h===c.pwHash){ enterStudent(c); return; } }
    }
    // 2) 첫 로그인(비번 미설정) — 핸드폰 뒤4자리로 본인 확인 후 비번 설정
    const noPw = cands.filter(c=>!c.pwHash);
    if(noPw.length){
      const setupEl = document.getElementById('s-setup');
      const last4 = document.getElementById('s-last4').value.trim();
      if(setupEl.classList.contains('hidden') || !last4){
        setupEl.classList.remove('hidden');
        document.getElementById('s-pw-hint') && (document.getElementById('s-pw-hint').textContent='');
        showToast('처음 로그인이에요! 핸드폰 뒤 4자리로 본인 확인 후 비밀번호가 설정돼요','');
        return;
      }
      const target = noPw.find(c=>(c.phoneLast4||'')===last4);
      if(!target){ showToast('본인 확인 실패 — 핸드폰 뒤 4자리를 확인하세요','error'); return; }
      const h = await hashPw(target.id, pw);
      await db.collection('students').doc(target.id).update({ pwHash:h });
      showToast('비밀번호가 설정됐어요! 다음부턴 이름+비밀번호로 로그인해요 🔐','success');
      enterStudent(target); return;
    }
    // 3) 비번 설정돼 있는데 일치 안 함
    showToast('비밀번호가 틀렸어요. 기억나지 않으면 선생님께 초기화를 요청하세요','error');
  }
  function enterStudent(stu){
    if((stu.status||'재원')==='퇴원'){ showToast('퇴원 처리된 계정이에요. 선생님께 문의해주세요','error'); return; }
    const classIds = Array.isArray(stu.classIds) ? stu.classIds : (stu.classId ? [stu.classId] : []);
    const classNames = Array.isArray(stu.classNames) ? stu.classNames : (stu.className ? [stu.className] : []);
    localStorage.setItem('bm_role','student');
    localStorage.setItem('bm_studentId', stu.id);
    localStorage.setItem('bm_studentName', stu.name);
    localStorage.setItem('bm_classId', classIds[0] || '');
    localStorage.setItem('bm_classIds', JSON.stringify(classIds));
    localStorage.setItem('bm_className', classNames.join(', '));
    localStorage.removeItem('bm_demo');
    showToast(`${stu.name} 학생 환영해요!`,'success');
    setTimeout(()=> location.href='student.html', 600);
  }

  // ----- 선생님 로그인: 비밀번호 하나 -----
  async function teacherLogin(){
    const pw = document.getElementById('t-pw').value.trim();
    if(!pw){ showToast('비밀번호를 입력해주세요','error'); return; }

    const ref = db.collection('config').doc('teacher');
    const doc = await ref.get();
    const h = await hashPw('teacher', pw);   // 학생과 같은 방식 — DB엔 해시만 남김
    const d = doc.exists ? (doc.data()||{}) : null;

    // 최초 설정(문서가 없거나 비어 있음): 해시로 저장
    if(!d || (!d.pwHash && !d.password)){
      await ref.set({ pwHash: h, createdAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge:true });
      enterTeacher('선생님 비밀번호가 설정되었어요! 🎉');
      return;
    }
    // 이미 해시로 저장된 경우
    if(d.pwHash){
      if(d.pwHash === h) enterTeacher('환영합니다, 혜빈쌤!');
      else showToast('비밀번호가 틀렸어요','error');
      return;
    }
    // 예전에 평문으로 저장된 비밀번호 — 맞으면 바로 해시로 바꾸고 평문은 지웁니다 (한 번만 일어나요)
    if(d.password === pw){
      try{
        await ref.update({ pwHash: h, password: firebase.firestore.FieldValue.delete() });
      }catch(e){ console.warn('비밀번호 해시 전환 실패(로그인은 계속):', e && e.message); }
      enterTeacher('환영합니다, 혜빈쌤!');
      return;
    }
    showToast('비밀번호가 틀렸어요','error');
  }
  function enterTeacher(msg){
    localStorage.setItem('bm_role','teacher');
    localStorage.removeItem('bm_demo');
    showToast(msg,'success');
    setTimeout(()=> location.href='teacher.html', 600);
  }
  </script>
