<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>혜빈쌤 플래너</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="logo.png">
  <meta name="theme-color" content="#114C56">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary:#5B6CF5; --primary-dark:#4F46E5; --primary-light:#EEF2FF; --primary-2:#818CF8;
      --orange:#F97316; --orange-light:#FFF7ED;
      --green:#10B981; --green-light:#ECFDF5;
      --red:#F43F5E; --red-light:#FFF1F2;
      --yellow:#F59E0B; --yellow-light:#FFFBEB;
      --purple:#8B5CF6; --purple-light:#F5F3FF;
      --bg:#F4F6FB; --surface:#FFFFFF;
      --text:#0F172A; --text-sub:#334155; --text-muted:#64748B;
      --border:#E8EDF4;
      --radius:16px; --radius-sm:11px;
      --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 12px rgba(16,24,40,.05);
    }
    [data-theme="spring"]{ --primary:#E96A9E; --primary-dark:#D5588C; --primary-light:#FDF1F7; --primary-2:#F6A6C6; }
    [data-theme="summer"]{ --primary:#0EA5B7; --primary-dark:#0C8A99; --primary-light:#EBFDFF; --primary-2:#4FD1DE; }
    [data-theme="autumn"]{ --primary:#DD7A2E; --primary-dark:#C2641C; --primary-light:#FFF6EC; --primary-2:#F0A862; }
    [data-theme="winter"]{ --primary:#3F6FD1; --primary-dark:#3257AE; --primary-light:#EEF3FF; --primary-2:#7BA0E8; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;overflow-x:hidden;-webkit-text-size-adjust:100%}
    .wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
    .topbar h1{font-size:22px;font-weight:800;color:var(--primary);letter-spacing:-.5px}
    .topbar .date{font-size:14px;color:var(--text-muted)}
    .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:18px}
    .card-title{font-size:16px;font-weight:700;margin-bottom:12px}
    .btn{display:inline-flex;align-items:center;gap:5px;padding:9px 14px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .15s}
    .btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
    .btn-outline{background:var(--surface);color:var(--text-sub);border:1.5px solid var(--border)}.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
    .btn-red{background:var(--red-light);color:var(--red)}
    .btn-sm{padding:6px 11px;font-size:13px;border-radius:7px}
    .form-input,.form-select,.form-textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:15px;font-family:inherit;color:var(--text)}
    .form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--primary)}
    .form-label{display:block;font-size:13px;font-weight:600;color:var(--text-sub);margin-bottom:5px}
    .chip{display:inline-block;padding:3px 9px;border-radius:7px;font-size:13px;font-weight:600}
    .layer-btn{padding:7px 13px;border-radius:20px;font-size:14px;font-weight:700;cursor:pointer;border:2px solid var(--border);background:var(--surface);color:var(--text-muted);transition:all .15s;font-family:inherit}
    .layer-btn.on-teach{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
    .layer-btn.on-academy{border-color:var(--purple);background:var(--purple-light);color:var(--purple)}
    .layer-btn.on-personal{border-color:var(--green);background:var(--green-light);color:var(--green)}
    .todo-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border)}
    .todo-row input[type=checkbox]{width:19px;height:19px;accent-color:var(--primary);cursor:pointer;flex:0 0 auto}
    .todo-text{flex:1;font-size:15px}
    .todo-done .todo-text{text-decoration:line-through;color:var(--text-muted)}
    .toast-container{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
    .toast{background:#1E293B;color:#fff;padding:10px 20px;border-radius:24px;font-size:14px;font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:tIn .3s ease,tOut .3s ease 2.2s forwards;display:flex;align-items:center;gap:8px}
    .toast.success{background:var(--green)}.toast.error{background:var(--red)}.toast.warning{background:var(--orange)}
    @keyframes tIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes tOut{to{opacity:0;transform:translateY(8px)}}
    @media(max-width:640px){ .wrap{padding:14px 10px 50px} .card{padding:14px} }
  </style>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>📒 혜빈쌤 플래너</h1>
      <div class="date" id="todayDate"></div>
    </div>
    <a href="teacher.html" class="btn btn-outline">🏫 BEEN MATH 관리자 →</a>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px">
      <div class="card-title" style="margin:0">📆 캘린더</div>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="btn btn-outline btn-sm" onclick="pShift(-1)">◀</button>
        <strong style="font-size:17px;min-width:100px;text-align:center" id="calMonthLabel"></strong>
        <button class="btn btn-outline btn-sm" onclick="pShift(1)">▶</button>
        <button class="btn btn-outline btn-sm" onclick="pY=null;rCal()">오늘</button>

    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px" id="layerBtns"></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--text-muted);margin-bottom:10px">
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--primary-light);border:1px solid var(--primary);border-radius:2px;vertical-align:middle"></span> 수업</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--orange);border-radius:2px;vertical-align:middle"></span> 보강</span>

  <div class="card" id="jikboCard"></div>

  <div class="card">
    <div class="card-title">➕ 일정 추가</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px">
      <div><label class="form-label">제목 *</label><input class="form-input" id="ev-title" placeholder="예: 학부모 상담 / 미용실"></div>
      <div><label class="form-label">분류</label><select class="form-select" id="ev-cat"><option value="academy">🟪 학원</option><option value="personal">🟩 개인</option></select></div>
      <div><label class="form-label">날짜 *</label><input class="form-input" id="ev-date" type="date"></div>
      <div><label class="form-label">시간(선택)</label><input class="form-input" id="ev-time" placeholder="예: 15:00"></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px">
      <div><label class="form-label">반복</label><select class="form-select" id="ev-repeat" onchange="document.getElementById('ev-rend-wrap').style.display=this.value?'':'none'"><option value="">반복 없음</option><option value="daily">매일</option><option value="weekly">매주</option><option value="monthly">매월</option></select></div>
      <div id="ev-rend-wrap" style="display:none"><label class="form-label">반복 종료일(선택)</label><input class="form-input" id="ev-rend" type="date"></div>
      <div style="grid-column:span 2"><label class="form-label">메모(선택)</label><input class="form-input" id="ev-note" placeholder="메모"></div>

  <div class="card">
    <div class="card-title">🗓️ 다가오는 일정 <span style="font-size:13px;color:var(--text-muted);font-weight:400">(2주)</span></div>
    <div id="upcomingList"></div>
  </div>

  <div class="card">
    <div class="card-title">✅ 투두리스트</div>
    <div style="display:flex;gap:8px;margin-bottom:6px">
      <input class="form-input" id="todo-text" placeholder="할 일을 입력하고 Enter" onkeydown="if(event.key==='Enter')doAddTodo()">
      <input class="form-input" id="todo-due" type="date" style="max-width:160px" title="마감일(선택)">
      <button class="btn btn-primary" onclick="doAddTodo()">추가</button>
    </div>
    <div id="todoList"></div>

<!-- Firebase SDK (compat) -->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-init.js?v=2026072602"></script>

<script>
// ================================================================
// 혜빈쌤 플래너 — 강사(자동) + 학원 + 개인 3단 캘린더 / 투두 / 반복일정
// ================================================================
requireRole('teacher');   // 선생님만 접근

function showToast(msg,type=''){ const el=document.createElement('div'); el.className='toast '+type; el.textContent=msg; document.getElementById('toastContainer').appendChild(el); setTimeout(()=>el.remove(),2700); }
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{ const n=new Date(); return `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`; };
const fmtMD=s=>s?s.slice(5).replace('-','/'):'';

// ----- 데이터 -----
let P_CLASSES=[], P_MAKEUPS=[], P_EXAMS=[], P_EVENTS=[], P_TODOS=[], P_STUDENTS=[];
async function loadAll(){
  const [c,m,e,ev,td,st]=await Promise.all([
    db.collection('classes').get(), db.collection('makeups').get(),
    db.collection('schoolExams').get(), db.collection('planEvents').get(), db.collection('planTodos').get(),
    db.collection('students').get()
  ]);
  P_CLASSES=c.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
  P_MAKEUPS=m.docs.map(d=>({id:d.id,...d.data()}));
  P_EXAMS=e.docs.map(d=>{ const x={id:d.id,...d.data()}; if(x.school) x.school=normSchool(x.school); return x; });
  P_EVENTS=ev.docs.map(d=>({id:d.id,...d.data()}));
  P_TODOS=td.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.done?1:0)-(b.done?1:0)||(a.ts||0)-(b.ts||0));
  P_STUDENTS=st.docs.map(d=>{ const x={id:d.id,...d.data()}; if(x.school) x.school=normSchool(x.school); return x; })
    .filter(s=>((s.status||'재원')==='재원'));  // 휴원·퇴원 제외
  _JB_CACHE.clear();   // 시험 일정이 바뀌면 계산해 둔 직보 날짜도 다시 뽑는다
}
// ===== 직보(시험 전 직접보강) 자동 생성 =====
//  규칙: 학생의 수학시험일 전 N일(기본 3) 동안 직보.
//        그 날이 시험기간 안이면 2시(학교시험 봄), 밖이면 5시.
// 🏫 '부흥고'와 '부흥고등학교'를 같은 학교로 본다 — 선생님 화면과 같은 규칙.
function normSchool(v){ return (v||'').trim().replace(/고등학교$/,'고'); }
function dStr(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function mondayOf(date){ const d=new Date(date); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); d.setHours(0,0,0,0); return d; }
function addDaysStr(dateStr, delta){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+delta); return dStr(d); }
// 특정 날짜의 직보 엔트리: [{school, time, students:[names]}]
// 🔶 직보 날짜 — 선생님 화면(teacher.html)과 글자 그대로 같은 규칙.
//   여기만 예전 규칙으로 남아 있어서 플래너에 10/5 신성·관양, 10/6 과천중앙·백운이 안 떴다.
//   수학시험 전날부터 거슬러 올라가며, 쉬는 날(주말·공휴일)이 이어지는 동안 계속 잡고
//   그 앞의 평일 하루까지 잡는다. 쉬는 날이 없으면 자연히 '전날 하루'가 된다.
//     · 주말 낀 월요일 시험 → 금·토·일 / 주말 낀 화요일 시험 → 금·토·일·월
//   단, 바로 다음 날 '다른 과목' 시험이 있으면 그날은 쉰다 — 그 과목을 공부해야 하니까.
//     예) 10/7(수) 수학, 10/6(화) 다른 과목 → 10/5(월)은 쉬고 10/6(화)에 직보.
//   '직보 시작일'을 지정하면 그 날부터 마지막 수학 전날까지가 우선한다.
function jikboIsOff(ds){ const dow=new Date(ds+'T00:00:00').getDay(); return dow===0||dow===6||!!holidayName(ds); }
function jikboInPeriod(e, ds){ return !!(e && e.startDate && e.endDate && ds>=e.startDate && ds<=e.endDate); }
// 전날 하루에서 더 거슬러 올라갈 것인가 — 시험 기간 안의 쉬는 날일 때만.
//   주말 직보는 주말을 끼고 시험을 보는 학교 것이다.
//   우성고 시험 10/13~10/16 — 10/9~10/11 연휴는 시험 전이라 관계가 없다. 전날 10/12 하루만.
function jikboGoBack(e, d, prev){
  if(jikboIsOff(d)) return jikboInPeriod(e, d);
  return jikboIsOff(prev) && jikboInPeriod(e, prev);
}
// 그날 학교에서 실제로 시험을 보는가 — 기간 안이라도 주말·공휴일엔 안 본다.
function jikboIsExamDay(e, ds){
  if(!e || !e.startDate || !e.endDate) return false;
  if(ds < e.startDate || ds > e.endDate) return false;
  return !jikboIsOff(ds);
}
// 🛑 직보를 쉬는 날 — 내일이 수학이면 바로 그게 직보하는 날이므로 쉬지 않는다.
function jikboRestDay(e, ds, mathSet){
  const next=addDaysStr(ds,1);
  if(mathSet && mathSet.has(next)) return false;
  return jikboIsExamDay(e, next);
}
// 직보 시간 — 토·일·공휴일 12시 / 금요일 3시 / 그 밖의 평일은 그날 학교시험 O 2시, X 5시
function jikboTime(ds, e){
  const dow=new Date(ds+'T00:00:00').getDay();
  if(dow===0||dow===6||holidayName(ds)) return '12:00';
  if(dow===5) return '15:00';
  const inExam=!!(e && e.startDate && e.endDate && ds>=e.startDate && ds<=e.endDate);
  return inExam ? '14:00' : '17:00';
}
// 이 시험의 직보 날짜 목록(YYYY-MM-DD[])
//   달력이 날짜마다 다시 부르니(28일 × 학교 수) 시험별로 한 번만 계산해 둔다.
const _JB_CACHE=new Map();
function jikboDates(e){
  const ck=(e&&e.id)||'';
  if(ck && _JB_CACHE.has(ck)) return _JB_CACHE.get(ck);
  const mds=examMathDates(e).map(m=>m.date).filter(Boolean).sort();
  let out=[];
  if(mds.length){
    const set=new Set();
    if(e.jikboStart){ const last=mds[mds.length-1]; let d=e.jikboStart; while(d<last){ set.add(d); d=addDaysStr(d,1); } }
    else mds.forEach(md=>{
      let d=addDaysStr(md,-1);
      for(let i=0;i<9;i++){                              // 연휴가 길어도 9일까지만 거슬러 올라간다
        set.add(d);
        const prev=addDaysStr(d,-1);
        if(!jikboGoBack(e, d, prev)) break;               // 기간 안의 쉬는 날이 이어질 때만 더 간다
        d=prev;
      }
    });
    mds.forEach(md=>set.delete(md));                     // 수학 시험 당일은 제외
    const mathSet=new Set(mds);
    out=[...set].filter(d=>!jikboRestDay(e, d, mathSet)).sort();
  }
  if(ck) _JB_CACHE.set(ck, out);
  return out;
}
// ⏱ 쌤이 직보 일정 표에서 시간을 고쳤으면 그 시간이 규칙보다 우선한다.
//   (선생님 화면 doSetMakeupTime → makeups.time / timeFixed)
function jikboSavedTime(dateStr, school){
  const sc=normSchool(school||''); if(!sc) return '';
  const list=(P_MAKEUPS||[]).filter(m=>m.date===dateStr && String(m.time||'').trim());
  const hit=list.find(m=>normSchool(m.school||'')===sc) || list.find(m=>String(m.className||'').includes(sc));
  if(!hit) return '';
  const t=String(hit.time).trim();
  return t.endsWith('~') ? t.slice(0,-1) : t;     // '14:00~' → '14:00' (칸 표기에 맞춘다)
}
function jikboTimeOf(dateStr, e){ return jikboSavedTime(dateStr, e&&e.school) || jikboTime(dateStr, e); }
function jikboOn(dateStr){
  const bySchoolTime={}; // key: school|time
  P_EXAMS.forEach(e=>{
    if(!e.school) return;
    const studs=P_STUDENTS.filter(s=>(s.school||'')===e.school && !isJikboExcluded(s));
    if(!studs.length) return;
    if(!jikboDates(e).includes(dateStr)) return;
    const time = jikboTimeOf(dateStr, e);
    const key=e.school+'|'+time;
    if(!bySchoolTime[key]) bySchoolTime[key]={school:e.school, time, students:[]};
    studs.forEach(s=>{ if(!bySchoolTime[key].students.includes(s.name)) bySchoolTime[key].students.push(s.name); });
  });
  return Object.values(bySchoolTime).sort((a,b)=>(a.time).localeCompare(b.time)||a.school.localeCompare(b.school));
}
// 담임 반인지 — role 지정 시 그 값, 미지정이면 이름의 X/Y/Z를 부담임으로 추정(기존 데이터 호환)
function classIsHomeroom(c){ if(!c) return true; if(c.role) return c.role==='담임'; return !/[XYZ]/.test(c.name||''); }
// 🙈 직보에서 빼는 학생 — 부담임 반(X/Y/Z)만 다니거나, 반이 아예 없는 학생.
//   담임 반이 하나라도 있으면 부담임 반을 같이 다녀도 그대로 넣는다.
//   반이 없으면 담임인지 알 수가 없어서 인원에 안 넣는다 (선생님 화면과 같은 기준).
function isJikboExcluded(s){
  const ids=Array.isArray(s.classIds)?s.classIds:(s.classId?[s.classId]:[]);
  const cls=ids.map(id=>P_CLASSES.find(x=>x.id===id)).filter(Boolean);
  if(!cls.length) return true;              // 반이 없으면 뺀다
  return !cls.some(classIsHomeroom);        // 담임 반이 하나도 없으면(전부 부담임) 제외
}
// 그날 직보 오는 학생 id 집합
function jikboStudentIdsOn(dateStr){
  const set=new Set();
  P_EXAMS.forEach(e=>{
    if(!e.school || !jikboDates(e).includes(dateStr)) return;
    P_STUDENTS.forEach(s=>{ if((s.school||'')===e.school && !isJikboExcluded(s)) set.add(s.id); });
  });
  return set;
}
// 그날 정규수업이 있는 학생 id 집합 (해당 요일·활성 정규반)
function regularStudentIdsOn(dateStr){
  const wd=['sun','mon','tue','wed','thu','fri','sat'][new Date(dateStr+'T00:00:00').getDay()];
  const clsIds=new Set(P_CLASSES.filter(c=>c.weekday===wd && isClassActive(c,dateStr) && (!c.type||c.type==='정규')).map(c=>c.id));
  const set=new Set();
  if(!clsIds.size) return set;
  P_STUDENTS.forEach(s=>{ const ids=Array.isArray(s.classIds)?s.classIds:(s.classId?[s.classId]:[]); if(ids.some(id=>clsIds.has(id))) set.add(s.id); });
  return set;
}
// 그 학생이 '다음 날' 타과목 시험을 보는지 (다음날이 시험기간 안 + 수학시험일 아님)
function hasOtherExamNextDay(s, dateStr){
  const next=addDaysStr(dateStr,1);
  return P_EXAMS.some(e=>{
    if((s.school||'')!==e.school || !(e.startDate&&e.endDate)) return false;
    if(!(next>=e.startDate && next<=e.endDate)) return false;       // 다음날이 시험기간 안
    if(jikboIsOff(next)) return false;                             // 주말·공휴일엔 시험을 안 본다
    return !examMathDates(e).map(m=>m.date).includes(next);          // 수학시험일이 아니면 = 타과목
  });
}

const JB_DOW=['월','화','수','목','금','토','일'];

function jbShift(n){ const d=new Date(jbWeekStart||mondayOf(new Date())); d.setDate(d.getDate()+n); jbWeekStart=mondayOf(d); rJikbo(); }

// 📸 지금 화면을 그대로 찍는다 — 먼저 보여주고, 보고 나서 저장하거나 보낸다.
//   바로 내려받거나 공유창이 뜨면 뭘 보내는지 못 보고 보내게 된다.
let _jbShotLib=null, _jbShotBlob=null, _jbShotName='';
function jbLoadShot(){
  if(window.html2canvas) return Promise.resolve();
  if(_jbShotLib) return _jbShotLib;
  _jbShotLib=new Promise((res,rej)=>{
    const t=document.createElement('script');
    t.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    t.onload=()=>res(); t.onerror=()=>{ _jbShotLib=null; rej(new Error('인터넷에서 못 불러왔어요')); };
    document.head.appendChild(t);
  });
  return _jbShotLib;
}
function closeJbShot(){ const m=document.getElementById('jbShotModal'); if(m) m.style.display='none'; }
async function jbCapture(){
  const card=document.getElementById('jikboCard'); if(!card) return;
  const btn=document.getElementById('jbShotBtn'), label=btn?btn.innerHTML:'';
  if(btn){ btn.disabled=true; btn.innerHTML='만드는 중…'; }
  // 버튼 줄은 그림에서 빼고, 옆으로 넘겨 보던 부분까지 다 펼쳐서 찍는다
  const wraps=[...card.querySelectorAll('[data-jbscroll]')], hides=[...card.querySelectorAll('[data-jbhide]')];
  const keepW=card.style.width;
  wraps.forEach(w=>{ w.dataset.ov=w.style.overflowX||''; w.style.overflowX='visible'; });
  hides.forEach(h=>{ h.dataset.dp=h.style.display||''; h.style.display='none'; });
  try{
    await jbLoadShot();
    const w=Math.max(card.scrollWidth, 720);
    card.style.width=w+'px';
    const canvas=await html2canvas(card, {scale:2, backgroundColor:'#ffffff', width:w, windowWidth:w+48, useCORS:true});
    _jbShotName=`직보_${todayStr()}.png`;
    _jbShotBlob=await new Promise(r=>canvas.toBlob(r,'image/png'));
    const pv=document.getElementById('jbShotPreview');
    if(pv) pv.innerHTML=`<img src="${canvas.toDataURL('image/png')}" alt="직보 일정" style="width:100%;display:block">`;
    // 보내기는 그게 되는 기기에서만 (안 되면 저장만)
    const sb=document.getElementById('jbShotShareBtn');
    if(sb){
      let can=false;
      try{ can=!!(navigator.canShare && _jbShotBlob && navigator.canShare({files:[new File([_jbShotBlob], _jbShotName, {type:'image/png'})]})); }catch(err){}
      sb.style.display = can ? '' : 'none';
    }
    const m=document.getElementById('jbShotModal'); if(m) m.style.display='flex';
  }catch(e){ showToast('캡처 실패: '+(e&&e.message||e),'error'); }
  finally{
    card.style.width=keepW;
    wraps.forEach(w=>{ w.style.overflowX=w.dataset.ov; delete w.dataset.ov; });
    hides.forEach(h=>{ h.style.display=h.dataset.dp; delete h.dataset.dp; });
    if(btn){ btn.disabled=false; btn.innerHTML=label; }
  }
}
// 📋 그림을 클립보드로 — 카톡에 그대로 붙여넣기 하려고
async function jbShotCopy(){
  if(!_jbShotBlob) return;
  try{
    if(!(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write)) throw new Error('이 브라우저는 그림 복사를 아직 못 해요');
    await navigator.clipboard.write([new ClipboardItem({'image/png': _jbShotBlob})]);
    showToast('복사했어요 — 카톡에 붙여넣기 하세요 📋','success');
  }catch(e){ showToast('복사가 안 돼요: '+(e&&e.message||e)+' — 그림을 오른쪽 클릭해 복사해 주세요','error'); }
}
function jbShotSave(){
  if(!_jbShotBlob) return;
  const url=URL.createObjectURL(_jbShotBlob);
  const a=document.createElement('a'); a.href=url; a.download=_jbShotName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
  showToast('사진으로 저장했어요 📸','success');
}
async function jbShotShare(){
  if(!_jbShotBlob) return;
  try{ await navigator.share({files:[new File([_jbShotBlob], _jbShotName, {type:'image/png'})], title:'직보 일정'}); }
  catch(e){ if(e && e.name!=='AbortError') showToast('보내기 실패: '+e.message,'error'); }
}
// 그날 정규수업에 올 것 같은 학생 — 직보 가는 학생과 다음 날 시험인 학생은 뺀다
function classComingOn(ds){
  const J=jikboStudentIdsOn(ds), R=regularStudentIdsOn(ds), names=[];
  R.forEach(id=>{
    if(J.has(id)) return;
    const st=P_STUDENTS.find(x=>x.id===id); if(!st) return;
    if(hasOtherExamNextDay(st, ds)) return;
    names.push(st.name);
  });
  return names;
}
// 그날 수업을 부(1부·2부·3부)로 나눠 센다 — 몇 시에 몇 명이 오는지가 필요하다.
//   한 학생이 1부·2부를 다 들으면 양쪽에 다 센다(실제로 두 번 온다).
function classSlotsOn(ds){
  const wd=['sun','mon','tue','wed','thu','fri','sat'][new Date(ds+'T00:00:00').getDay()];
  const J=jikboStudentIdsOn(ds);
  const cls=P_CLASSES.filter(c=>c.weekday===wd && isClassActive(c,ds) && (!c.type||c.type==='정규'))
    .sort((a,b)=>String(a.slot||'').localeCompare(String(b.slot||'')) || (a.order||0)-(b.order||0));
  return cls.map(c=>{
    const names=P_STUDENTS.filter(st=>{
      const ids=Array.isArray(st.classIds)?st.classIds:(st.classId?[st.classId]:[]);
      if(!ids.includes(c.id)) return false;
      if(J.has(st.id)) return false;                   // 그날 직보 가는 학생
      if(hasOtherExamNextDay(st, ds)) return false;    // 다음 날 학교 시험이 있는 학생
      return true;
    }).map(st=>st.name);
    return { slot:(c.slot||'').trim(), name:c.name, n:names.length, names };
  });
}
// 직보 하루 칸
function jikboDayCell(d,i,tStr){
  const ds=dStr(d);
  const entries=jikboOn(ds);
  const N=jikboStudentIdsOn(ds).size, M=classComingOn(ds).length, total=N+M;
  const slots=classSlotsOn(ds).filter(x=>x.n);          // 아무도 안 오는 반은 굳이 안 적는다
  const isToday=ds===tStr, hol=holidayName(ds), isSel=ds===selDate;
  const math=[]; P_EXAMS.forEach(e=>examMathDates(e).forEach(m=>{ const nm=shortSchool(e.school); if(m.date===ds && nm && math.indexOf(nm)<0) math.push(nm); }));
  let c=`<div onclick="jbPick('${ds}')" title="누르면 아래에서 누가 오고 누가 빠지는지 봐요" style="cursor:pointer;min-width:0;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:${isToday?'var(--primary-light)':'var(--surface)'};${isSel?'box-shadow:inset 0 0 0 2px var(--primary)':''}">`;
  c+=`<div style="text-align:center;padding:6px 3px;background:${(i>=5||hol)?'#FEF2F2':'var(--bg)'};font-weight:800;font-size:16px;color:${i===6?'#EF4444':(i===5?'#2563EB':'var(--text-sub)')}">${JB_DOW[i]}
    <span style="font-weight:800;color:var(--text);margin-left:3px">${d.getMonth()+1}/${d.getDate()}</span>
    ${hol?`<div style="font-size:12.5px;font-weight:700;color:#EA580C">${hol}</div>`:''}
    ${math.length?`<div style="font-size:12.5px;font-weight:800;color:#DC2626">📐 ${math.join(' ')}</div>`:''}</div>`;
  c+=`<div style="padding:6px;min-height:52px">`;
  if(entries.length){
    // 같은 시간에 오는 학교는 시간 한 줄 아래에 모아 적는다 — 시간이 네 번 반복되면 읽기 어렵다
    const byTime={};
    entries.forEach(e=>{ (byTime[e.time]=byTime[e.time]||[]).push(e); });
    Object.keys(byTime).sort().forEach(tm=>{
      const list=byTime[tm], tot=list.reduce((a,x)=>a+x.students.length,0);
      c+=`<div style="margin-bottom:7px">
        <div style="font-size:13.5px;font-weight:800;color:var(--orange);word-break:keep-all">🔶${tm} <span style="font-size:14.5px">${tot}명</span></div>
        ${list.map(x=>`<div style="font-size:13.5px;line-height:1.45;word-break:keep-all;margin-top:2px">
          <span style="font-weight:800;color:#C2410C">${shortSchool(x.school)} ${x.students.length}명</span>
          <span style="color:var(--text-sub)"> ${x.students.join(', ')}</span></div>`).join('')}</div>`;
    });
  } else if(!total){ c+='<div style="font-size:14px;color:var(--text-muted);text-align:center;padding:8px 0">-</div>'; }
  if(total){ c+=`<div style="font-size:14px;font-weight:800;border-top:1px dashed var(--border);padding-top:5px;margin-top:3px;line-height:1.6;word-break:keep-all">
    ${N?`<div style="color:var(--orange)">직보 <span style="font-size:16px">${N}</span>명</div>`:''}
    ${slots.map(x=>`<div title="${x.name} — ${x.names.join(', ')}" style="color:var(--primary)">${x.slot||x.name} <span style="font-size:16px">${x.n}</span>명</div>`).join('')}
    <div style="font-size:17px;color:var(--text);margin-top:2px">총 ${total}명</div></div>`; }
  c+='</div></div>';
  return {html:c, N, total};
}

function isClassActive(c, dateStr){
  if(c.endDate && dateStr>c.endDate) return false;
  if(c.startDate && dateStr<c.startDate) return false;
  return true;
}
function examMathDates(e){
  if(Array.isArray(e.mathDates)&&e.mathDates.length) return e.mathDates.filter(m=>m&&m.date);
  if(e.mathDate) return [{label:'수학', date:e.mathDate}];
  return [];
}
// 반복 일정이 해당 날짜에 발생하는지
function occursOn(ev, dateStr){
  if(!ev.repeat) return ev.date===dateStr;
  if(dateStr<ev.date) return false;
  if(ev.repeatEnd && dateStr>ev.repeatEnd) return false;
  const d=new Date(dateStr+'T00:00:00'), s=new Date(ev.date+'T00:00:00');
  if(ev.repeat==='daily') return true;
  if(ev.repeat==='weekly') return d.getDay()===s.getDay();
  if(ev.repeat==='monthly') return d.getDate()===s.getDate();
  return false;
}

function dayItems(dateStr){

    // 직보: 직보 카드와 동일하게 계산해서 표시
    const _jb=jikboOn(dateStr);
    if(_jb.length){ const cnt=_jb.reduce((a,e)=>a+e.students.length,0); items.push({type:'jikbo',text:'🔶 직보',sub:_jb.map(e=>e.time+' '+e.school).join(', ')+' · '+cnt+'명'}); }
    // 보강: 자동 직보 찌꺼기 제외, 실제 보강만
    P_MAKEUPS.filter(m=>m.date===dateStr && !m.auto && !((m.className||'').includes('직보'))).forEach(m=>items.push({type:'makeup',text:'🔶 '+(m.className||'보강'),sub:(m.time||'')+(m.note?' · '+m.note:'')}));
    P_EXAMS.forEach(e=>examMathDates(e).forEach(m=>{ if(m.date===dateStr) items.push({type:'math',text:'📐 '+(e.school||'')+' '+(m.label||'수학'),sub:e.title||''}); }));
  }
  if(layers.academy) P_EVENTS.filter(e=>e.category==='academy'&&occursOn(e,dateStr)).forEach(e=>items.push({type:'academy',text:e.title,sub:(e.time||'')+(e.note?' · '+e.note:''),id:e.id,repeat:e.repeat}));
  if(layers.personal) P_EVENTS.filter(e=>e.category==='personal'&&occursOn(e,dateStr)).forEach(e=>items.push({type:'personal',text:e.title,sub:(e.time||'')+(e.note?' · '+e.note:''),id:e.id,repeat:e.repeat}));
  return items;
}
function examShade(dateStr){ return layers.teach && P_EXAMS.some(e=>e.startDate&&e.endDate&&dateStr>=e.startDate&&dateStr<=e.endDate); }
// 🇰🇷 공휴일 — 날짜 고정(매년) + 해마다 바뀌는 것(음력·대체공휴일)은 연도별로
const HOLIDAY_FIXED={'01-01':'신정','03-01':'삼일절','05-05':'어린이날','06-06':'현충일','08-15':'광복절','10-03':'개천절','10-09':'한글날','12-25':'성탄절'};
const HOLIDAY_YEAR={
  '2026':{'02-16':'설날','02-17':'설날','02-18':'설날','03-02':'대체공휴일','05-24':'부처님오신날','05-25':'대체공휴일',
          '06-03':'지방선거','08-17':'대체공휴일','09-24':'추석','09-25':'추석','09-26':'추석','10-05':'대체공휴일'},
  // 2027년 — 설날 2/6(토)·추석 9/15(수). 광복절·개천절은 일요일, 한글날·성탄절은 토요일이라 대체공휴일이 붙어요
  '2027':{'02-05':'설날','02-06':'설날','02-07':'설날','02-08':'대체공휴일','05-13':'부처님오신날',
          '08-16':'대체공휴일','09-14':'추석','09-15':'추석','09-16':'추석','10-04':'대체공휴일','10-11':'대체공휴일','12-27':'대체공휴일'}
};
function holidayName(ds){ const y=(ds||'').slice(0,4), md=(ds||'').slice(5); return (HOLIDAY_YEAR[y]&&HOLIDAY_YEAR[y][md]) || HOLIDAY_FIXED[md] || ''; }
// 📕 그날 시험기간인 학교들 (캘린더에 어느 학교 시험인지 바로 보이게)
function shortSchool(s){ return (s||'').replace(/고등학교$/,'').replace(/중학교$/,'').replace(/고$/,'').replace(/중$/,''); }
function examSchoolsOn(dateStr){
  if(!layers.teach) return [];
  return [...new Set(P_EXAMS.filter(e=>e.startDate&&e.endDate&&dateStr>=e.startDate&&dateStr<=e.endDate).map(e=>shortSchool(e.school)).filter(Boolean))];
}
const ITEM_STYLE={
  class:'color:var(--primary);background:var(--primary-light)',
  jikbo:'color:#fff;background:var(--orange)',
  makeup:'color:#fff;background:var(--orange)',
  math:'color:#DC2626;background:transparent;font-weight:800;padding-left:0',
  academy:'color:var(--purple);background:var(--purple-light)',
  personal:'color:var(--green);background:var(--green-light)'
};
function rCal(){
  const now=new Date();
  if(pY==null){ pY=now.getFullYear(); pM=now.getMonth(); }
  document.getElementById('calMonthLabel').textContent=`${pY}년 ${pM+1}월`;
  const firstDow=new Date(pY,pM,1).getDay(), dim=new Date(pY,pM+1,0).getDate();
  const cells=[]; for(let i=0;i<firstDow;i++) cells.push(null); for(let d=1;d<=dim;d++) cells.push(d); while(cells.length%7) cells.push(null);
  const tStr=todayStr();
  const dowL=['일','월','화','수','목','금','토'];
  let h=`<div style="display:grid;grid-template-columns:repeat(7,minmax(88px,1fr));gap:4px;min-width:650px">`;
  h+=dowL.map((l,i)=>`<div style="text-align:center;font-size:14px;font-weight:800;color:${i===0?'#EF4444':(i===6?'#2563EB':'var(--text-muted)')};padding:3px">${l}</div>`).join('');
  h+=cells.map(d=>{
    if(!d) return '<div></div>';
    const dateStr=`${pY}-${pad(pM+1)}-${pad(d)}`;
    const dow=new Date(pY,pM,d).getDay();
    const items=dayItems(dateStr);
    const shade=examShade(dateStr);
    const isToday=dateStr===tStr, isSel=dateStr===selDate;
    let cell=`<div onclick="selDate='${dateStr}';rDayDetail();rCal()" style="cursor:pointer;min-height:104px;border:1px solid var(--border);border-radius:8px;padding:5px 6px;background:${shade?'#FEF2F2':(isToday?'var(--primary-light)':'var(--surface)')};${isSel?'box-shadow:inset 0 0 0 2px var(--primary)':''}">`;
    const _hol=holidayName(dateStr);
    cell+=`<div style="font-size:16px;font-weight:800;color:${(_hol||dow===0)?'#EF4444':(dow===6?'#2563EB':'var(--text-sub)')}">${d}${shade?' <span style="font-size:13px;color:#DC2626">📕</span>':''}</div>`;
    if(_hol) cell+=`<div style="font-size:12.5px;font-weight:800;color:#EA580C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">🇰🇷 ${_hol}</div>`;
    const _exS=examSchoolsOn(dateStr);
    // 학교마다 한 줄씩 (겹쳐도 다 보이게)
    _exS.forEach(s=>{ cell+=`<div title="${s} 시험기간" style="font-size:12.5px;font-weight:800;color:#B91C1C;background:#FEE2E2;border-radius:4px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">📕 ${s}</div>`; });
    items.slice(0,5).forEach(it=>{ cell+=`<div style="font-size:13px;font-weight:600;border-radius:4px;padding:2px 4px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;${ITEM_STYLE[it.type]}">${it.text}</div>`; });
    if(items.length>5) cell+=`<div style="font-size:12.5px;color:var(--text-muted);margin-top:2px">+${items.length-5}개 더</div>`;
    cell+='</div>'; return cell;
  }).join('');
  h+='</div>';
  document.getElementById('calGrid').innerHTML=h;
}

// ----- 선택 날짜 상세 -----
// 그날 정규수업별 출결 예상 — 직보 가는 학생 / 다음날 타과목 시험 학생은 '빠짐'으로 분리
// 🔶 그날 직보에 오는 학생 — 시간·학교별로
function jikboRosterHtml(dateStr){
  const on=jikboOn(dateStr);
  if(!on.length) return '';
  const total=on.reduce((a,x)=>a+x.students.length,0);
  return `<div style="margin-top:10px;border-top:1px dashed var(--border);padding-top:10px">
    <div style="font-size:14px;font-weight:700;margin-bottom:6px">🔶 직보 <span style="color:var(--orange)">${total}명</span></div>
    ${on.map(x=>`<div style="background:#FFF7ED;border-radius:8px;padding:8px 10px;margin-bottom:6px">
      <div style="font-size:14px;font-weight:800;color:#C2410C">${x.time} ${shortSchool(x.school)} <span style="font-size:13px">${x.students.length}명</span></div>
      <div style="font-size:13.5px;color:var(--text-sub);margin-top:3px">${x.students.join(', ')}</div>
    </div>`).join('')}</div>`;
}
function classAttendanceHtml(dateStr){
  const wd=['sun','mon','tue','wed','thu','fri','sat'][new Date(dateStr+'T00:00:00').getDay()];
  const classes=P_CLASSES.filter(c=>c.weekday===wd && isClassActive(c,dateStr) && (!c.type||c.type==='정규')).sort((a,b)=>(a.slot||'').localeCompare(b.slot||''));
  if(!classes.length) return '';
  const jb=jikboStudentIdsOn(dateStr);
  let html='<div style="margin-top:10px;border-top:1px dashed var(--border);padding-top:10px"><div style="font-size:14px;font-weight:700;margin-bottom:6px">👥 수업별 출결 예상 <span style="font-size:12.5px;color:var(--text-muted);font-weight:400">(직보·다음날 시험 학생은 빠짐)</span></div>';
  classes.forEach(c=>{
    const roster=P_STUDENTS.filter(s=>{ const ids=Array.isArray(s.classIds)?s.classIds:(s.classId?[s.classId]:[]); return ids.includes(c.id); });
    const coming=[], jikbo=[], exam=[];
    roster.forEach(s=>{ if(jb.has(s.id)) jikbo.push(s.name); else if(hasOtherExamNextDay(s,dateStr)) exam.push(s.name); else coming.push(s.name); });
    html+=`<div style="background:var(--bg);border-radius:8px;padding:8px 10px;margin-bottom:6px">
      <div style="font-size:14px;font-weight:700">${c.slot?`<span style="color:var(--primary)">${c.slot}</span> `:''}${c.name} <span style="font-size:12.5px;color:var(--text-muted)">${c.startTime&&c.endTime?(c.startTime+'~'+c.endTime):''}</span> · <span style="color:var(--green)">올 ${coming.length}명</span>${(jikbo.length+exam.length)?` / <span style="color:var(--text-muted)">빠짐 ${jikbo.length+exam.length}명</span>`:''}</div>
      <div style="font-size:13px;color:var(--text-sub);margin-top:3px">✅ ${coming.join(', ')||'-'}</div>
      ${jikbo.length?`<div style="font-size:13px;color:var(--orange);margin-top:2px">🔶 직보로 빠짐: ${jikbo.join(', ')}</div>`:''}
      ${exam.length?`<div style="font-size:13px;color:var(--red);margin-top:2px">📝 다음날 시험 준비: ${exam.join(', ')}</div>`:''}
    </div>`;
  });
  return html+'</div>';
}
function rDayDetail(){
  const el=document.getElementById('dayDetail');
  const items=dayItems(selDate);
  const d=new Date(selDate+'T00:00:00');
  const label=`${d.getMonth()+1}월 ${d.getDate()}일 (${['일','월','화','수','목','금','토'][d.getDay()]})`;
  el.innerHTML=`<div class="card" style="border-left:4px solid var(--primary)">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px">
      <div class="card-title" style="margin:0">📌 ${label}</div>
      <button class="btn btn-outline btn-sm" onclick="document.getElementById('ev-date').value='${selDate}';document.getElementById('ev-title').focus();showToast('아래 일정 추가 폼에 날짜를 채웠어요 ✍️')">이 날짜에 일정 추가</button>
    </div>
    ${items.length?items.map(it=>`
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid var(--border)">
        <div><span class="chip" style="${ITEM_STYLE[it.type]}">${it.text}</span> <span style="font-size:13px;color:var(--text-muted)">${it.sub||''}${it.repeat?' · 🔁'+({daily:'매일',weekly:'매주',monthly:'매월'}[it.repeat]||''):''}</span></div>
        ${it.id?`<button class="btn btn-red btn-sm" onclick="doDelEvent('${it.id}')">삭제</button>`:''}
      </div>`).join(''):'<div style="color:var(--text-muted);padding:10px;font-size:14px">이 날은 일정이 없어요 🍃</div>'}
    ${jikboRosterHtml(selDate)}
    ${classAttendanceHtml(selDate)}
  </div>`;
}

// ----- 오늘 브리핑 -----
function rBriefing(){
  const t=todayStr();
  const items=dayItems(t).filter(it=>['class','makeup','math'].includes(it.type)||true);
  const cls=items.filter(i=>i.type==='class'), mks=items.filter(i=>i.type==='makeup'), jbs=items.filter(i=>i.type==='jikbo');
  const evs=items.filter(i=>i.type==='academy'||i.type==='personal');
  const examsNow=P_EXAMS.filter(e=>e.startDate&&e.endDate&&t>=e.startDate&&t<=e.endDate);
  const dueTodos=P_TODOS.filter(x=>!x.done&&x.due&&x.due<=t);
  const within7=[]; P_EXAMS.forEach(e=>examMathDates(e).forEach(m=>{ const diff=Math.round((new Date(m.date+'T00:00:00')-new Date(t+'T00:00:00'))/86400000); if(diff>=0&&diff<=7) within7.push(`${e.school} ${m.label} D-${diff===0?'DAY':diff}`); }));
  document.getElementById('briefing').innerHTML=`<div class="card" style="background:linear-gradient(135deg,var(--primary) 0%,var(--primary-2) 100%);color:#fff">
    <div style="font-size:17px;font-weight:800;margin-bottom:10px">☀️ 오늘 브리핑</div>
    <div style="display:flex;flex-direction:column;gap:6px;font-size:15px">
      <div>📚 수업 ${cls.length?cls.map(c=>`<strong>${c.text}</strong>`).join(', '):'없음'}</div>
      ${jbs.length?`<div>🔶 직보 <strong>${jbs.map(j=>j.sub||'').join(' / ')}</strong></div>`:''}
      ${mks.length?`<div>🔶 보강 ${mks.map(m=>`<strong>${m.text.replace('🔶 ','')}</strong> ${m.sub||''}`).join(', ')}</div>`:''}
      ${examsNow.length?`<div>📕 시험기간 진행중: ${examsNow.map(e=>e.school).join(', ')}</div>`:''}
      ${within7.length?`<div>📐 다가오는 수학시험: ${within7.join(' · ')}</div>`:''}
      ${evs.length?`<div>🗓️ 오늘 일정: ${evs.map(e=>e.text).join(', ')}</div>`:''}
      <div>${dueTodos.length?`⚠️ 마감 할 일 <strong>${dueTodos.length}개</strong>: ${dueTodos.slice(0,3).map(x=>x.text).join(', ')}${dueTodos.length>3?'…':''}`:'✅ 마감 임박 할 일 없음'}</div>
    </div>
  </div>`;
}

// ----- 일정 CRUD -----
async function doAddEvent(){
  const title=document.getElementById('ev-title').value.trim();
  const date=document.getElementById('ev-date').value;
  if(!title||!date){ showToast('제목과 날짜를 입력해주세요','error'); return; }
  const data={ title, category:document.getElementById('ev-cat').value, date,
    time:document.getElementById('ev-time').value.trim(), note:document.getElementById('ev-note').value.trim(),
    repeat:document.getElementById('ev-repeat').value, repeatEnd:document.getElementById('ev-rend').value, ts:Date.now() };
  try{
    await db.collection('planEvents').add(data);
    document.getElementById('ev-title').value=''; document.getElementById('ev-time').value=''; document.getElementById('ev-note').value='';
    await loadAll(); rCal(); rDayDetail(); rUpcoming(); rBriefing();
    showToast('일정이 추가됐어요 📌','success');
  }catch(e){ showToast('추가 실패: '+e.message,'error'); }
}
async function doDelEvent(id){
  const ev=P_EVENTS.find(e=>e.id===id);
  if(!confirm(`"${ev?ev.title:''}" 일정을 삭제할까요?${ev&&ev.repeat?'\n(반복 일정 전체가 삭제돼요)':''}`)) return;
  try{ await db.collection('planEvents').doc(id).delete(); await loadAll(); rCal(); rDayDetail(); rUpcoming(); rBriefing(); showToast('삭제했어요','warning'); }
  catch(e){ showToast('삭제 실패: '+e.message,'error'); }
}
function rUpcoming(){
  const t=todayStr(); const out=[];
  for(let i=0;i<14;i++){
    const d=new Date(); d.setDate(d.getDate()+i);
    const ds=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    P_EVENTS.filter(e=>occursOn(e,ds)).forEach(e=>out.push({...e, on:ds}));
    if(layers.teach){
      jikboOn(ds).forEach(j=>out.push({title:`🔶 직보 ${j.school} (${j.students.length}명)`, category:'teach', time:j.time, on:ds}));
      P_MAKEUPS.filter(m=>m.date===ds && !m.auto && !((m.className||'').includes('직보'))).forEach(m=>out.push({title:'🔶 보강 '+(m.className||''), category:'teach', time:m.time, on:ds}));
    }
  }
  document.getElementById('upcomingList').innerHTML = out.length? out.map(e=>`
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--border)">
      <div>
        <span style="font-size:13px;font-weight:700;color:var(--text-muted);margin-right:8px">${fmtMD(e.on)}</span>
        <span class="chip" style="${e.category==='academy'?ITEM_STYLE.academy:(e.category==='personal'?ITEM_STYLE.personal:ITEM_STYLE.makeup)}">${e.title}</span>
        <span style="font-size:13px;color:var(--text-muted)">${e.time||''}${e.repeat?' · 🔁':''}</span>
      </div>
      ${e.id?`<button class="btn btn-red btn-sm" onclick="doDelEvent('${e.id}')">삭제</button>`:''}
    </div>`).join('') : '<div style="color:var(--text-muted);padding:10px;font-size:14px">2주 안에 등록된 일정이 없어요</div>';
}

// ----- 투두 -----
async function doAddTodo(){
  const text=document.getElementById('todo-text').value.trim();
  if(!text){ showToast('할 일을 입력해주세요','error'); return; }
  try{
    await db.collection('planTodos').add({text, due:document.getElementById('todo-due').value||'', done:false, ts:Date.now()});
    document.getElementById('todo-text').value='';
    await loadAll(); rTodos(); rBriefing();
  }catch(e){ showToast('추가 실패: '+e.message,'error'); }
}
async function doToggleTodo(id,done){
  try{ await db.collection('planTodos').doc(id).update({done, doneAt:done?Date.now():null}); await loadAll(); rTodos(); rBriefing(); if(done) showToast('완료! 잘하셨어요 🎉','success'); }
  catch(e){ showToast('실패: '+e.message,'error'); }
}
async function doDelTodo(id){
  try{ await db.collection('planTodos').doc(id).delete(); await loadAll(); rTodos(); rBriefing(); }
  catch(e){ showToast('삭제 실패: '+e.message,'error'); }
}
function rTodos(){
  const t=todayStr();
  const open=P_TODOS.filter(x=>!x.done), done=P_TODOS.filter(x=>x.done);
  const row=x=>`<div class="todo-row ${x.done?'todo-done':''}">
    <input type="checkbox" ${x.done?'checked':''} onchange="doToggleTodo('${x.id}',this.checked)">
    <span class="todo-text">${x.text}${x.due?` <span style="font-size:12.5px;font-weight:700;color:${(!x.done&&x.due<=t)?'var(--red)':'var(--text-muted)'}">📅 ${fmtMD(x.due)}${(!x.done&&x.due<t)?' 지남!':''}</span>`:''}</span>
    <button class="btn btn-red btn-sm" onclick="doDelTodo('${x.id}')">삭제</button>
  </div>`;
  document.getElementById('todoList').innerHTML=
    (open.length?open.map(row).join(''):'<div style="color:var(--text-muted);padding:10px;font-size:14px">할 일이 없어요! 여유를 즐기세요 ☕</div>')
    +(done.length?`<div style="font-size:13px;color:var(--text-muted);margin-top:10px;font-weight:700">완료 (${done.length})</div>`+done.slice(0,8).map(row).join(''):'');
}

// ----- 시작 -----
async function init(){
  await window.bmAuthReady;   // 익명 인증(출입증) 완료 후 데이터 요청
  document.getElementById('todayDate').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  document.getElementById('ev-date').value=todayStr();
  loadThemeCloud();
  try{ await loadAll(); }catch(e){ showToast('데이터를 불러오지 못했어요: '+e.message,'error'); }
  rLayerBtns(); rCal(); rDayDetail(); rUpcoming(); rTodos(); rBriefing(); rJikbo();
}
document.addEventListener('DOMContentLoaded', init);
</script>
<!-- 📸 직보 캡처 — 찍은 그림을 먼저 보여주고, 보고 나서 저장하거나 보낸다 -->
<div id="jbShotModal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.78);z-index:1700;align-items:flex-start;justify-content:center;overflow:auto;padding:16px" onclick="if(event.target===this)closeJbShot()">
  <div style="width:100%;max-width:860px">
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
      <button onclick="jbShotCopy()" style="border:none;border-radius:9px;padding:9px 16px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;background:#22C55E;color:#fff">📋 복사</button>
      <button onclick="jbShotSave()" style="border:none;border-radius:9px;padding:9px 16px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;background:#F97316;color:#fff">💾 저장</button>
      <button id="jbShotShareBtn" onclick="jbShotShare()" style="display:none;border:none;border-radius:9px;padding:9px 16px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;background:#5B6CF5;color:#fff">📤 보내기</button>
      <button onclick="closeJbShot()" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:9px;padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">닫기</button>
      <span style="color:rgba(255,255,255,.75);font-size:12.5px;margin-left:2px">복사한 뒤 카톡에 붙여넣기 하시면 돼요</span>
    </div>
    <div id="jbShotPreview" style="background:#fff;border-radius:12px;overflow:hidden;min-height:80px"></div>
    <div style="height:24px"></div>
  </div>
</div>
</body>
</html>
