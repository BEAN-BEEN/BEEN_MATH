<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>BEEN MATH — 선생님 포털</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#114C56">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary:#5B6CF5; --primary-dark:#4F46E5; --primary-light:#EEF2FF; --primary-2:#818CF8;
      --orange:#F97316; --orange-light:#FFF7ED;
      --green:#10B981; --green-light:#ECFDF5;
      --red:#F43F5E; --red-light:#FFF1F2;
      --yellow:#F59E0B; --yellow-light:#FFFBEB;
      --purple:#8B5CF6; --purple-light:#F5F3FF;   /* 쓰이고 있었는데 선언이 없어 색이 안 나오던 것 */
      --bg:#F4F6FB; --surface:#FFFFFF;
      --text:#0F172A; --text-sub:#334155; --text-muted:#64748B;
      --border:#E8EDF4; --sidebar-w:250px;
      --radius:16px; --radius-sm:11px;
      --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 12px rgba(16,24,40,.05);
      --shadow-md:0 6px 16px -4px rgba(16,24,40,.1),0 4px 8px -4px rgba(16,24,40,.06);
    }
    /* 🌸 계절 테마 — 브랜드(primary) 색만 바뀌고 상태색은 유지 */
    [data-theme="spring"]{ --primary:#E96A9E; --primary-dark:#D5588C; --primary-light:#FDF1F7; --primary-2:#F6A6C6; }
    [data-theme="summer"]{ --primary:#0EA5B7; --primary-dark:#0C8A99; --primary-light:#EBFDFF; --primary-2:#4FD1DE; }
    [data-theme="autumn"]{ --primary:#DD7A2E; --primary-dark:#C2641C; --primary-light:#FFF6EC; --primary-2:#F0A862; }
    [data-theme="winter"]{ --primary:#3F6FD1; --primary-dark:#3257AE; --primary-light:#EEF3FF; --primary-2:#7BA0E8; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;overflow-x:hidden;-webkit-text-size-adjust:100%}
    img{max-width:100%;height:auto}
    .app-layout{display:flex;min-height:100vh}

    /* SIDEBAR */
    .sidebar{width:var(--sidebar-w);background:#1E293B;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:200;overflow-y:auto}
    .sidebar-logo{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
    .sidebar-logo h1{font-size:18px;font-weight:800;color:#fff;letter-spacing:-.5px}
    .sidebar-logo p{font-size:12px;color:rgba(255,255,255,.5);margin-top:3px}
    .sidebar-nav{padding:12px 10px;flex:1}
    .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;color:rgba(255,255,255,.6);font-size:14px;font-weight:500;user-select:none}
    .nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
    .nav-item.active{background:var(--primary);color:#fff;font-weight:600}
    .nav-icon{width:22px;display:inline-flex;align-items:center;justify-content:center;opacity:.9}
    .sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.1)}
    .sidebar-footer p{font-size:12px;color:rgba(255,255,255,.4)}

    /* MAIN */
    .main-content{margin-left:var(--sidebar-w);flex:1;min-height:100vh;padding-bottom:48px}
    /* 넓은 모니터에서 내용이 양 끝으로 벌어지지 않게 최대 너비 + 가운데 정렬 */
    .page-header{padding:24px 28px 0;margin:0 auto 20px;max-width:1560px}
    .page-title{font-size:22px;font-weight:700;letter-spacing:-.5px}
    .page-subtitle{font-size:13px;color:var(--text-muted);margin-top:4px}
    .section{display:none}
    .section.active{display:block}
    .content-area{padding:0 28px;max-width:1560px;margin:0 auto}

    /* CARDS */
    .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
    .card-title{font-size:15px;font-weight:700;margin-bottom:14px}

    /* STATS */
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
    .stat-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;cursor:pointer;transition:box-shadow .2s}
    .stat-card:hover{box-shadow:var(--shadow-md)}
    .stat-icon{font-size:28px;margin-bottom:8px}
    .stat-value{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1}
    .stat-label{font-size:12px;color:var(--text-muted);margin-top:4px}

    /* BADGES */
    .badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700}
    .b-primary{background:var(--primary-light);color:var(--primary)}
    .b-orange{background:var(--orange-light);color:var(--orange)}
    .b-green{background:var(--green-light);color:var(--green)}
    .b-red{background:var(--red-light);color:var(--red)}
    .b-gray{background:#F1F5F9;color:var(--text-muted)}
    .b-yellow{background:var(--yellow-light);color:var(--yellow)}
    .chip{display:inline-block;padding:3px 10px;background:var(--primary-light);color:var(--primary);border-radius:20px;font-size:12px;font-weight:600}

    /* BUTTONS */
    .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:inherit}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-primary:hover{background:var(--primary-dark)}
    .btn-outline{background:transparent;color:var(--text-sub);border:1.5px solid var(--border)}
    .btn-outline:hover{background:var(--bg)}
    .btn-green{background:var(--green);color:#fff}
    .btn-green:hover{background:#059669}
    .btn-orange{background:var(--orange);color:#fff}
    .btn-orange:hover{background:#EA6C0A}
    .btn-red{background:var(--red);color:#fff}
    .btn-red:hover{background:#DC2626}
    .btn-sm{padding:6px 12px;font-size:12px}
    .btn-row{display:flex;gap:8px;flex-wrap:wrap}

    /* FORMS */
    .form-group{margin-bottom:14px}
    .form-label{display:block;font-size:13px;font-weight:600;color:var(--text-sub);margin-bottom:6px}
    .form-input,.form-select,.form-textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;color:var(--text);font-family:inherit;transition:border-color .15s;background:var(--surface)}
    .form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--primary)}
    .form-textarea{resize:vertical;min-height:80px}
    .form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    .form-row-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}

    /* TABLES */
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{padding:10px 12px;background:var(--bg);color:var(--text-muted);font-size:12px;font-weight:700;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
    td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tbody tr:hover td{background:#FAFBFF}

    /* UPLOAD */
    .upload-area{border:2px dashed var(--border);border-radius:var(--radius-sm);padding:14px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg);margin-bottom:12px}
    .upload-area:hover{border-color:var(--primary);background:var(--primary-light)}
    .upload-area .u-icon{font-size:22px;margin-bottom:4px}
    .upload-area p{font-size:12px;color:var(--text-muted)}
    .upload-area input[type=file]{display:none}

    /* ATT BUTTONS */

    /* QUESTION CARDS */
    .q-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
    .q-head{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}

    /* SCHEDULE TABLE */
    .sched-tbl{width:100%;border-collapse:collapse}
    .sched-tbl th{padding:8px 10px;background:var(--bg);font-size:12px;font-weight:700;color:var(--text-muted);border:1px solid var(--border);text-align:center;min-width:80px}
    .sched-tbl td{padding:6px;border:1px solid var(--border);vertical-align:top}
    .sc-cell{background:var(--primary-light);border-radius:6px;padding:6px 8px;margin-bottom:4px}
    .sc-cell.mk{background:var(--orange-light);border:1px solid var(--orange)}
    .sc-name{font-size:12px;font-weight:700;color:var(--primary)}
    .sc-cell.mk .sc-name{color:var(--orange)}
    .sc-time{font-size:11px;color:var(--text-muted)}

    /* REPORT */
    .rp-stat{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;text-align:center}
    .rp-val{font-size:26px;font-weight:800;color:var(--primary);line-height:1}
    .rp-lbl{font-size:12px;color:var(--text-muted);margin-top:6px}

    /* ALERT */
    .alert-card{background:var(--orange-light);border:1.5px solid var(--orange);border-radius:var(--radius);padding:14px 18px;display:flex;align-items:center;gap:12px;margin-bottom:14px}
    .alert-card h4{font-size:13px;font-weight:700;color:var(--orange)}
    .alert-card p{font-size:12px;color:var(--text-sub);margin-top:2px}
    .divider{height:1px;background:var(--border);margin:14px 0}
    .sec-label{font-size:12px;font-weight:700;color:var(--text-muted);letter-spacing:.5px;text-transform:uppercase;margin:18px 0 10px}

    /* TOAST */
    .toast-container{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
    .toast{background:#1E293B;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:tIn .3s ease,tOut .3s ease 2.2s forwards;display:flex;align-items:center;gap:8px}
    .toast.success{background:var(--green)}
    .toast.error{background:var(--red)}
    .toast.warning{background:var(--orange)}
    @keyframes tIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    @keyframes tOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-10px)}}

    /* MOBILE */
    .mobile-header{display:none;position:fixed;top:0;left:0;right:0;height:56px;background:#1E293B;z-index:160;align-items:center;padding:0 16px;justify-content:space-between}
    .mobile-header h1{font-size:16px;font-weight:800;color:#fff;white-space:nowrap;display:flex;align-items:center}
    .m-menu-btn{font-size:20px;color:rgba(255,255,255,.8);cursor:pointer;padding:8px;border:none;background:transparent}
    .mob-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150}
    .mob-overlay.open{display:block}
    .sidebar.mob-open{transform:translateX(0)!important}

    @media(max-width:900px){
      .sidebar{transform:translateX(-100%);transition:transform .3s}
      .main-content{margin-left:0;padding-top:calc(56px + env(safe-area-inset-top))}
      .mobile-header{display:flex;height:auto;min-height:56px;padding-top:env(safe-area-inset-top)}
      .page-header{padding:16px 16px 0}
      .content-area{padding:0 16px}
      .stats-grid{grid-template-columns:repeat(2,1fr)}
      .form-row-3,.form-row-4{grid-template-columns:1fr 1fr}
    }
    @media(max-width:520px){
      .stats-grid{grid-template-columns:1fr 1fr}
      .form-row-2,.form-row-3,.form-row-4{grid-template-columns:1fr}
    }
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
    .main-content::-webkit-scrollbar-thumb{background:var(--border)}
  </style>
</head>

<script>
// ================================================================
// DATA
// ================================================================
function loadData(k,d){try{const v=localStorage.getItem('tbm_'+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function saveData(k,v){try{localStorage.setItem('tbm_'+k,JSON.stringify(v));}catch(e){}}

// ===== 반(수업) 목록: Firebase에서 불러옴. 비어있으면 시간표 기준 13개로 자동 생성 =====
const WD_ORDER=['mon','tue','wed','thu','fri','sat','sun'];
const WD_LABEL={mon:'월',tue:'화',wed:'수',thu:'목',fri:'금',sat:'토',sun:'일'};
// 반 요일 — 여러 요일(수·금 특강 등) 지원. 신규는 weekdays 배열, 구버전 문서는 weekday 문자열 → 자동 호환
function clsDays(c){ if(c&&Array.isArray(c.weekdays)&&c.weekdays.length) return c.weekdays.filter(w=>WD_LABEL[w]); return (c&&c.weekday)?[c.weekday]:[]; }
function clsHasDay(c,wd){ return clsDays(c).indexOf(wd)>=0; }
function clsDayLabel(c){ return clsDays(c).map(w=>WD_LABEL[w]).filter(Boolean).join('·'); }

async function loadClasses(){
  let snap=await db.collection('classes').get();
  if(snap.empty){
    const batch=db.batch();
    DEFAULT_CLASSES.forEach((c,i)=>{
      batch.set(db.collection('classes').doc(c.id),{name:c.name,subject:c.subject,weekday:c.weekday,weekdays:[c.weekday],slot:c.slot,startTime:'',endTime:'',type:'정규',order:i});

// ===== 로컬 캐시 반영 — 문서 하나를 고치려고 컬렉션을 통째로 다시 읽지 않는다 =====
//  읽기 비용의 대부분이 여기서 났다: 대시보드에서 학생 한 명 숙제를 체크할 때마다
//  submissions 전체(수백 건)를 다시 읽어서, 한 반 20명이면 수천 회가 됐다.
//  서버에 쓴 것과 똑같이 로컬 배열만 고치고, 로더와 같은 기준으로 다시 정렬한다.
//  조금이라도 확실하지 않으면 false를 돌려주고, 그때만 예전처럼 전체를 다시 읽는다.
const cmpStr=(a,b)=>{ a=String(a==null?'':a); b=String(b==null?'':b); return a<b?-1:(a>b?1:0); };

  students:     {get:()=>STUDENTS_CACHE,    sort:a=>a.sort((x,y)=>cmpStr(x.name,y.name)), norm:d=>{ if(d.school) d.school=normSchool(d.school); return d; }},

// Firestore 센티널(FieldValue.delete 등)은 로컬에서 결과를 알 수 없다.
// delete()만 뜻이 분명해 키 제거로 처리하고, 그 밖이면 null → 호출한 쪽이 전체를 다시 읽는다.
function fvKind(v){
  if(!(v && typeof v==='object')) return '';
  try{ if(!(v instanceof firebase.firestore.FieldValue)) return ''; }catch(e){ return ''; }
  try{ return v.constructor===firebase.firestore.FieldValue.delete().constructor ? 'delete' : 'other'; }catch(e){ return 'other'; }
}
function cacheMergeObj(base, patch){
  const out=Object.assign({}, base);
  for(const k in patch){ const kind=fvKind(patch[k]);
    if(kind==='delete') delete out[k];
    else if(kind) return null;          // 뜻을 모르는 센티널 — 전체 재로드로 넘긴다
    else out[k]=patch[k];
  }
  return out;
}
function cacheArr(col){ const d=CACHE_DEF[col]; return d?d.get():null; }
function cacheResort(col){ const d=CACHE_DEF[col]; if(d&&d.sort){ const a=d.get(); if(a) d.sort(a); } }
function cacheNorm(col, doc){ const d=CACHE_DEF[col]; return (d&&d.norm)?d.norm(doc):doc; }
function cacheDel(col, id){
  const a=cacheArr(col); if(!a||!id) return false;
  const i=a.findIndex(x=>x.id===id); if(i<0) return false;
  a.splice(i,1); return true;
}
// 수정 — 이미 있는 문서에 patch를 덮어쓴다
function cachePut(col, id, patch){
  const a=cacheArr(col); if(!a||!id) return false;
  const i=a.findIndex(x=>x.id===id); if(i<0) return false;
  const merged=cacheMergeObj(a[i], patch); if(!merged) return false;
  a[i]=cacheNorm(col, merged); cacheResort(col); return true;
}
// 추가 — 서버에 쓴 그대로 로컬에도 넣는다
function cacheAdd(col, id, doc){
  const a=cacheArr(col); if(!a||!id) return false;
  const clean=cacheMergeObj({}, doc); if(!clean) return false;
  clean.id=id; a.push(cacheNorm(col, clean)); cacheResort(col); return true;
}
// set() — 통째로 바꾸거나, 없으면 새로 넣는다
function cacheSet(col, id, doc){ cacheDel(col, id); return cacheAdd(col, id, doc); }
// set({merge:true}) — 있으면 합치고, 없으면 새로 넣는다
function cacheMerge(col, id, doc){ return cachePut(col, id, doc) || cacheAdd(col, id, doc); }
// 재원 = 활성. 휴원·퇴원은 명단·출석·숙제·알림·통계에서 제외(기록은 보존)
function studentStatus(s){ return (s&&s.status)||'재원'; }
function isActiveStudent(s){ return studentStatus(s)==='재원'; }
// 담임 반 학생 = 재원생 중 담임 반이 '하나라도' 있는 학생.
//   부담임 반만 다니는 학생은 점수 입력·내신 인원에서 뺀다.
//   부담임 반에도 있지만 담임 반이 하나라도 있으면 그대로 둔다(빼면 안 됨).
function isHomeroomStudent(s){
  if(!isActiveStudent(s)) return false;
  const ids=(s&&s.classIds)||((s&&s.classId)?[s.classId]:[]);
  if(!ids.length) return false;
  return ids.some(id=>{ const c=CLASSES.find(x=>x.id===id); return c && classIsHomeroom(c); });
}
function isNaesinStudent(s){ return isHomeroomStudent(s); }   // 예전 이름 (내신 인원 집계에서 씀)
// 부담임 반만 다녀서 빠진 인원 — 명단 아래에 몇 명 뺐는지 알려줄 때 쓴다
function assistantOnlyCount(list){ return (list||[]).filter(x=>isActiveStudent(x) && !isHomeroomStudent(x)).length; }
function assistantOnlyNote(cnt){
  return cnt?`<div style="font-size:11px;color:var(--text-muted);margin-top:6px">🙈 부담임 반만 다니는 학생 ${cnt}명은 뺐어요. (담임 반이 하나라도 있으면 그대로 나와요 · 반 역할은 <strong>시간표 관리</strong>에서 바꿔요)</div>`:'';
}
function getActiveStudents(){ return STUDENTS_CACHE.filter(isActiveStudent); }
function getStudentsByClass(cid, includeInactive){
  const inClass=STUDENTS_CACHE.filter(s=>Array.isArray(s.classIds)?s.classIds.includes(cid):s.classId===cid);
  return includeInactive ? inClass : inClass.filter(isActiveStudent);
}
// 반 표기 = 실제 소속(classIds)에서 실시간으로 이름을 뽑음 → 반 이름 바뀌거나 이동해도 항상 일치.
// (반이 삭제돼 못 찾을 때만 저장돼 있던 classNames로 대체)
function classNamesOf(s){
  const ids=Array.isArray(s.classIds)?s.classIds:(s.classId?[s.classId]:[]);
  if(ids.length){ const live=ids.map(id=>{ const c=CLASSES.find(x=>x.id===id); return c?c.name:null; }).filter(Boolean); if(live.length) return live; }
  return Array.isArray(s.classNames)&&s.classNames.length ? s.classNames : (s.className?[s.className]:[]);
}
// 반이동 이력(classHistory) 기준: 학생 s가 날짜 d에 반 cid 소속이었나 (이력 없으면 현재 소속)
function studentInClassAt(s, cid, d){
  const hist=Array.isArray(s.classHistory)?s.classHistory.filter(h=>h.classId===cid):[];
  if(hist.length){ if(!d) return true; return hist.some(h=>(!h.from||d>=h.from)&&(!h.to||d<h.to)); }
  const ids=s.classIds||(s.classId?[s.classId]:[]);
  return ids.includes(cid);
}
// 📜 반 이력 보여주기 — '언제부터 언제까지 어느 반'이었는지 한눈에.
//   숙제가 어느 반 것으로 보일지가 이 기록으로 정해지니 화면에 그대로 드러내 둡니다.
function classHistoryHtml(s){

  const esc=v=>String(v==null?'':v).replace(/</g,'&lt;');

  const rows=hist.slice().sort((a,b)=>String(a.from||'').localeCompare(String(b.from||'')));

    ${(s&&s.statusDate&&studentStatus(s)!=='재원')?`<div style="font-size:12px;color:var(--text-muted);margin-bottom:3px">🚪 ${studentStatus(s)} 시작 <strong style="color:var(--text)">${esc(s.statusDate)}</strong></div>`:''}
    ${rows.length?rows.map(h=>`<div style="font-size:12px;padding:3px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <span class="chip">${esc(anClsLabel(nameOf(h.classId)))}</span>
      <span style="color:var(--text-muted)">${esc(h.from||'처음')} ~ ${h.to?esc(h.to)+' 전날까지':'<b style="color:var(--green)">지금</b>'}</span>
    </div>`).join('')
      :'<div style="font-size:11px;color:var(--text-muted)">반 이동 기록이 아직 없어요 (지금 반 기준으로 숙제가 보여요)</div>'}
  </div>`;
}
// 숙제 a의 인원 명단 = 출제일에 그 반 소속이던 재원생 (반이동해 나간 학생도 지난 숙제엔 그대로 뜸)
function hwStudents(a){
  const d=(a&&(a.startDate||a.createdAt||a.dueDate))||'';
  return STUDENTS_CACHE.filter(s=> isActiveStudent(s)
    && studentInClassAt(s, a&&a.classId, d)
    // 등원 전에 낸 숙제는 그 학생 몫이 아님 — 학생 화면에도 안 보이므로 명단에서도 빼야 미제출로 잘못 뜨지 않음
    && !(s.enrollDate && d && d < s.enrollDate));
}

// 🔜 예약 반 변경 — 예약일이 되면 자동으로 반을 바꿔주고 이력(classHistory)까지 남김
async function applyPendingMoves(){
  const today=new Date().toISOString().slice(0,10);
  const due=STUDENTS_CACHE.filter(s=>s.pendingMove && s.pendingMove.date && s.pendingMove.date<=today);
  if(!due.length) return 0;
  for(const s of due){
    const pm=s.pendingMove, moveDate=pm.date;
    const oldIds=s.classIds||(s.classId?[s.classId]:[]), newIds=pm.classIds||[];
    const removed=oldIds.filter(id=>!newIds.includes(id)), added=newIds.filter(id=>!oldIds.includes(id));
    const hist=Array.isArray(s.classHistory)?s.classHistory.map(h=>({...h})):[];
    removed.forEach(cid=>{ const open=hist.find(h=>h.classId===cid&&!h.to); if(open) open.to=moveDate; else hist.push({classId:cid,from:'',to:moveDate}); });
    added.forEach(cid=>{ if(!hist.some(h=>h.classId===cid&&!h.to)) hist.push({classId:cid,from:moveDate,to:''}); });
    try{
      await db.collection('students').doc(s.id).update({ classIds:newIds, classNames:pm.classNames||[], classHistory:hist, pendingMove:null });
      Object.assign(s,{classIds:newIds, classNames:pm.classNames||[], classHistory:hist, pendingMove:null});
    }catch(e){ console.warn('예약 반이동 적용 실패', s.name, e); }
  }
  return due.length;
}
async function doCancelPendingMove(sid){
  const s=STUDENTS_CACHE.find(x=>x.id===sid); if(!s||!s.pendingMove) return;
  if(!confirm(`${s.name} 학생의 ${s.pendingMove.date} 반 이동 예약을 취소할까요?`)) return;
  try{ await db.collection('students').doc(sid).update({pendingMove:null}); s.pendingMove=null; showToast('반 이동 예약을 취소했어요','warning'); rStudents(); }
  catch(e){ showToast('취소 실패: '+e.message,'error'); }
}

// 한 제출의 숙제 완성도(%) — 평가했으면 그 값(0~100), 제출만 했으면 100, 미제출/반려는 0
//  → 숙제 제출률을 '얼마나 했는지'로 가중 계산할 때 사용 (직접확인 포함)
function subCompletion(sub){
  if(sub.notDone) return 0;                          // ❌ 안 해온 것 — 나중에 채우면 그때 올라갑니다
  if(!sub || sub.rejected) return 0;
  if(sub.evalPct===''||sub.evalPct==null) return 100;
  return parseInt(sub.evalPct,10)||0;
}
// ⏰ 지각 제출 판정 — '안 낸 애'와 '늦게라도 낸 애'를 구분하려고 따로 셉니다.
//   학생이 낼 때 late 플래그를 찍지만 예전 기록엔 없어서 제출시각(ts)으로 보완.
//   선생님이 대신 만든 기록(byTeacher)은 입력 시각이 늦을 뿐이라 지각으로 안 칩니다.
function subIsLate(sub, asgn){
  if(sub && sub.notDone) return false;               // 안 해온 건 지각이 아니라 미제출
  if(!sub || sub.rejected) return false;
  if(sub.late) return true;
  if(sub.byTeacher || !asgn || !asgn.dueDate || !sub.ts) return false;
  const d=new Date(sub.ts); if(isNaN(d.getTime())) return false;
  const p2=x=>String(x).padStart(2,'0');
  return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}` > asgn.dueDate;
}
// 한 학생의 숙제 성실도 — 제출률과 별개로 제때/지각/미제출을 셉니다
function hwPunctuality(asgns, subs){
  let onTime=0, lateN=0;
  asgns.forEach(a=>{ const s=subs.find(x=>x.assignmentId===a.id);
    if(!s || s.rejected || s.notDone) return;          // 반려·안 함은 미제출로 셈
    if(subIsLate(s,a)) lateN++; else onTime++; });
  const total=asgns.length;
  return { total, onTime, lateCount:lateN, missing:total-onTime-lateN,
    onTimeRate: total?Math.round(onTime/total*100):null,
    lateRate: total?Math.round(lateN/total*100):null };
}

function applyPreset(pid,classId){

  const st=document.getElementById('hw-start'); if(st && !st.value) st.value=new Date().toISOString().slice(0,10);

function revStat(rev,sub){
  const nums=Array.isArray(rev.nums)?rev.nums:[];
  const photos=(sub&&sub.photos)||{};
  const doneNos=nums.filter(n=>photos[n]);
  return { started:doneNos.length>0, doneCnt:doneNos.length, total:nums.length, done:nums.length>0&&doneNos.length===nums.length, photos, checked:!!(sub&&sub.checked) };
}

let showEmptySchools=false;
function activeSchoolSet(){
  const set=new Set();
  getStudents().forEach(s=>{ if(s.school && isActiveStudent(s)) set.add(normSchool(s.school)); });
  return set;
}
function schoolHasStudents(school){ return activeSchoolSet().has(normSchool(school||'')); }
// 화면에 보여줄 내신 일정만 (숨김 해제 토글이 켜져 있으면 전부)
function visibleSchoolExams(){
  const list=getSchoolExams();
  if(showEmptySchools) return list;
  const act=activeSchoolSet();
  return list.filter(e=>!e.school || act.has(normSchool(e.school)));
}
function hiddenSchools(){
  const act=activeSchoolSet();
  return [...new Set(getSchoolExams().filter(e=>e.school && !act.has(normSchool(e.school))).map(e=>normSchool(e.school)))];
}
function toggleEmptySchools(){ showEmptySchools=!showEmptySchools; rNaesin(); }
// 숨김 안내 줄 — 몇 개 학교가 감춰졌는지 + 다시 보기
function hiddenSchoolNoteHtml(){
  const hid=hiddenSchools();
  if(!hid.length && !showEmptySchools) return '';
  return `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--text-muted);margin-bottom:10px">
    <span>🙈 재원생이 없는 학교 ${hid.length}곳${hid.length?` (${hid.map(s=>s.replace(/</g,'&lt;')).join(', ')})`:''}은 ${showEmptySchools?'지금 함께 보이는 중':'일정에서 숨겼어요'}</span>
    <button class="btn btn-outline btn-sm" style="padding:2px 8px;font-size:11px" onclick="toggleEmptySchools()">${showEmptySchools?'다시 숨기기':'그래도 보기'}</button>
  </div>`;
}
function ddayBadge(mathDate){
  if(!mathDate) return '';
  const t=new Date(); t.setHours(0,0,0,0);
  const d=new Date(mathDate+'T00:00:00');
  const diff=Math.round((d-t)/86400000);
  if(diff>0) return `<span class="badge b-red">D-${diff}</span>`;
  if(diff===0) return `<span class="badge b-red">D-DAY 🔥</span>`;
  return `<span class="badge b-gray">종료</span>`;
}
// 수학 시험일(들) — 신규는 mathDates 배열, 기존 데이터는 mathDate 단일 호환
function examMathDates(e){
  if(Array.isArray(e.mathDates)&&e.mathDates.length) return e.mathDates.filter(m=>m&&m.date);
  if(e.mathDate) return [{label:'수학', date:e.mathDate}];
  return [];
}
// 목록 정렬: 아직 안 끝난 시험을 가까운 순으로 위에, 이미 끝난 시험은 최근 순으로 아래에.
function cmpExamUpcomingFirst(a,b){
  const today=new Date().toISOString().slice(0,10);
  const endOf=e=>e.endDate||e.startDate||'';
  const doneA=!!(endOf(a) && endOf(a)<today), doneB=!!(endOf(b) && endOf(b)<today);
  if(doneA!==doneB) return doneA?1:-1;                              // 끝난 건 아래로
  const sa=a.startDate||'', sb=b.startDate||'';
  const d = doneA ? sb.localeCompare(sa) : sa.localeCompare(sb);    // 끝난 건 최근 순, 남은 건 가까운 순
  return d || (a.school||'').localeCompare(b.school||'');
}

async function doSetExamMathDate(id, v){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v||'')) return;
  try{
    await updateSchoolExam(id, { mathDate:v, mathDates:[{label:'수학', date:v}] });
    showToast('수학 시험일 저장 ✓ 이제 직보 자동 생성에 잡혀요','success');
    rNaesin();
  }catch(e){ showToast('저장 실패: '+e.message,'error'); }
}

// 🗓 학교 학사일정 (NEIS) — 학생들이 다니는 학교 전부 한눈에 + 시험기간 내신 자동 등록
// ================================================================
let NEIS_CODES={}, NEIS_SCHED={}, neisLoading=false;
async function neisCodeOf(school){
  if(NEIS_CODES[school]) return NEIS_CODES[school];
  try{ const d=await db.collection('schoolCodes').doc(school).get(); if(d.exists){ NEIS_CODES[school]=d.data(); return d.data(); } }catch(e){}
  try{
    const r=await fetch('/api/school?type=search&name='+encodeURIComponent(school));
    const j=await r.json(); const rows=j.rows||[];
    if(!rows.length) return null;
    const x=rows.find(y=>normSchool(y.SCHUL_NM)===school)||rows[0];
    const info={atpt:x.ATPT_OFCDC_SC_CODE, code:x.SD_SCHUL_CODE, name:x.SCHUL_NM, kind:x.SCHUL_KND_SC_NM||''};
    NEIS_CODES[school]=info;
    try{ await db.collection('schoolCodes').doc(school).set(info,{merge:true}); }catch(e){}
    return info;
  }catch(e){ return null; }
}
function ymdT(d){ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`; }
// 시험 관련 일정을 연속 구간으로 묶기 → {title, from, to}
// 내신 시험만 — 수능·모의고사·예비소집·시험장 설치 등은 내신이 아니라서 제외
const NEIS_NOT_EXAM=/수능|대학수학능력|모의|학력평가|예비소집|시험장|졸업/;
// 학교마다 '지필평가'로만 쓰는 곳이 있어서(동안고 '1차 지필 평가') 지필도 시험으로 인식
const NEIS_IS_EXAM=/고사|시험|지필/;
// 11월에 보는 기말은 고3(수능 전 조기 시행), 그 외는 고1·2
function examGradeOf(ymd){ return (+(ymd||'').slice(4,6)===11) ? '고3' : '고1·2'; }
// 학교마다 제각각인 시험 이름을 '{N}학기 중간/기말고사'로 통일 (1차 정기시험·지필평가 등)
function normExamTitle(name, ymd){
  const m=+(ymd||'').slice(4,6);                       // 3~7월=1학기 / 8~2월=2학기
  const term=(m>=3&&m<=7)?1:2;
  const t=(name||'').replace(/\s+/g,'');
  if(/중간|1차|一次|1회/.test(t)) return `${term}학기 중간고사`;
  if(/기말|2차|3차|2회/.test(t)) return `${term}학기 기말고사`;
  if(/정기시험|지필/.test(t))    return `${term}학기 ${m>=11||m<=2?'기말':'중간'}고사`;
  return name;
}
// NEIS는 주말·공휴일엔 일정을 안 주기 때문에, 시험기간이 그 사이에서 두 토막으로 끊겨 들어옵니다.
// (예: 금 10/2 시험 → 개천절·주말 → 화 10/6 시험 = 원래 한 시험인데 10/1~10/2 와 10/6~10/8 로 쪼개짐)
// 사이에 '학교 가는 날'이 하나도 없으면 같은 시험으로 봅니다.
function examGapIsOffDaysOnly(fromYmd, toYmd){
  if(!fromYmd || !toYmd || fromYmd>=toYmd) return false;
  const mk=v=>new Date(+v.slice(0,4), +v.slice(4,6)-1, +v.slice(6,8));
  const d=mk(fromYmd), end=mk(toYmd);
  d.setDate(d.getDate()+1);
  let gap=0;
  while(d<end){
    if(++gap>5) return false;                       // 너무 벌어지면 별개 시험
    const p=n=>String(n).padStart(2,'0');
    const iso=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
    const dow=d.getDay();
    if(dow!==0 && dow!==6 && !holidayName(iso)) return false;   // 평일이 끼면 다른 시험
    d.setDate(d.getDate()+1);
  }
  return true;
}
function examPeriodsOf(rows){
  const ev=rows.filter(r=>NEIS_IS_EXAM.test(r.EVENT_NM||'') && !NEIS_NOT_EXAM.test(r.EVENT_NM||''))
    .map(r=>({d:r.AA_YMD, n:normExamTitle((r.EVENT_NM||'').trim(), r.AA_YMD)})).sort((a,b)=>a.d.localeCompare(b.d));
  const out=[];
  ev.forEach(x=>{
    const last=out[out.length-1];

const NEIS_MAJOR_RE=/개학|방학|입학|졸업|체육대회|축제|수학여행|수련회|휴업|소풍|현장학습|재량|모의|학력평가|수능|대학수학능력/;
function majorEventsOf(rows){
  const t=ymdT(new Date());
  const seen={}, out=[];
  rows.filter(r=>NEIS_MAJOR_RE.test(r.EVENT_NM||'') && r.AA_YMD>=t)
    .sort((a,b)=>(a.AA_YMD||'').localeCompare(b.AA_YMD||''))
    .forEach(r=>{ const n=(r.EVENT_NM||'').trim(); if(seen[n]) return; seen[n]=1; out.push({d:r.AA_YMD, n}); });
  return out.slice(0,8);
}
// 이미 쪼개져 저장된 시험을 하나로 합칩니다 (같은 학교·같은 시험명 + 사이가 휴일뿐).
// 쪼개져 저장된 시험 찾기 — 같은 학교에서 사이가 '학교 안 가는 날'뿐인 두 건.
//   시험명이 서로 달라도(자동 등록 표기가 다를 수 있어서) 짝으로 잡고, 확인창에서 이름을 보여줍니다.
function splitExamPairs(){
  const bySchool={};
  getSchoolExams().filter(e=>e.startDate&&e.endDate).forEach(e=>{
    const k=normSchool(e.school||'');

    (bySchool[k]=bySchool[k]||[]).push(e);
  });

  const pairs=[];
  Object.values(bySchool).forEach(list=>{
    list.sort((a,b)=>a.startDate.localeCompare(b.startDate));
    for(let i=0;i<list.length-1;i++){
      const a=list[i], b=list[i+1];
      if(days(a.startDate, b.endDate)>14) continue;          // 너무 길면 다른 시험

}

async function doSchoolLookup(){

// 📊 등급컷 — 원점수만으로는 등급을 알 수 없어서, 시험마다 컷을 넣어두고 그걸로 계산한다.
//   cuts[0]=1등급 최저점 … cuts[7]=8등급 최저점. 그 아래는 9등급.
//   컷이 하나도 없으면 계산하지 않고 빈칸으로 둔다(멋대로 등급을 붙이지 않는다).
function mockCuts(m){
  const c=(m&&m.cuts)||[];
  if(!Array.isArray(c)) return [];
  return c.map(x=>(x===''||x==null||isNaN(Number(x)))?null:Number(x));
}
function mockGradeOf(score, cuts){
  const v=(score===''||score==null)?null:Number(score);
  if(v==null || isNaN(v)) return '';
  const c=cuts||[];
  if(!c.some(x=>x!=null)) return '';
  for(let i=0;i<8;i++){ if(c[i]!=null && v>=c[i]) return (i+1)+'등급'; }
  return '9등급';
}
// 화면에 적혀 있는 컷을 읽는다 (아직 저장 전이어도 바로 계산되게)
function mockCutsFromInputs(mockId){
  const out=[];
  for(let i=1;i<=8;i++){ const el=document.getElementById('mcut-'+mockId+'-'+i); const v=el?el.value.trim():''; out.push(v===''?null:Number(v)); }
  return out;
}
// 점수를 적으면 등급을 채운다. 손으로 적은 등급은 건드리지 않는다.
function mockAutoGrade(mockId, sid, force){
  const sEl=document.querySelector('.mscore-'+mockId+'[data-sid="'+sid+'"]');
  const gEl=document.querySelector('.msgrade-'+mockId+'[data-sid="'+sid+'"]');
  if(!sEl||!gEl) return;
  if(!force && gEl.dataset.auto!=='1' && gEl.value.trim()) return;
  const g=mockGradeOf(sEl.value.trim(), mockCutsFromInputs(mockId));
  gEl.value=g; gEl.dataset.auto=g?'1':'';
}
function mockAutoGradeAll(mockId, force){
  [].slice.call(document.querySelectorAll('.mscore-'+mockId)).forEach(el=>mockAutoGrade(mockId, el.dataset.sid, force));
}
function doRecalcMockGrades(mockId){
  mockAutoGradeAll(mockId, true);
  showToast('등급컷으로 전체 등급을 다시 계산했어요 ⚡','success');
}

async function doSaveMockScores(mockId){
  const m=getMockExams().find(x=>x.id===mockId); if(!m) return;
  const gradeMap={}; document.querySelectorAll('.msgrade-'+mockId).forEach(el=>{ gradeMap[el.dataset.sid]=el.value.trim(); });
  // 등급컷도 같이 저장해 다음에 열었을 때 그대로 쓰게 한다
  const cuts=mockCutsFromInputs(mockId);
  if(cuts.some(x=>x!=null)){ try{ await updateMockExam(mockId, {cuts}); }catch(e){} }
  const existing={}; getMockSubs().filter(s=>s.mockId===mockId).forEach(s=>{ existing[s.studentId]=s; });
  let n=0;
  try{
    for(const el of [...document.querySelectorAll('.mscore-'+mockId)]){
      const sid=el.dataset.sid, v=el.value.trim();
      if(v==='') continue;   // 빈칸은 건너뜀
      const ex=existing[sid];
      if(ex){ await db.collection('mockSubs').doc(ex.id).update({score:parseInt(v,10)||0, grade:gradeMap[sid]||'', maxScore:m.maxScore||100}); }
      else{ await db.collection('mockSubs').add({ mockId, mockTitle:m.title||'', studentId:sid, studentName:el.dataset.name||'', score:parseInt(v,10)||0, grade:gradeMap[sid]||'', maxScore:m.maxScore||100, mode:'score', byTeacher:true, ts:Date.now() }); }
      n++;
    }
    await loadMockSubs();
    showToast(`${n}명 점수 저장 완료 💾`,'success');
    rGrades();
  }catch(e){ showToast('저장 실패: '+e.message,'error'); }
}
async function doSaveMock(){
  const title=document.getElementById('mock-title').value.trim();
  const date=document.getElementById('mock-date').value;
  const mode=document.getElementById('mock-mode').value;
  if(!title){ showToast('시험명을 입력해주세요','error'); return; }
  let data={title,date,mode};
  if(mode==='auto'){
    const qs=collectMockKey();
    if(!qs.length){ showToast('정답표 만들기를 눌러 정답을 입력해주세요','error'); return; }
    if(qs.some(q=>!q.answer)){ showToast('모든 문항의 정답을 입력해주세요','error'); return; }
    data.questions=qs; data.maxScore=qs.reduce((a,q)=>a+(q.points||0),0);
  } else {
    data.maxScore=parseInt(document.getElementById('mock-max').value)||100;
    data.questions=[];
  }
  try{
    if(mockEditId){ await updateMockExam(mockEditId,data); mockEditId=null; showToast('모의고사 수정 완료 ✏️','success'); }
    else{ await addMockExam(data); showToast(`"${title}" 모의고사 등록 완료! 학생이 점수를 등록할 수 있어요 📝`,'success'); }
    rGrades();
  }catch(e){ showToast('저장 실패: '+e.message,'error'); }
}
async function doDelMock(id,title){
  if(!confirm(`"${title}" 모의고사를 삭제할까요?\n(학생들이 등록한 점수도 함께 사라져요)`)) return;
  try{ await deleteMockExam(id); if(mockEditId===id)mockEditId=null; showToast('삭제했어요','warning'); rGrades(); }
  catch(e){ showToast('삭제 실패: '+e.message,'error'); }
}

async function uploadFile(file, folder){
  const safe=(file.name||'file').replace(/[^\w.\-]/g,'_');
  const ref=firebase.storage().ref(folder+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+'_'+safe);
  await ref.put(file);
  return { url:await ref.getDownloadURL(), name:file.name, size:file.size };
}

function fileToBase64(file){ return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(file);}); }
function compressImage(file,maxDim=1280,q=0.72){ return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height;if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;}else if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);let d;try{d=c.toDataURL('image/jpeg',q);}catch(e){URL.revokeObjectURL(url);return reject(e);}URL.revokeObjectURL(url);resolve({base64:d.split(',')[1],mime:'image/jpeg'});};img.onerror=reject;img.src=url;}); }

// 📑 브라우저에서 PDF의 일부 페이지만 잘라내기 — 교재 한 권을 회차별로 나눠 넣을 때.
//   pdf-lib 는 PDF를 고를 때만 불러옵니다(평소 로딩에 영향 없음).
let _pdfLibP=null;
function loadPdfLib(){
  if(window.PDFLib) return Promise.resolve(window.PDFLib);
  if(_pdfLibP) return _pdfLibP;
  _pdfLibP=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js';
    s.onload=()=>window.PDFLib?res(window.PDFLib):rej(new Error('PDF 도구를 불러오지 못했어요'));
    s.onerror=()=>rej(new Error('PDF 도구를 불러오지 못했어요 (인터넷 확인)'));
    document.head.appendChild(s);
  });
  return _pdfLibP;
}
// '3-14, 20' 같은 표기를 0부터 시작하는 쪽 번호로
function parsePageRange(str, total){
  const out=[];
  String(str||'').split(',').forEach(part=>{
    part=part.trim(); if(!part) return;
    const m=part.match(/^(\d+)\s*[-~]\s*(\d+)$/);
    if(m){ let a=+m[1], b=+m[2]; if(a>b){ const t=a; a=b; b=t; }
      for(let i=a;i<=b;i++) if(i>=1&&i<=total) out.push(i-1); }
    else { const v=parseInt(part,10); if(v>=1&&v<=total) out.push(v-1); }
  });
  return out.filter((v,i,arr)=>arr.indexOf(v)===i);
}
function bytesToBase64(bytes){
  let s='';
  const CH=0x8000;                                   // 한 번에 다 넘기면 스택이 터져요
  for(let i=0;i<bytes.length;i+=CH) s+=String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
  return btoa(s);
}
async function pdfSlice(file, rangeStr){
  const Lib=await loadPdfLib();
  const src=await Lib.PDFDocument.load(await file.arrayBuffer(), { ignoreEncryption:true });
  const total=src.getPageCount();
  const idx=parsePageRange(rangeStr, total);
  if(!idx.length) throw new Error(`페이지 범위를 확인해주세요 (이 PDF는 1~${total}쪽)`);
  const out=await Lib.PDFDocument.create();
  const pages=await out.copyPages(src, idx);
  pages.forEach(p=>out.addPage(p));
  const bytes=await out.save();
  return { bytes, count:idx.length, total };
}

function copyAnalysisPrompt(){
  const txt=analysisPromptText();
  const done=()=>showToast('지시서를 복사했어요 — GPT에 시험지와 함께 붙여넣으세요 📄','success');
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done, ()=>fallbackCopy(txt,done)); }
    else fallbackCopy(txt, done);
  }catch(e){ fallbackCopy(txt, done); }
}
function fallbackCopy(txt, done){
  const ta=document.getElementById('an-paste');
  if(ta){ ta.value=txt; ta.focus(); try{ ta.select(); document.execCommand('copy'); done(); return; }catch(e){} }
  prompt('아래 지시서를 복사하세요', txt);
}
// 📋 밖에서 만든 분석 결과를 그대로 가져오기 — 교재 한 권을 미리 정리해 둘 때 편해요.
// 📁 JSON 파일을 그대로 읽어오기 — 붙여넣기가 길면 파일이 편해요
function doLoadAnalysisFile(inp){
  const file=inp&&inp.files&&inp.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    const ta=document.getElementById('an-paste');
    if(ta) ta.value=String(r.result||'');
    doPasteAnalysis();
    inp.value='';                                  // 같은 파일을 다시 골라도 동작하게
  };
  r.onerror=()=>showToast('파일을 읽지 못했어요','error');
  r.readAsText(file);
}
function doPasteAnalysis(){
  const el=document.getElementById('an-paste'); const raw=(el?el.value:'').trim();
  if(!raw){ showToast('붙여넣은 내용이 없어요','error'); return; }
  let data;
  try{ data=JSON.parse(raw.replace(/```json/gi,'').replace(/```/g,'').trim()); }
  catch(e){ showToast('JSON 형식이 아니에요: '+e.message,'error'); return; }
  // 받은 값을 그대로 옮긴다. 비어 있어도 대신 채워 넣지 않는다(그게 값을 둔갑시키는 원인이 된다).
  const mkRows=(arr)=>arr.map((p,i)=>({
    no:String(p.no!=null?p.no:(i+1)),
    bigUnit:p.bigUnit||String(p.unit||'').split('>')[0].trim()||'',
    smallUnit:p.smallUnit||(String(p.unit||'').split('>')[1]||'').trim(),
    ability:p.ability==null?'':String(p.ability).trim(),
    abilityStage:p.abilityStage==null?'':p.abilityStage,
    abilityDetail:p.abilityDetail||'',
    abilityReason:p.abilityReason||'',
    difficulty:p.difficulty==null?'':String(p.difficulty).trim(),
    predictedCorrectRate:p.predictedCorrectRate==null?'':p.predictedCorrectRate,
    predictedCorrectRateRange:p.predictedCorrectRateRange||'',
    actualCorrectRate:p.actualCorrectRate==null?null:p.actualCorrectRate,
    difficultyBasis:p.difficultyBasis||'',
    isKiller:p.isKiller===true,
    solution:p.solution||'', answer:String(p.answer==null?'':p.answer).trim(),
    unit:p.unit||''
  }));
  // v4는 exams 배열로 온다. 배열만 오거나 problems만 오는 예전 형태도 그대로 받는다.
  let fileExams=[];
  if(Array.isArray(data)) fileExams=[{title:'', range:'', source:'', problems:mkRows(data), summary:''}];
  else if(data && Array.isArray(data.exams))
    fileExams=data.exams.filter(e=>e&&Array.isArray(e.problems)).map(e=>({title:e.title||e.examTitle||'', range:e.examRange||e.range||'', source:e.source||e.examSource||'', problems:mkRows(e.problems), summary:e.summary||''}));
  else if(data && Array.isArray(data.problems))
    fileExams=[{title:data.examTitle||'', range:data.examRange||'', source:data.source||data.examSource||'', problems:mkRows(data.problems), summary:data.summary||''}];
  if(!fileExams.length || !fileExams[0].problems.length){
    // 분석 '결과' 대신 분석 '규칙 문서'(계약서)를 붙여넣는 실수가 잦다. 그걸 알아보고 짚어준다.
    const spec = data && !Array.isArray(data) &&
      (data.abilityRules||data.problemFields||data.difficultyRules||data.updatePolicy||data.tieBreakRules||data.abilityPrinciple);
    showToast(spec
      ? '이건 분석 규칙 문서예요 — 문항이 없어요. GPT에 시험지를 넣고 받은 결과 JSON을 붙여넣어 주세요 📄'
      : '문항(problems)을 찾지 못했어요 — {"exams":[{"problems":[…]}]} 또는 {"problems":[…]} 형태여야 해요','error');
    return;
  }
  anFileExams=fileExams; anFileIdx=0;
  const rows=fileExams[0].problems;
  lastAnalysis={ problems:rows, summary:fileExams[0].summary||'밖에서 정리한 분석을 가져왔어요.' };
  // 정답이 같이 왔으면 정답 입력칸에 미리 채워둡니다 (저장은 선생님이 확인 후)
  const gotKey={}; rows.forEach(p=>{ if(p.answer) gotKey[p.no]=p.answer; });
  if(Object.keys(gotKey).length){ akDraft=Object.assign({}, akDraft||{}, gotKey); }
  renderAnalysis(lastAnalysis);
  // 시험명·범위 자동 채우기 — GPT가 준 값이 있으면 그걸, 없으면 단원에서 뽑는다.
  // 이미 적어둔 값은 덮어쓰지 않는다.
  const filled=[];
  const tEl=document.getElementById('an-title'), rEl=document.getElementById('an-range'), sEl=document.getElementById('an-source');
  const gTitle=String(fileExams[0].title||'').trim(), gRange=String(fileExams[0].range||'').trim();
  const gSource=String(fileExams[0].source||'').trim();
  // 출처를 먼저 채운다 — 시험명 기본값이 출처를 쓰기 때문
  if(sEl && !sEl.value.trim() && gSource){ sEl.value=gSource; anSourceDraft=gSource; filled.push('출처'); }
  const srcNow=sEl?sEl.value.trim():anSourceDraft;
  if(tEl && !tEl.value.trim()){ const v=gTitle||anTitleFrom(rows, srcNow); if(v){ tEl.value=v; anTitleDraft=v; filled.push('시험명'); } }
  if(rEl && !rEl.value.trim()){ const v=gRange||anRangeFrom(rows); if(v){ rEl.value=v; anRangeDraft=v; filled.push('범위'); } }
  const nKey=rows.filter(p=>p.answer).length;
  const errs=anValidate(rows);
  const extra=[fileExams.length>1?`시험 ${fileExams.length}개`:'', nKey?`정답 ${nKey}개`:'', filled.length?filled.join('·')+' 자동':''].filter(Boolean).join(', ');
  showToast(`${rows.length}문항 가져왔어요${extra?` (${extra})`:''} — 표에서 확인·수정하세요 📋`,'success');
  // 값을 임의로 고치지 않고 그대로 띄운 뒤, 무엇이 문제인지 따로 알린다.
  if(errs.length) setTimeout(()=>showToast(`⚠️ ${errs.length}곳을 고쳐야 등록할 수 있어요 (${errs[0].no}번 ${errs[0].code})`,'error'), 400);
}
// 표에서 고친 값을 다시 모읍니다 (AI가 틀리게 읽은 걸 선생님이 바로잡을 수 있게)
function collectAnalysis(){
  const base=(lastAnalysis&&lastAnalysis.problems)||[];
  const rows=base.map(p=>Object.assign({},p));
  document.querySelectorAll('.an-f').forEach(el=>{
    const i=parseInt(el.dataset.i,10); if(isNaN(i)||!rows[i]) return;
    rows[i][el.dataset.k]=el.value;
  });
  rows.forEach(p=>{
    p.unit=[p.bigUnit,p.smallUnit].filter(Boolean).join(' > ')||p.unit||'';
    // 출제 의도를 고치면 단계도 따라 바뀐다. 허용 값이 아니면 손대지 않는다(둔갑 방지).

function anUnitGroups(rows){

    if(!big && !small) return;
    let g=groups.find(x=>x.big===big);

    if(small && g.smalls.indexOf(small)<0) g.smalls.push(small);
  });

}
function anRangeFrom(rows){
  const groups=anUnitGroups(rows).filter(g=>g.big!=='기타' || g.smalls.length);

    if(!g.smalls.length) return g.big;
    const head=g.smalls[0], tail=g.smalls[g.smalls.length-1];
    const span=(head===tail)?head:(head+' ~ '+tail);
    return g.big?(g.big+' > '+span):span;
  });

}

function anGroup(probs, keyFn, ox){

    const c=m[k]||(m[k]={total:0,correct:0,wrong:[]});

function anDiagnosis(probs, ox){

  return tips;
}

// ================================================================
// 🅰️ 정답(답안 키) + OMR 채점
//   exams.answerKey = {"1":"3", "2":"5", ...} · exams.choices = 보기 수(기본 5)
//   examSubs.answers = 학생이 찍은 답 {"1":"3", ...}
//   정답을 넣어두면 학생 답만 들어와도 자동 채점되고, 틀린 번호가 오답으로 이어집니다.
// ================================================================
let akExamId='', akDraft=null;      // 정답 입력 중인 시험 / 편집 중인 답
function examChoices(e){ const n=parseInt(e&&e.choices,10); return (n>=2&&n<=9)?n:5; }
// 채점할 문항 번호 — 분석에서 읽은 번호가 있으면 그대로, 없으면 1..문항수
function examNos(e){
  const probs=anProbs(e);
  if(probs.length) return probs.map(p=>String(p.no).trim()).filter(Boolean);
  const key=(e&&e.answerKey)||{};
  const ks=Object.keys(key);
  if(ks.length) return ks.sort((a,b)=>(parseFloat(a)-parseFloat(b))||(a>b?1:-1));
  const n=parseInt((e&&e.qCount)||0,10);
  return n>0 ? Array.from({length:Math.min(n,200)},(_,i)=>String(i+1)) : [];
}
// 정답과 학생 답을 맞춰 채점 — 정답이 없는 문항은 건너뜁니다
function gradeOmr(key, ans){
  key=key||{}; ans=ans||{};
  const nos=Object.keys(key).filter(n=>String(key[n]||'').trim());
  nos.sort((a,b)=>(parseFloat(a)-parseFloat(b))||(a>b?1:-1));
  const wrong=[], blank=[];
  let correct=0;
  nos.forEach(n=>{
    const a=String(ans[n]==null?'':ans[n]).trim();
    if(!a){ blank.push(n); wrong.push(n); return; }        // 안 찍은 건 틀린 것으로
    if(a===String(key[n]).trim()) correct++; else wrong.push(n);
  });
  return { total:nos.length, correct, wrong, blank, rate: nos.length?Math.round(correct/nos.length*100):null };
}
function akPick(exam){ akExamId=exam?exam.id:''; akDraft=exam?Object.assign({}, exam.answerKey||{}):null; rGrades(); }
function akSet(no, v){ if(!akDraft) akDraft={}; akDraft[no]=(akDraft[no]===v?'':v); rGrades(); }
function akClear(){ if(!akDraft) return; if(!confirm('입력한 정답을 모두 지울까요?')) return; akDraft={}; rGrades(); }
async function akSave(){
  const exam=getExams().find(e=>e.id===akExamId); if(!exam){ showToast('시험을 고르세요','error'); return; }
  const key={}; Object.keys(akDraft||{}).forEach(n=>{ const v=String(akDraft[n]||'').trim(); if(v) key[n]=v; });
  try{
    await updateExam(akExamId, { answerKey:key, choices:examChoices(exam) });
    showToast(`정답 ${Object.keys(key).length}문항 저장 ✓`,'success'); rGrades();
  }catch(e){ showToast('저장 실패: '+e.message,'error'); }
}
// 정답 입력 화면 — 번호마다 보기를 눌러 찍습니다
// 🅱️ OMR 답안지 — 학생이 답을 적을 종이. 분석서에 있는 정답을 보고
//   보기 번호(1~보기 수)면 객관식, 값이나 식이면 주관식으로 만든다.
//   정답이 아직 없으면 객관식으로 둔다(대부분이 객관식이라).
function omrIsChoice(ans, choices){
  const v=String(ans==null?'':ans).trim();
  if(!v) return true;
  return /^[1-9]$/.test(v) && Number(v)<=choices;
}
function omrTypeMap(exam){
  const key=(exam&&exam.answerKey)||{}, ch=examChoices(exam), byNo={};
  anProbs(exam).forEach(p=>{ byNo[String(p.no).trim()]=String(p.answer==null?'':p.answer).trim(); });
  const out={};
  examNos(exam).forEach(no=>{
    const fromKey=String(key[no]==null?'':key[no]).trim();
    out[no]= omrIsChoice(fromKey||byNo[no]||'', ch) ? '객관식' : '주관식';
  });
  return out;
}
function omrSheetHtml(exam){
  if(!exam) return '';

  const COLS=4;
  const cell=no=>{
    const obj = types[no]==='객관식';
    const body = obj
      ? `<div style="display:flex;gap:4px">${Array.from({length:ch},(_,i)=>`<span style="width:18px;height:18px;border:1.2px solid #64748B;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#94A3B8">${circ[i]}</span>`).join('')}</div>`

  const rows=[];
  for(let i=0;i<nos.length;i+=COLS){

      ${exam.source?`<div style="font-size:12.5px;font-weight:700;color:#5B6CF5;margin-top:2px">${anEsc(exam.source)}</div>`:''}
      <div style="font-size:12px;color:#64748B;margin-top:3px">${anEsc(anClsLabel(exam.className))}${exam.range?' · 범위 '+anEsc(exam.range):''} · 전체 ${nos.length}문항 (객관식 ${objN} · 주관식 ${nos.length-objN})</div>
    </div>

    <div style="font-size:11px;color:#64748B;margin-top:10px">객관식은 번호에 색칠하고, 주관식은 칸에 답을 적어주세요.</div>
  </div>`;
}

// 정오표 저장 → examSubs (기존 성적 리포트와 같은 문서를 씁니다)
async function doSaveAnOX(){
  const exam=getExams().find(e=>e.id===anRepExamId), st=getStudents().find(s=>s.id===anRepStId);
  if(!exam||!st){ showToast('시험과 학생을 고르세요','error'); return; }
  if(!anOX) anLoadOX();
  const probs=anProbs(exam);
  const wrong=probs.filter(p=>!anOX[String(p.no)]).map(p=>String(p.no));
  const correct=probs.length-wrong.length;
  const score=probs.length?Math.round(correct/probs.length*(exam.maxScore||100)):null;
  // 약한 능력 = 정답률 70% 미만인 요구능력
  const weak=anGroup(probs, p=>p.ability, anOX).filter(r=>r.rate<70).map(r=>r.name);
  const payload={ wrongNos:wrong.join(', '), weakAbilities:weak, score, oxTs:Date.now() };
  try{
    const existing=getExamSubs().find(s=>s.examId===exam.id && s.studentId===st.id);
    if(existing){ await db.collection('examSubs').doc(existing.id).update(payload); if(!cachePut('examSubs', existing.id, payload)) await loadExamSubs(); }
    else{ const doc={ examId:exam.id, examTitle:exam.title, classId:exam.classId, className:exam.className, studentId:st.id, studentName:st.name, submittedAt:new Date().toLocaleString('ko-KR'), comment:'', perQuestion:[], ts:Date.now(), ...payload };
      const ref=await db.collection('examSubs').add(doc); if(!cacheAdd('examSubs', ref.id, doc)) await loadExamSubs(); }
    showToast(`${st.name} 정오표 저장 — ${correct}/${probs.length} (${score}점) 📊`,'success');
    rGrades();
  }catch(e){ showToast('저장 실패: '+e.message,'error'); }
}

//  담임 반이 하나도 없고 부담임 반만 있으면 '부담임반' 학생.
function hasHomeroomClass(s){
  const ids=(s&&s.classIds)||((s&&s.classId)?[s.classId]:[]);
  return ids.some(id=>{ const c=CLASSES.find(x=>x.id===id); return c && classIsHomeroom(c); });
}
// 반 배정이 아예 없는 학생은 어느 쪽도 아니라 따로 셉니다
function hasAnyClass(s){ const ids=(s&&s.classIds)||((s&&s.classId)?[s.classId]:[]); return ids.length>0; }
function splitByRole(list){
  return { 담임: list.filter(hasHomeroomClass),
           부담임: list.filter(s=>!hasHomeroomClass(s) && hasAnyClass(s)),
           미배정: list.filter(s=>!hasAnyClass(s)) };
}

//    (달력·요약이 넓은 칸을 차지하고 수업이 눌리던 문제)
function applyDashLayout(){
  const g=document.getElementById('dashGrid'); if(!g) return;
  const w=g.clientWidth||window.innerWidth;
  const L=document.getElementById('dashLeft');
  const M=document.getElementById('dashMain');
  const R=document.getElementById('dashRight');
  const ord=(el,o)=>{ if(el) el.style.order=o; };
  if(w>=1280){
    g.style.gridTemplateColumns='300px minmax(0,1fr) 320px';
    ord(L,1); ord(M,2); ord(R,3);            // 넓으면 좌·중앙·우 그대로
  } else if(w>=900){
    g.style.gridTemplateColumns='minmax(0,1fr) 320px';
    ord(M,1); ord(R,2); ord(L,3);            // 수업이 넓은 칸, 달력은 아래 줄로
  } else {
    g.style.gridTemplateColumns='minmax(0,1fr)';
    ord(M,1); ord(R,2); ord(L,3);            // 한 줄이면 수업이 맨 위
  }
}

let showAdd=false, stSearch='', editStudentId=null, stStatusFilter='재원', stPushOnly=false;
// 상태 필터 판정 — 퇴원은 담임반/부담임반으로도 걸러볼 수 있어요
function matchStatusFilter(s, v){
  if(v==='전체') return true;
  if(v==='퇴원-담임')   return studentStatus(s)==='퇴원' && hasHomeroomClass(s);
  if(v==='퇴원-부담임') return studentStatus(s)==='퇴원' && !hasHomeroomClass(s) && hasAnyClass(s);
  return studentStatus(s)===v;
}
function pushOn(s){ return Array.isArray(s.fcmTokens) && s.fcmTokens.length>0; }
// 반 이동일 칸은 실제로 반 체크를 바꿨을 때만 나타납니다 (평소엔 숨겨서 폼이 안 복잡하게)
let esOrigIds=[];
function esClassChanged(){
  const now=[...document.querySelectorAll('.es-class-chk:checked')].map(e=>e.value);
  const changed = now.length!==esOrigIds.length || now.some(id=>!esOrigIds.includes(id));
  const box=document.getElementById('es-movebox');
  if(box) box.style.display = changed ? '' : 'none';
  if(!changed) return;
  const nameOf=id=>{ const c=CLASSES.find(x=>x.id===id); return c?anClsLabel(c.name):id; };
  const out=esOrigIds.filter(id=>!now.includes(id)).map(nameOf);
  const inn=now.filter(id=>!esOrigIds.includes(id)).map(nameOf);
  const sum=document.getElementById('es-movesum');
  if(sum) sum.innerHTML=[
    out.length?`<b style="color:var(--red)">나감</b> ${out.join(', ')}`:'',
    inn.length?`<b style="color:var(--green)">들어감</b> ${inn.join(', ')}`:''
  ].filter(Boolean).join(' &nbsp;·&nbsp; ');
}

        <input class="form-input" id="es-statusdate" type="date" value="${s.statusDate||new Date().toISOString().slice(0,10)}" style="max-width:200px">

      ${s.pwHash?`<button class="btn btn-outline btn-sm" onclick="doResetStudentPw('${s.id}','${(s.name||'').replace(/'/g,'')}')">비밀번호 초기화</button>`:'<span style="font-size:12px;color:var(--text-muted)">학생이 첫 로그인 때 직접 정해요</span>'}

async function doResetStudentPw(id,name){
  if(!confirm(`${name} 학생의 비밀번호를 초기화할까요?\n다음 로그인 때 핸드폰 뒤 4자리로 본인 확인 후 새 비밀번호를 정하게 돼요.`)) return;
  try{ await updateStudentFS(id,{pwHash:''}); showToast(`${name} 비밀번호를 초기화했어요 🔐`,'success'); rStudents(); }
  catch(e){ showToast('초기화 실패: '+e.message,'error'); }
}
async function doSaveEdit(){
  const s=getStudents().find(x=>x.id===editStudentId); if(!s)return;
  const name=document.getElementById('es-name').value.trim();
  const phone=document.getElementById('es-phone').value.trim();
  const parentPhone=document.getElementById('es-parent').value.trim();
  const classIds=[...document.querySelectorAll('.es-class-chk:checked')].map(el=>el.value);
  const classNames=classIds.map(id=>CLASSES.find(c=>c.id===id)?.name).filter(Boolean);
  const school=normSchool(document.getElementById('es-school').value);
  if(!name||!phone){showToast('이름과 핸드폰 번호를 입력해주세요','error');return;}
  const last4=phone.replace(/[^0-9]/g,'').slice(-4);
  const status=(document.getElementById('es-status').value||'재원');
  const statusMemo=(document.getElementById('es-statusmemo').value||'').trim();
  const enrollDate=(document.getElementById('es-enroll').value||'');
  const patch={name,phone,phoneLast4:last4,parentPhone,classIds,classNames,school,status,statusMemo,enrollDate};
  // 반이동: 반 구성이 바뀌면 이동일 입력 → classHistory 기록 (이동 전 숙제=이전 반, 이동일부터=새 반)
  const oldClassIds=s.classIds||(s.classId?[s.classId]:[]);
  const removedCls=oldClassIds.filter(id=>!classIds.includes(id));
  const addedCls=classIds.filter(id=>!oldClassIds.includes(id));
  let moveNote='';
  if(removedCls.length||addedCls.length){
    const todayStr=new Date().toISOString().slice(0,10);
    // 이동일은 폼의 '언제부터 새 반인가요?' 칸에서 가져옵니다 (비어 있으면 오늘)
    const dEl=document.getElementById('es-movedate');
    let moveDate=(dEl&&/^\d{4}-\d{2}-\d{2}$/.test(dEl.value)) ? dEl.value : todayStr;
    const nameOf=id=>{ const c=CLASSES.find(x=>x.id===id); return c?c.name:id; };
    const summary=[ removedCls.length?`나감: ${removedCls.map(nameOf).join(', ')}`:'', addedCls.length?`들어감: ${addedCls.map(nameOf).join(', ')}`:'' ].filter(Boolean).join(' · ');
    if(!confirm(`${s.name} 학생 반 이동\n\n${summary}\n적용일: ${moveDate}${moveDate>todayStr?' (그날 자동 이동 예약)':''}\n\n· ${moveDate} 이전 숙제 → 이전 반 것으로 남아요\n· ${moveDate}부터 → 새 반 숙제가 보여요\n\n이대로 저장할까요?`)) return;
    if(moveDate>todayStr){
      // 🔜 예약 반 변경 — 지금은 반을 그대로 두고, 그날이 되면 자동 적용
      patch.classIds=oldClassIds;
      patch.classNames=oldClassIds.map(id=>CLASSES.find(c=>c.id===id)?.name).filter(Boolean);
      patch.pendingMove={ date:moveDate, classIds, classNames, createdAt:todayStr };
      moveNote=` · 🔜 ${moveDate}부터 이동 예약됨`;
    } else {
      const hist=Array.isArray(s.classHistory)?s.classHistory.map(h=>({...h})):[];
      removedCls.forEach(cid=>{ const open=hist.find(h=>h.classId===cid&&!h.to); if(open) open.to=moveDate; else hist.push({classId:cid,from:'',to:moveDate}); });
      addedCls.forEach(cid=>{ if(!hist.some(h=>h.classId===cid&&!h.to)) hist.push({classId:cid,from:moveDate,to:''}); });
      patch.classHistory=hist;
      patch.pendingMove=null;
      moveNote=' · 반이동 기록됨('+moveDate+')';
    }
  }
  // 휴원/퇴원으로 바뀌면 처리일 자동 기록, 재원 복귀 시 처리일 제거
  // 휴원·퇴원 시작일은 폼에서 직접 고른 날짜로 (자동 오늘 대신 — 실제 마지막 등원일과 다를 수 있어서)
  if(status!=='재원'){
    const sdEl=document.getElementById('es-statusdate');
    patch.statusDate=(sdEl&&/^\d{4}-\d{2}-\d{2}$/.test(sdEl.value)) ? sdEl.value
      : (s.statusDate || new Date().toISOString().slice(0,10));
  } else { patch.statusDate=''; }
  try{ await updateStudentFS(editStudentId,patch); editStudentId=null; showToast(`${name} 정보 수정 완료 ✓${status!=='재원'?' · '+status+' 처리됨':''}${moveNote}`,'success'); rStudents(); }
  catch(e){ showToast('수정 실패: '+e.message,'error'); }
}

async function doBulkMove(mode){
  const ids=stCheckedIds();
  if(!ids.length){ showToast('학생을 먼저 고르세요','warning'); return; }
  const targetIds=[].slice.call(document.querySelectorAll('.bulk-cls-chk')).filter(x=>x.checked).map(x=>x.value);
  if(!targetIds.length){ showToast('옮길 반을 고르세요','warning'); return; }
  const todayStr=new Date().toISOString().slice(0,10);
  const dEl=document.getElementById('bulk-movedate');
  const moveDate=(dEl&&/^\d{4}-\d{2}-\d{2}$/.test(dEl.value))?dEl.value:todayStr;
  const nameOf=id=>{ const c=CLASSES.find(x=>x.id===id); return c?c.name:id; };
  const names=ids.map(id=>(getStudents().find(x=>x.id===id)||{}).name).filter(Boolean);
  const verb = mode==='add' ? '반에 추가' : '반으로 이동 (기존 반은 빠져요)';
  if(!confirm(`학생 ${ids.length}명을 ${targetIds.map(nameOf).join(', ')} ${verb}\n\n${names.slice(0,10).join(', ')}${names.length>10?` 외 ${names.length-10}명`:''}\n\n적용일: ${moveDate}${moveDate>todayStr?' (그날 자동 이동 예약)':''}\n· ${moveDate} 이전 숙제 → 이전 반 것으로 남아요\n· ${moveDate}부터 → 새 반 숙제가 보여요\n\n이대로 진행할까요?`)) return;
  let done=0, skipped=0, failed=0;
  for(const sid of ids){
    const st=getStudents().find(x=>x.id===sid); if(!st){ failed++; continue; }
    const oldIds=stClassIdsOf(st);
    const newIds = mode==='add' ? oldIds.concat(targetIds.filter(id=>oldIds.indexOf(id)<0)) : targetIds.slice();
    const removed=oldIds.filter(id=>newIds.indexOf(id)<0);
    const added=newIds.filter(id=>oldIds.indexOf(id)<0);
    if(!removed.length && !added.length){ skipped++; continue; }   // 이미 그 반이면 건드리지 않는다
    const patch={};
    if(moveDate>todayStr){
      // 🔜 예약 — 지금은 그대로 두고 그날 applyPendingMoves가 바꾼다
      patch.classIds=oldIds; patch.classNames=oldIds.map(nameOf);
      patch.pendingMove={ date:moveDate, classIds:newIds, classNames:newIds.map(nameOf), createdAt:todayStr };
    } else {
      patch.classIds=newIds; patch.classNames=newIds.map(nameOf);
      // 이력은 한 명씩 고칠 때와 같은 규칙 — from 포함, to 미포함
      const hist=Array.isArray(st.classHistory)?st.classHistory.map(h=>Object.assign({},h)):[];
      removed.forEach(cid=>{ const open=hist.find(h=>h.classId===cid&&!h.to); if(open) open.to=moveDate; else hist.push({classId:cid,from:'',to:moveDate}); });
      added.forEach(cid=>{ if(!hist.some(h=>h.classId===cid&&!h.to)) hist.push({classId:cid,from:moveDate,to:''}); });
      patch.classHistory=hist; patch.pendingMove=null;
    }
    try{ await updateStudentFS(sid, patch); done++; }catch(e){ failed++; }
  }
  stChecked={};
  const tail=[skipped?`${skipped}명은 이미 그 반`:'', failed?`${failed}명 실패`:''].filter(Boolean).join(' · ');
  showToast(`${done}명 ${moveDate>todayStr?'이동 예약 완료 🔜':'반 이동 완료 🔀'}${tail?' ('+tail+')':''}`, failed?'warning':'success');
  rStudents();
}

          </tr>`;}).join('')}
        </tbody>
      </table></div>`;
  renderBulkBar();

let clRoomId='';
function rClassroom(){
  const el=document.getElementById('classroomContent'); if(!el) return;
  if(!CLASSES.length){ el.innerHTML='<div class="card" style="text-align:center;padding:30px;color:var(--text-muted)">아직 반이 없어요. 시간표 관리에서 반을 추가하세요.</div>'; return; }
  if(!clRoomId || !CLASSES.find(c=>c.id===clRoomId)) clRoomId=CLASSES[0].id;
  const cls=CLASSES.find(c=>c.id===clRoomId);
  const sts=getStudentsByClass(cls.id);
  const asgns=getAssignments().filter(a=>a.classId===cls.id);
  const _season=selectedSeason();
  const hwAsgns=asgns.filter(a=>asnInSeason(a,_season));   // 제출률은 선택 시즌 구간 숙제만
  const exams=getExams().filter(e=>e.classId===cls.id);
  const esubs=getExamSubs(), allSubs=getSubmissions();
  const today=new Date().toISOString().slice(0,10);
  const rows=sts.map(st=>{
    const mySubs=allSubs.filter(s=>s.studentId===st.id && asgns.some(a=>a.id===s.assignmentId));
    const hwRate=hwAsgns.length?Math.round(hwAsgns.reduce((sum,a)=>sum+subCompletion(mySubs.find(s=>s.assignmentId===a.id)),0)/hwAsgns.length):null;
    const punct=hwPunctuality(hwAsgns, mySubs);   // ⏰ 제때/지각/미제출 — 제출률과 별개 축
    const myScores=esubs.filter(s=>s.studentId===st.id && exams.some(e=>e.id===s.examId) && s.score!=null);
    const avg=myScores.length?Math.round(myScores.reduce((a,s)=>a+s.score,0)/myScores.length):null;
    const attInfo=calcAttendance(asgns, absentDatesOf(st.id), today);
    const attRate=attInfo.total?attInfo.rate:null;
    return {st, hwRate, punct, avg, attRate, n:myScores.length};
  });

let hwOpenId=null, hwEditId=null, hwGroupBy='date', hwPeriod='week', hwBoardOpen=false;   // 기본은 최신 숙제부터(날짜순)
let hwSeasonId=null;   // 숙제 관리에서 보고 있는 시즌(null=현재 시즌, '__all'=전체 기간)
// 숙제 관리에서 고른 시즌 — 없으면 오늘 속한 시즌, '__all'이면 전체
function hwSelSeason(){ const list=getSeasons(); if(!list.length) return null; if(hwSeasonId==='__all') return null; return list.find(x=>x.id===hwSeasonId) || currentSeason(); }
// 이번 주 월요일(YYYY-MM-DD)
function thisMonday(){ const n=new Date(); const dow=(n.getDay()+6)%7; n.setDate(n.getDate()-dow); const p=x=>String(x).padStart(2,'0'); return `${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}`; }
// 기간 필터: 이번 주(이번 주 출제 or 마감 임박/이후) / 지난 숙제 / 전체
function hwInWeek(a){ const mon=thisMonday(); const s=a.startDate||a.createdAt||''; const d=a.dueDate||''; return (s&&s>=mon) || (d&&d>=mon); }
function hwPeriodFilter(asgn){ if(hwPeriod==='all') return asgn; const wk=asgn.filter(hwInWeek); return hwPeriod==='week'?wk:asgn.filter(a=>!hwInWeek(a)); }
// 숙제 목록 정렬: 그룹(반/요일) 기준 + 그룹 안에서 최신순
// 숙제의 기준 날짜 = 출제일(내준 날). createdAt(등록한 시각)으로 정렬하면 나중에 만든 지난 숙제가 위로 올라와요.
function hwDateOf(a){ return (a&&(a.startDate||a.createdAt||a.dueDate))||''; }
function hwOrder(asgn){
  const M={mon:0,tue:1,wed:2,thu:3,fri:4,sat:5,sun:6};
  const wIdx=c=>(M[c]!=null?M[c]:9);
  const arr=[...asgn];
  arr.sort((a,b)=>{
    const ca=CLASSES.find(c=>c.id===a.classId)||{}, cb=CLASSES.find(c=>c.id===b.classId)||{};
    if(hwGroupBy==='date'){ const d=hwDateOf(b).localeCompare(hwDateOf(a)); if(d) return d; return (b.id>a.id?1:-1); }
    if(hwGroupBy==='day'){ const d=wIdx(clsDays(ca)[0])-wIdx(clsDays(cb)[0]); if(d) return d; }
    else if(a.classId!==b.classId){ const o=(ca.order||0)-(cb.order||0); if(o) return o; return (a.classId>b.classId?1:-1); }
    return hwDateOf(b).localeCompare(hwDateOf(a)) || (b.id>a.id?1:-1);
  });
  return arr;
}
function hwGroupKey(a){
  if(hwGroupBy==='date') return hwDateOf(a)||'날짜 없음';
  const c=CLASSES.find(x=>x.id===a.classId)||{};
  return hwGroupBy==='day' ? (clsDays(c)[0]||'기타') : a.classId;
}
function hwGroupHeader(key){
  if(hwGroupBy==='date'){
    const d=new Date(key+'T00:00:00');
    if(isNaN(d.getTime())) return '📆 날짜 없음';
    const wd=['일','월','화','수','목','금','토'][d.getDay()];
    const today=new Date().toISOString().slice(0,10);
    return `📆 ${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${wd})${key===today?' <span class="badge b-primary" style="font-size:10px">오늘</span>':''}`;
  }
  if(hwGroupBy==='day'){ return `📅 ${WD_LABEL[key]?WD_LABEL[key]+'요일반':'요일 미지정'}`; }
  const c=CLASSES.find(x=>x.id===key)||{};

}
// 그동안 쓴 교재 모음 (반 기본교재 + 과거 숙제 교재) — 칩으로 빠른선택
// 📘 교재 칩은 반 과목·지난 숙제에서 자동으로 모입니다.
//   안 쓰는 게 쌓이면 지저분해서 '숨김 목록'을 따로 둡니다 — 숙제 기록 자체는 그대로 둡니다.
let HIDDEN_TB=[];
async function loadHiddenTextbooks(){
  try{ const d=await db.collection('settings').doc('hiddenTextbooks').get();
    HIDDEN_TB=(d.exists && Array.isArray(d.data().list)) ? d.data().list : []; }
  catch(e){ HIDDEN_TB=[]; }
}
async function saveHiddenTextbooks(){
  await db.collection('settings').doc('hiddenTextbooks').set({ list:HIDDEN_TB, ts:Date.now() }, { merge:true });
}
async function doHideTextbook(t){
  t=String(t||'').trim(); if(!t || HIDDEN_TB.includes(t)) return;
  HIDDEN_TB=[...HIDDEN_TB, t];
  try{ await saveHiddenTextbooks(); showToast(`📘 '${t}' 칩을 숨겼어요 (숙제 기록은 그대로예요)`,'success'); rHomework(); }
  catch(e){ HIDDEN_TB=HIDDEN_TB.filter(x=>x!==t); showToast('저장 실패: '+e.message,'error'); }
}
async function doResetHiddenTextbooks(){
  if(!HIDDEN_TB.length) return;
  if(!confirm(`숨긴 교재 ${HIDDEN_TB.length}개를 다시 보이게 할까요?\n\n${HIDDEN_TB.join(', ')}`)) return;
  const back=HIDDEN_TB; HIDDEN_TB=[];
  try{ await saveHiddenTextbooks(); showToast('숨긴 교재를 모두 되돌렸어요','success'); rHomework(); }
  catch(e){ HIDDEN_TB=back; showToast('저장 실패: '+e.message,'error'); }
}
function allTextbooks(){
  const set=new Set();
  CLASSES.forEach(c=>{ if(c.subject) set.add(c.subject); });
  getAssignments().forEach(a=>{ if(a.textbook) set.add(a.textbook); });
  return [...set].filter(t=>!HIDDEN_TB.includes(t)).slice(0,16);
}
// 📅 마감일은 출제일 +1주가 기본 — 내준 날만 정하면 마감이 알아서 따라옵니다.
//   선생님이 마감일을 직접 고른 뒤에는 건드리지 않아요 (data-auto 표시로 구분).
function hwAddWeek(ds, days){
  if(!ds) return '';
  const d=new Date(ds+'T00:00:00'); if(isNaN(d.getTime())) return '';
  d.setDate(d.getDate()+(days==null?7:days));
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function hwSyncDue(){
  const st=document.getElementById('hw-start'), du=document.getElementById('hw-due');
  if(!st||!du) return;
  if(du.value && du.dataset.auto!=='1') return;   // 직접 정한 마감일은 그대로 둡니다
  const v=hwAddWeek(st.value);
  if(v){ du.value=v; du.dataset.auto='1'; }
}
function hwDueTouched(){ const du=document.getElementById('hw-due'); if(du) du.dataset.auto=''; }
// 📄 지난 숙제 복제 — 폼에 그대로 채우고 반·마감일만 새로
function doDupAsgn(aid){

// ✋ 반 미제출 전원 직접확인 (공책 검사) — 배치 처리
async function doCheckAllOffline(aid){
  const a=getAssignments().find(x=>x.id===aid); if(!a) return;
  const subs=getSubsByAssignment(aid), sts=hwStudents(a);
  const missing=sts.filter(st=>!subs.find(s=>s.studentId===st.id));
  if(!missing.length){ showToast('이미 전원 확인됐어요','success'); return; }
  if(!confirm(`미제출 ${missing.length}명을 전원 '직접 확인'으로 처리할까요?\n(공책으로 다 검사했을 때 쓰세요)`)) return;
  try{
    for(const st of missing){
      const doc={ assignmentId:aid, assignmentTitle:a.title||'', classId:a.classId||'', className:a.className||'', studentId:st.id, studentName:st.name, photos:[], offline:true, byTeacher:true, submittedAt:new Date().toLocaleString('ko-KR'), checked:true, needsRetry:false, ts:Date.now() };
      const ref=await db.collection('submissions').add(doc);
      if(!cacheAdd('submissions', ref.id, doc)) await loadSubmissions();
    }
    showToast(`${missing.length}명 전원 직접확인 완료 ✋`,'success'); rHomework();
  }catch(e){ showToast('실패: '+e.message,'error'); }
}

// 🔢 오답 방식 숙제 — 학생별 상태
function oapStat(sub){
  const entered = sub && Array.isArray(sub.wrongNos);
  const wn = entered ? sub.wrongNos.map(String) : [];
  const corr = (sub && sub.corrections) || {};
  const redo = (sub && sub.oapRedo) || {};
  const off  = (sub && sub.oapOffline) || {};
  const resolved = n => (corr[n]||off[n]) && !redo[n];   // 사진 or 직접검사 요청 = 학생이 처리함
  const done = entered && (wn.length===0 || wn.every(resolved));
  return { entered, wrongNos:wn, corr, done, doneCnt:wn.filter(resolved).length };
}
function showCorrPhotos(subId){
  const s=getSubmissions().find(x=>x.id===subId);
  const urls = s&&s.corrections ? Object.keys(s.corrections).sort((a,b)=>a-b).map(k=>s.corrections[k]).filter(Boolean) : [];
  showPhotoModal(urls);
}

// 캡처에 담을 숙제 고르기
function hwShotList(classId, scope){
  const today=new Date().toISOString().slice(0,10);
  const list=getAssignments().filter(a=>a.classId===classId);
  const dOf=a=>a.dueDate||a.startDate||a.createdAt||'';
  let out=list;
  if(scope==='week') out=list.filter(a=>typeof hwInWeek==='function'?hwInWeek(a):true);
  else if(scope==='next') out=list.filter(a=>!a.dueDate || a.dueDate>=today);
  return out.slice().sort((a,b)=>(dOf(a)||'').localeCompare(dOf(b)||''));
}
// 마감일을 '9월 1일 (월)'로 — 캡처해서 볼 때 요일이 있어야 헷갈리지 않음
function hwShotDate(ds){
  if(!ds) return '마감일 없음';
  const d=new Date(ds+'T00:00:00'); if(isNaN(d.getTime())) return ds;
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${['일','월','화','수','목','금','토'][d.getDay()]})`;
}

}

// "1-5, 8, 10~12" → [1,2,3,4,5,8,10,11,12] (중복 제거·정렬)
function parseNums(str){
  const set=new Set();
  (str||'').split(',').forEach(part=>{
    const m=part.trim().match(/^(\d+)\s*[-~]\s*(\d+)$/);
    if(m){ let a=+m[1],b=+m[2]; if(a>b)[a,b]=[b,a]; for(let i=a;i<=b&&i-a<200;i++) set.add(i); }
    else { const n=parseInt(part,10); if(n>0) set.add(n); }
  });
  return [...set].sort((a,b)=>a-b);
}

async function doConfirmWrong(subId,label){
  const sub=SUBMISSIONS_CACHE.find(s=>s.id===subId); if(!sub) return;

  try{ const patch={oapOk:ok,oapRedo:redo,oapOffline:off}; await db.collection('submissions').doc(subId).update(patch); if(!cachePut('submissions', subId, patch)) await loadSubmissions(); rWrong(); }

}

//   · 제출한 학생은 기존 방식 그대로(여기 안 나옴). 미제출 학생만 모아서 검사.
//   · 오답 숙제 = 틀린 번호 입력 → 오답 기록 + 확인완료. 일반 숙제 = 직접 확인.

let checkTodayOnly=true;   // 검사 탭: 오늘 수업 반만 보기(기본)
// "3, 7, 12-15, H45" → ['3','7','12','13','14','15','H45'] (숫자 구간 펼침, 문자 번호 그대로)
function parseCheckLabels(raw){
  const out=[];
  (raw||'').split(/[,\s]+/).map(s=>s.trim()).filter(Boolean).forEach(tok=>{
    const m=tok.match(/^(\d+)\s*[-~]\s*(\d+)$/);
    if(m){ let a=+m[1],b=+m[2]; if(a>b)[a,b]=[b,a]; for(let i=a;i<=b&&i-a<300;i++) out.push(String(i)); }
    else out.push(tok);
  });
  return [...new Set(out)];
}

// 📋 숙제 완성도 — 실제로 애들이 해오는 모양대로 (퍼센트는 제출률 계산용으로만 남김)
const HW_GRADES=[
  ['0',  '❌ 안 함',        'btn-red'],
  ['20', '🤏 진짜 조금',    'btn-orange'],
  ['50', '🙂 반만',         'btn-outline'],
  ['90', '👍 거의 다',      'btn-outline'],   // 2장 이하 남음
  ['100','💯 다 함',        'btn-green']
];
function hwGradeLabel(p){ const g=HW_GRADES.find(x=>x[0]===String(p)); if(g) return g[1];
  const n=parseInt(p,10); if(isNaN(n)) return '';
  return n>=95?'💯 다 함':(n>=75?'👍 거의 다':(n>=40?'🙂 반만':(n>0?'🤏 진짜 조금':'❌ 안 함'))); }
// 공책 검사 한 번 탭 — 번호를 일일이 적지 않고 완성도만 남깁니다.
//   '안 함'은 안 함 기록(notDone)으로도 같이 남겨요.
async function doQuickCheck(assignmentId, studentId, pct){
  const a=getAssignments().find(x=>x.id===assignmentId), st=getStudents().find(s=>s.id===studentId);
  if(!a||!st) return;
  const notDone = String(pct)==='0';
  const patch={ evalPct:String(pct), checked:true, byTeacher:true, offline:true,
    notDone, notDoneReason: notDone?'검사에서 안 함':'', notDoneAt: notDone?new Date().toLocaleString('ko-KR'):'' };
  try{
    const exist=getSubsByAssignment(assignmentId).find(s=>s.studentId===studentId);
    if(exist){ await db.collection('submissions').doc(exist.id).update(patch); if(!cachePut('submissions', exist.id, patch)) await loadSubmissions(); }
    else{ const doc={ assignmentId, assignmentTitle:a.title||'',
      classId:a.classId||'', className:a.className||'', studentId:st.id, studentName:st.name,
      photos:[], submittedAt:new Date().toLocaleString('ko-KR'), ts:Date.now(), needsRetry:false, ...patch };
      const ref=await db.collection('submissions').add(doc); if(!cacheAdd('submissions', ref.id, doc)) await loadSubmissions(); }
    // 출석은 '결석인지 아닌지'만 기록한다. 숙제를 판정했다는 건 그날 수업에 왔다는 뜻이라,
    // 결석으로 찍혀 있었으면 자동으로 풀어준다 (그 숙제의 마감일 = 그 반 수업일 기준).
    const cleared=await clearAbsenceOn(a.dueDate||dashDay(), studentId);
    showToast(st.name+' — '+hwGradeLabel(pct)+(cleared?' (결석 표시 해제)':''),'success');
    if(curSec==='homework') rHomeworkHub(); else rDashboard();
  }catch(e){ showToast('저장 실패: '+e.message,'error'); }
}
// 오답 숙제 — 미제출 학생을 선생님이 직접 검사(틀린 번호 기록 + 확인완료). allCorrect면 '다 맞음'.
async function doOapTeacherCheck(assignmentId, studentId, allCorrect){
  const a=getAssignments().find(x=>x.id===assignmentId), st=getStudents().find(s=>s.id===studentId);
  if(!a||!st) return;
  let nums=[];
  if(!allCorrect){
    const inp=document.getElementById('chkwrong-'+assignmentId+'-'+studentId);
    nums=parseCheckLabels(inp?inp.value:'');
    if(!nums.length){ showToast('틀린 번호를 입력하거나 "다 맞음"을 눌러주세요','warning'); return; }
  }
  const oapOk={}, oapOffline={}; nums.forEach(n=>{ oapOk[n]=true; oapOffline[n]=true; });   // 선생님이 검사 = 확인완료 처리
  try{
    const doc={
      assignmentId, assignmentTitle:a.title||'', classId:a.classId||'', className:a.className||'',
      studentId:st.id, studentName:st.name, photos:[],
      wrongNos:nums, corrections:{}, oapOffline, oapOk,
      offline:true, byTeacher:true, submittedAt:new Date().toLocaleString('ko-KR'),
      checked:true, needsRetry:false, ts:Date.now()
    };
    const ref=await db.collection('submissions').add(doc);
    if(!cacheAdd('submissions', ref.id, doc)) await loadSubmissions();
    showToast(allCorrect?`${st.name} 검사 완료 — 다 맞음 😎`:`${st.name} 검사 완료 — 오답 ${nums.length}개 기록 ✓`,'success');
    rCheck();
  }catch(e){ showToast('처리 실패: '+e.message,'error'); }
}

async function doNotifyNewHw(aid, silent){
  const a=getAssignments().find(x=>x.id===aid); if(!a){ showToast('숙제를 찾을 수 없어요','error'); return; }
  const tokens=classTokens(a.classId);
  if(!tokens.length){ showToast('이 반에 알림을 켠 학생이 없어요','warning'); return; }
  if(!silent && a.notifiedAt && !confirm(`이미 ${a.notifiedAt}에 알림을 보냈어요. 한 번 더 보낼까요?`)) return;
  try{
    const due=a.dueDate?` · ~${a.dueDate}까지`:'';
    const j=await sendPush(tokens, '새 숙제가 등록됐어요 📝', `${a.className||''} · ${a.title}${due}`);
    // 한 명이라도 받았을 때만 '보냄'으로 표시한다. 아무도 못 받았는데 ✓가 뜨면 안 보낸 걸 보냈다고 착각한다.
    if(j && j.sent) { try{ await updateAssignment(aid,{ notifiedAt:new Date().toISOString().slice(0,16).replace('T',' ') }); }catch(e){} }
    if(curSec==='homework') rHomework();
  }catch(e){ showToast('발송 실패: '+e.message,'error'); }
}

let ckBoardClassId='', ckCopyOpen=false;

//   내신 대비 교재는 반들이 똑같이 쓰므로 주차도 한꺼번에 복사한다.
//   체크 표시(marks)는 학생별 기록이라 복사하지 않고, 이름이 겹치는 항목은 건너뛴다.
function ckCopySrc(fromId){
  const cols=ckColumns(fromId);
  return ckGroup ? cols.filter(x=>x.group===ckGroup) : cols;
}
function ckCopyPlan(fromId, targetIds){
  const src=ckCopySrc(fromId);
  return targetIds.map(tid=>{
    const t=CLASSES.find(c=>c.id===tid);
    const haveU=new Set(classUnits(tid).map(u=>(u.name||'').trim()));
    // 교재는 '교재|이름'으로 봐야 기출편 1주차와 마스터 1주차를 다른 것으로 센다
    const haveN=new Set(naesinAllItems(tid).map(u=>((u.book||NAESIN_BOOKS[0])+'|'+(u.name||'').trim())));
    const add=src.filter(u=> u.kind==='unit'
      ? !haveU.has((u.name||'').trim())
      : !haveN.has(u.group+'|'+(u.name||'').trim()));
    return { tid, name:t?t.name:'', add };
  }).filter(p=>p.add.length);
}
function ckCopyAllTargets(on){

async function doCopyUnits(fromId){
  const src=ckCopySrc(fromId);
  if(!src.length){ showToast('복사할 항목이 없어요','warning'); return; }
  const targets=[].slice.call(document.querySelectorAll('.ck-copy-chk')).filter(x=>x.checked).map(x=>x.value);
  if(!targets.length){ showToast('복사할 반을 골라주세요','warning'); return; }
  const plan=ckCopyPlan(fromId, targets);
  if(!plan.length){ showToast('고른 반에 이미 다 있어요','warning'); return; }
  const msg='아래 반에 항목을 추가할까요?\n(이름만 추가되고, 학생 체크 표시는 그대로예요)\n\n'
    + plan.map(p=>`· ${p.name}: ${p.add.map(u=>u.name).join(', ')}`).join('\n');
  if(!confirm(msg)) return;
  try{
    for(const p of plan){
      const cur=getClassCheck(p.tid);
      const stamp=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
      const addU=p.add.filter(u=>u.kind==='unit'), addN=p.add.filter(u=>u.kind==='naesin');
      const patch={};
      if(addU.length) patch.units=classUnits(p.tid).concat(addU.map((u,i)=>({ id:'u'+stamp+i, name:u.name })));
      if(addN.length) patch.naesinItems=naesinAllItems(p.tid).concat(addN.map((u,i)=>({ id:'n'+stamp+i, name:u.name, book:u.group })));
      CLASSCHECK_CACHE[p.tid]=Object.assign({units:[],marks:{},testLog:{}}, cur, {id:p.tid}, patch);
      await db.collection('classCheck').doc(p.tid).set(Object.assign({ts:Date.now()}, patch),{merge:true});
    }
    ckCopyOpen=false;
    showToast(`${plan.length}개 반에 ${plan.reduce((n,p)=>n+p.add.length,0)}개 복사 완료 📋`,'success');
    rDashboard();
  }catch(e){ showToast('복사 실패: '+e.message,'error'); }
}

//   같은 classCheck 문서에 naesinItems / naesinMarks 로 붙여 저장한다(컬렉션을 늘리지 않는다).
const NAESIN_BOOKS=['마스터교재','기출편','유형편'];

function naesinMarked(classId, itemId, sid){ const c=getClassCheck(classId); const m=(c.naesinMarks&&c.naesinMarks[itemId])||{}; return !!m[sid]; }
// 방학 단원 + 교재별 주차를 한 줄로 세운다. 표시·체크·삭제 모두 이 목록으로 한다.
function ckColumns(classId){
  const cols=[];
  classUnits(classId).forEach(u=>cols.push({kind:'unit', group:CK_VACATION, id:u.id, name:u.name}));
  naesinAllItems(classId).forEach(u=>cols.push({kind:'naesin', group:(u.book||NAESIN_BOOKS[0]), id:u.id, name:u.name}));
  return cols;
}
function ckGroups(){ return [CK_VACATION].concat(NAESIN_BOOKS); }
function ckMarked(classId, col, sid){ return col.kind==='unit' ? unitMarked(classId,col.id,sid) : naesinMarked(classId,col.id,sid); }
function ckToggle(classId, kind, id, sid){ return kind==='unit' ? doToggleUnit(classId,id,sid) : doToggleNaesin(classId,id,sid); }
function ckDelCol(classId, kind, id){ return kind==='unit' ? doDelUnit(classId,id) : doDelNaesinItem(classId,id); }
async function saveNaesinBoard(classId, patch){

}
// ＋ 버튼 — 지금 보고 있는 묶음에 항목을 넣는다. 전체 보기일 땐 어디에 넣을지 먼저 고른다.

    const pick=(prompt('어디에 추가할까요?\n'+opts.map((x,i)=>`${i+1}. ${x}`).join('\n'), '1')||'').trim();
    const i=parseInt(pick,10);
    g = (i>=1 && i<=opts.length) ? opts[i-1] : (opts.indexOf(pick)>=0 ? pick : '');
    if(!g) return;
  }
  if(g===CK_VACATION) return doAddUnit(classId);
  const all=naesinAllItems(classId).slice();
  const nextN=all.filter(x=>(x.book||NAESIN_BOOKS[0])===g).length+1;
  const name=(prompt(`${g} — 추가할 항목 이름`, nextN+'주차')||'').trim();
  if(!name) return;
  all.push({id:'n'+Date.now().toString(36), name, book:g});
  await saveNaesinBoard(classId, {naesinItems:all});
}

// 📋 반별 단원 체크리스트 — classCheck 문서 {units:[{id,name}], marks:{unitId:{sid:true}}, testLog:{date:true}}
let CLASSCHECK_CACHE={};
async function loadClassChecks(){ try{ const s=await db.collection('classCheck').get(); CLASSCHECK_CACHE={}; s.docs.forEach(d=>{ CLASSCHECK_CACHE[d.id]={id:d.id,...d.data()}; }); }catch(e){ CLASSCHECK_CACHE={}; } }
function getClassCheck(classId){ return CLASSCHECK_CACHE[classId]||{units:[],marks:{},testLog:{}}; }
// 단원 목록 — 없으면 예전 방식(oap) 데이터를 첫 단원으로 살려서 보여줌
function classUnits(classId){
  const c=getClassCheck(classId);
  if(Array.isArray(c.units)&&c.units.length) return c.units;
  if(c.oap && Object.keys(c.oap).length) return [{id:'u1', name:c.unit||'오답'}];   // 이전 체크 유지
  return [];
}
function unitMarked(classId, unitId, sid){
  const c=getClassCheck(classId);
  const m=(c.marks&&c.marks[unitId])||(unitId==='u1'?c.oap:null)||{};
  return !!m[sid];
}
async function doAddUnit(classId){

  if(!name) return;
  const cur=getClassCheck(classId), units=classUnits(classId).slice();
  units.push({id:'u'+Date.now().toString(36), name});
