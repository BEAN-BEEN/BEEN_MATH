// 오답 번호 앞글자 일괄 추가 — 교재 번호에 접두어(예: H)를 붙였을 때, 이미 제출한 학생들의 번호도 맞춰줌
// wrongNos 배열 + corrections·oapOk·oapRedo 맵의 '키'까지 함께 바꿔 확인기록/사진이 안 끊기게 함. 이미 접두어면 건너뜀(중복 안전).
async function migrateOapPrefix(aid){
  const pre=(prompt('제출한 학생들의 오답 번호 앞에 붙일 글자를 입력하세요 (예: H)\n※ 이미 그 글자로 시작하는 번호는 건너뜁니다.')||'').trim();
  if(!pre) return;
  const subs=getSubsByAssignment(aid).filter(s=>Array.isArray(s.wrongNos)&&s.wrongNos.length);
  if(!subs.length){ showToast('제출한 오답이 없어요','warning'); return; }
  if(!confirm(`${subs.length}명의 오답 번호 앞에 '${pre}'를 붙일까요?\n예: 60 → ${pre}60  (되돌리기 어려우니 신중히!)`)) return;
  const addP=k=>{ const s=String(k); return s.startsWith(pre)?s:pre+s; };
  const remap=obj=>{ const o={}; Object.keys(obj||{}).forEach(k=>{ o[addP(k)]=obj[k]; }); return o; };
  let cnt=0;
  try{
    for(const s of subs){
      const patch={
        wrongNos:(s.wrongNos||[]).map(addP),
        corrections:remap(s.corrections),
        oapOk:remap(s.oapOk),
        oapRedo:remap(s.oapRedo)
      };
      await db.collection('submissions').doc(s.id).update(patch);
      if(!cachePut('submissions', s.id, patch)) await loadSubmissions();
      cnt++;
    }
    showToast(`${cnt}명 오답 번호 앞에 '${pre}' 추가 완료 ✅`,'success');
    rHomework();
  }catch(e){ showToast('일괄 변경 실패: '+e.message,'error'); }
}
// ❌ 숙제 안 해옴 기록 — 나중에 채우더라도 '안 했다'는 사실은 남깁니다.
//   (프린트를 안 가져와서 못 했다 같은 사유도 같이 적어두면 반복되는 패턴이 보여요)
const NOTDONE_REASONS=['프린트 안 가져옴','숙제인 줄 몰랐음','시간 없었음','안 함'];
async function doMarkNotDone(assignmentId, studentId){
  const a=getAssignments().find(x=>x.id===assignmentId), st=getStudents().find(s=>s.id===studentId);
  if(!a||!st) return;
  const NL=String.fromCharCode(10);
  const msg=[st.name+' 학생 — 숙제를 안 해왔나요?','', '사유 번호를 적어주세요 (그냥 확인만 하려면 4)','']
    .concat(NOTDONE_REASONS.map((r,i)=>(i+1)+'. '+r)).join(NL);
  const pick=prompt(msg, '1');
  if(pick===null) return;
  const idx=parseInt(pick,10);
  const reason=NOTDONE_REASONS[(idx>=1&&idx<=NOTDONE_REASONS.length)?idx-1:NOTDONE_REASONS.length-1];
  const base={ notDone:true, notDoneReason:reason, notDoneAt:new Date().toLocaleString('ko-KR'),
    checked:true, byTeacher:true, offline:false, photos:[], evalPct:'0' };
  try{
    const exist=getSubsByAssignment(assignmentId).find(s=>s.studentId===studentId);
    if(exist){ await db.collection('submissions').doc(exist.id).update(base); if(!cachePut('submissions', exist.id, base)) await loadSubmissions(); }
    else{ const doc={ assignmentId, assignmentTitle:a.title||'',
      classId:a.classId||'', className:a.className||'', studentId:st.id, studentName:st.name,
      submittedAt:'', ts:Date.now(), needsRetry:false, ...base };
      const ref=await db.collection('submissions').add(doc); if(!cacheAdd('submissions', ref.id, doc)) await loadSubmissions(); }
    showToast(st.name+' — 안 함으로 기록 (' + reason + ') ❌','warning');
    if(curSec==='homework') rHomework(); else rDashboard();
  }catch(e){ showToast('기록 실패: '+e.message,'error'); }
}

function showPhotoModal(urls){
  const list=(urls||[]).filter(Boolean);
  if(!list.length){ showToast('등록된 사진이 없어요'); return; }
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:3000;overflow:auto;padding:16px;cursor:zoom-out';
  const box=document.createElement('div');
  box.style.cssText='max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px;align-items:center';
  const head=document.createElement('div');
  head.style.cssText='color:#fff;font-size:13px;padding:2px 0';
  head.textContent='사진 '+list.length+'장 · 빈 곳을 누르면 닫혀요 ✕';
  box.appendChild(head);
  list.forEach(function(u,idx){
    const wrap=document.createElement('div');
    wrap.style.cssText='width:100%;background:rgba(255,255,255,.06);border-radius:10px;padding:8px;text-align:center;color:#fff;min-height:60px';
    const img=document.createElement('img');
    img.loading='lazy'; img.decoding='async';        // 한꺼번에 30장을 받지 않게 (느려지고 일부가 깨져요)
    img.style.cssText='max-width:100%;max-height:78vh;border-radius:8px;display:block;margin:0 auto';
    img.onclick=function(e){ e.stopPropagation(); };  // 사진 자체를 눌러도 안 닫히게
    img.onerror=function(){
      wrap.innerHTML='';
      const msg=document.createElement('div');
      msg.style.cssText='padding:20px 10px;font-size:13px;line-height:1.7';
      msg.innerHTML=(idx+1)+'번째 사진을 불러오지 못했어요<br><span style="opacity:.7;font-size:11.5px">오래돼서 정리됐거나, 네트워크가 불안정할 수 있어요</span>';
      const a=document.createElement('a');
      a.href=u; a.target='_blank'; a.textContent='새 탭에서 열어보기';
      a.style.cssText='color:#93C5FD;font-size:12px;display:inline-block;margin-top:6px';
      a.onclick=function(e){ e.stopPropagation(); };
      msg.appendChild(document.createElement('br')); msg.appendChild(a);
      wrap.appendChild(msg);
    };
    img.src=u;
    wrap.appendChild(img);
    box.appendChild(wrap);
  });
  ov.appendChild(box);
  ov.onclick=function(){ ov.remove(); };
  document.body.appendChild(ov);
}

// 특정 반 학생들의 푸시 토큰 모으기 (알림 켠 학생만)
function classTokens(classId){
  const tk=[];
  getStudents().forEach(s=>{ if(!isActiveStudent(s)) return; const ids=s.classIds||(s.classId?[s.classId]:[]); if(ids.includes(classId)&&Array.isArray(s.fcmTokens)) s.fcmTokens.forEach(t=>{ if(t&&!tk.includes(t)) tk.push(t); }); });
  return tk;
}
// 📨 알림 결과를 있는 그대로 알려준다.
//   예전엔 한 명도 안 갔는데 '알림 발송 완료'라고 떠서 원인을 알 길이 없었다.
const PUSH_WHY={
  UNREGISTERED:'학생 기기에서 알림이 꺼졌거나 앱을 지웠어요 (다시 켜야 해요)',
  INVALID_ARGUMENT:'토큰이 만료됐어요 (학생이 알림을 다시 켜야 해요)',
  SENDER_ID_MISMATCH:'다른 프로젝트의 토큰이에요',
  QUOTA_EXCEEDED:'잠시 후 다시 시도해주세요',
  UNAVAILABLE:'FCM이 잠시 불안정해요. 다시 시도해주세요',
  THIRD_PARTY_AUTH_ERROR:'푸시 인증 설정을 확인해주세요',
  PERMISSION_DENIED:'서버가 알림을 보낼 권한이 없어요 — Firebase 콘솔에서 Cloud Messaging API를 켜야 해요',
  UNAUTHENTICATED:'푸시 인증이 만료됐어요',
  NOT_FOUND:'토큰이 만료됐어요 (학생이 알림을 다시 켜야 해요)',
  NETWORK:'알림 서버에 연결하지 못했어요'
};
function pushWhy(j){
  const e=(j&&j.errors&&j.errors[0])||{};
  return PUSH_WHY[e.code] || e.code || '원인 불명';
}
// 서버가 준 원문 설명 — 무엇을 켜야 하는지가 여기 적혀 있어 그대로 보여준다
function pushDetail(j){ const e=(j&&j.errors&&j.errors[0])||{}; return String(e.msg||'').trim(); }
function pushMsg(j, total){
  if(!j) return ['알림 서버에 연결하지 못했어요','error'];
  if(j.error) return ['알림 실패 — '+j.error,'error'];
  const sent=j.sent||0, failed=j.failed||0;
  if(!total) return ['이 반은 알림을 켠 학생이 없어요 — 학생이 앱에서 🔔 알림 켜기를 눌러야 해요','warning'];
  if(sent && !failed) return [`알림 ${sent}명에게 발송 📨`,'success'];
  if(sent && failed) return [`알림 ${sent}명 발송 · ${failed}명 실패 (${pushWhy(j)})`,'warning'];
  return [`한 명도 못 받았어요 (${total}명 시도) — ${pushWhy(j)}`,'error'];
}
// FCM이 '없는 토큰'이라고 한 건 지운다. 안 지우면 다음에도 계속 실패한다.
async function dropDeadTokens(invalid){
  if(!Array.isArray(invalid) || !invalid.length) return 0;
  const dead={}; invalid.forEach(t=>{ dead[t]=1; });
  let cleaned=0;
  for(const s of getStudents()){
    const tk=Array.isArray(s.fcmTokens)?s.fcmTokens:[];
    if(!tk.some(t=>dead[t])) continue;
    const left=tk.filter(t=>!dead[t]);
    try{ await db.collection('students').doc(s.id).update({fcmTokens:left});
      if(!cachePut('students', s.id, {fcmTokens:left})) await loadStudents(); cleaned++; }catch(e){}
  }
  return cleaned;
}
// 토스트는 금방 사라져서 왜 실패했는지 다시 볼 수가 없다. 마지막 결과를 남겨둔다.
function savePushLog(j, total){
  try{
    const code=(j&&j.errors&&j.errors[0]&&j.errors[0].code) || (j&&j.error?'SERVER':'') || (j?'':'NO_RESPONSE');
    localStorage.setItem('bm_lastPush', JSON.stringify({
      at:new Date().toLocaleString('ko-KR'), total:total,
      sent:(j&&j.sent)||0, failed:j?((j.failed)||0):total,
      code:code, msg:(j&&j.error)||'', detail:pushDetail(j)
    }));
  }catch(e){}
}
function lastPushHtml(){
  let p=null; try{ p=JSON.parse(localStorage.getItem('bm_lastPush')||'null'); }catch(e){}
  if(!p || !p.total) return '';
  const allOk = p.sent && !p.failed;
  const color = allOk ? 'var(--green)' : (p.sent ? 'var(--yellow)' : 'var(--red)');
  const why = p.msg || PUSH_WHY[p.code] || p.code || '';
  const esc=v=>String(v==null?'':v).replace(/</g,'&lt;');
  return `<div style="margin-top:7px;padding-top:7px;border-top:1px solid var(--border);font-size:11px;color:var(--text-muted)">
    마지막 발송 <strong style="color:${color}">${p.sent}/${p.total}명</strong> · ${esc(p.at)}
    ${allOk?'':`<div style="color:${color};margin-top:2px;line-height:1.5">${esc(why)}${p.code?` <span style="opacity:.65">(${esc(p.code)})</span>`:''}</div>
      ${p.detail?`<div style="color:var(--text-muted);margin-top:3px;font-size:10.5px;line-height:1.45">${esc(p.detail)}</div>`:''}`}
  </div>`;
}
// 알림 한 번 보내기 — 결과 안내와 죽은 토큰 정리를 한곳에서 처리한다
async function sendPush(tokens, title, body){
  const total=(tokens||[]).length;
  let j=null;
  try{
    const r=await fetch('/api/notify',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({tokens:tokens||[], title:title, body:body})});
    j=await r.json().catch(()=>null);
  }catch(e){ j=null; }
  savePushLog(j, total);
  const [msg,type]=pushMsg(j,total);
  showToast(msg,type);
  if(j && j.invalid && j.invalid.length){
    const c=await dropDeadTokens(j.invalid);
    if(c) setTimeout(()=>showToast(`알림이 끊긴 학생 ${c}명을 정리했어요 — 다시 켜달라고 알려주세요`,'warning'), 600);
  }
  return j;
}

// 🎯 학생별 약점 대시보드 — 채점된 시험을 모아 점수 추이 + 자주 약했던 능력 집계
let gradeDashStId='';

// 📈 점수·등급 꺾은선 (선생님용). series=[{name,color,pts:[{v, main, sub}|null]}] — main=점수, sub=등급
function gradeLineChartT(xlabels, series, maxV){
  const W=360,H=180,padL=42,padR=34,padT=30,padB=30,n=xlabels.length; if(!n||!(maxV>0)) return '';
  const xFor=i=> n===1? W/2 : padL + i*(W-padL-padR)/(n-1);
  const yFor=v=> (H-padB) - (Math.max(0,Math.min(maxV,v))/maxV)*(H-padT-padB);
  const grid=[0,.25,.5,.75,1].map(f=>{ const g=Math.round(maxV*f), y=yFor(g).toFixed(1);
    return `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#E2E8F0" stroke-width="1"/><text x="${padL-6}" y="${(+y+3).toFixed(1)}" font-size="8" fill="#94A3B8" text-anchor="end">${g}</text>`; }).join('');
  const xlab=xlabels.map((l,i)=>`<text x="${xFor(i).toFixed(1)}" y="${H-8}" font-size="8" fill="#64748B" text-anchor="middle">${String(l||'').replace(/</g,'&lt;').slice(0,12)}</text>`).join('');
  const lines=series.map(s=>{
    const pts=[]; (s.pts||[]).forEach((p,i)=>{ if(p&&p.v!=null) pts.push(`${xFor(i).toFixed(1)},${yFor(p.v).toFixed(1)}`); });
    const poly=pts.length>1?`<polyline points="${pts.join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`:'';
    const dots=(s.pts||[]).map((p,i)=>{ if(!p||p.v==null) return ''; const x=xFor(i), y=yFor(p.v);
      const anc = n>1 && i===0 ? 'start' : (n>1 && i===n-1 ? 'end' : 'middle');
      const tx = anc==='start'? x+5 : (anc==='end'? x-5 : x);
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${s.color}"/>`
        + `<text x="${tx.toFixed(1)}" y="${(y-9).toFixed(1)}" font-size="8.5" font-weight="800" fill="${s.color}" text-anchor="${anc}">${p.main==null?'':String(p.main).replace(/</g,'&lt;')}</text>`
        + (p.sub?`<text x="${tx.toFixed(1)}" y="${(y-1).toFixed(1)}" font-size="7" fill="#64748B" text-anchor="${anc}">${String(p.sub).replace(/</g,'&lt;')}</text>`:'');
    }).join('');
    return poly+dots;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:340px;height:auto;overflow:visible;display:block">${grid}${xlab}${lines}</svg>`;
}
// 학생별 성적 추이 (내신·모의 꺾은선, 점수·등급 포인트) — 📝 모의 시험 탭에서 사용

  const naesinChart = naesinSeries.some(s=>s.pts.some(p=>p)) ? gradeLineChartT(['중간','기말'], naesinSeries, 100)
    + (subjs.length>1?`<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:2px">${naesinSeries.map(s=>`<span style="font-size:11px;color:var(--text-muted)"><span style="display:inline-block;width:9px;height:9px;background:${s.color};border-radius:2px;margin-right:3px"></span>${(s.name||'').replace(/</g,'&lt;')}</span>`).join('')}</div>`:'') : '';
  if(!mockChart && !naesinChart) return `<div style="color:var(--text-muted);padding:10px;font-size:13px">${st?.name||''} 학생의 등록된 내신·모의 점수가 아직 없어요. (학생 자가 등록 또는 선생님이 점수 입력)</div>`;
  const chartCard=(title, sub, chart)=>`<div style="border:1px solid var(--border);border-radius:12px;padding:11px 13px;background:var(--bg)">
    <div style="font-size:12px;font-weight:800;color:var(--text-sub);margin-bottom:6px">${title} <span style="font-weight:400;color:var(--text-muted);font-size:10.5px">${sub}</span></div>
    ${chart}
  </div>`;
  return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,360px));gap:12px;justify-content:start;margin-top:6px">
    ${mockChart?chartCard('📝 모의고사','점수·등급', mockChart):''}
    ${naesinChart?chartCard('🏫 내신','과목별 중간→기말', naesinChart):''}
  </div>`;
}

function naesinFilledCount(){ const sts=naesinStudents(); const done=sts.filter(st=>{const n=getNaesin(st.id,naesinSubject,naesinTerm);return n&&(n.score||'').trim();}).length; return {done,total:sts.length}; }

// ===== 📈 내신 성적 변화 추이 (중간→기말) + 휴원·퇴원생 성적 조회 =====
let trendSubject='공통수학1', trendStatus='재원', gradeView='입력';  // 성적관리 상단 서브탭
let gradeTab='naesin';  // 성적관리 대탭: naesin(내신) / daily(학원 데일리 테스트) / mock(모의) / analysis(시험지 분석서)
function numFromScore(s){ const m=String(s==null?'':s).match(/-?\d+(\.\d+)?/); return m?parseFloat(m[0]):null; }  // "94+"→94, "40점대"→40
function naesinTrendRows(){
  const sts = trendStatus==='전체' ? STUDENTS_CACHE.slice() : STUDENTS_CACHE.filter(s=>studentStatus(s)===trendStatus);
  const rows=sts.map(st=>{ const mid=getNaesin(st.id,trendSubject,'중간'), fin=getNaesin(st.id,trendSubject,'기말'), sem=getNaesin(st.id,trendSubject,'1학기합산'); if(!mid&&!fin&&!sem) return null;
    const mv=numFromScore(mid&&mid.score), fv=numFromScore(fin&&fin.score); const delta=(mv!=null&&fv!=null)?+(fv-mv).toFixed(1):null; return {st,mid,fin,sem,delta}; }).filter(Boolean);
  rows.sort((a,b)=>{ if(a.delta==null&&b.delta==null) return (a.st.name||'').localeCompare(b.st.name||''); if(a.delta==null) return 1; if(b.delta==null) return -1; return b.delta-a.delta; });
  return rows;
}
function naesinTrendHtml(){
  const rows=naesinTrendRows();
  const up=rows.filter(r=>r.delta>0).length, down=rows.filter(r=>r.delta<0).length, same=rows.filter(r=>r.delta===0).length;
  const ds=rows.filter(r=>r.delta!=null).map(r=>r.delta); const avg=ds.length?+(ds.reduce((a,b)=>a+b,0)/ds.length).toFixed(1):null;
  const border=trendStatus==='퇴원'?'var(--red)':(trendStatus==='휴원'?'var(--yellow)':'var(--purple)');
  const dcell=r=> r.delta==null?'<span style="color:var(--text-muted)">-</span>'
    : r.delta>0?`<span style="color:var(--green);font-weight:800">▲ ${r.delta}</span>`
    : r.delta<0?`<span style="color:var(--red);font-weight:800">▼ ${Math.abs(r.delta)}</span>`
    : '<span style="color:var(--text-muted)">– 0</span>';
  return `<div class="card" id="naesinTrendCard" style="border-left:4px solid ${border}">
    <div class="card-title">📈 내신 성적 변화 추이 <span style="font-size:12px;color:var(--text-muted);font-weight:400">(중간 → 기말 · 얼마나 올랐는지)</span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
      <select class="form-select" style="max-width:170px" onchange="trendSubject=this.value;renderNaesinTrend()">${NAESIN_SUBJECTS.map(s=>`<option ${s===trendSubject?'selected':''}>${s}</option>`).join('')}</select>
      <div style="display:inline-flex;background:var(--bg);border-radius:9px;padding:3px;flex-wrap:wrap">
        ${['재원','휴원','퇴원','전체'].map(v=>`<button class="btn btn-sm" style="${trendStatus===v?'background:var(--primary);color:#fff':'background:transparent;color:var(--text-muted)'}" onclick="trendStatus='${v}';renderNaesinTrend()">${v}</button>`).join('')}
      </div>
      ${trendStatus!=='재원'&&trendStatus!=='전체'?`<span style="font-size:12px;color:var(--text-muted)">· ${trendStatus}생 성적 보관함</span>`:''}
    </div>
    ${rows.length?`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
      <span class="badge b-green">▲ 상승 ${up}명</span><span class="badge b-red">▼ 하락 ${down}명</span><span class="badge b-gray">유지 ${same}명</span>
      ${avg!=null?`<span style="font-size:13px;color:var(--text-sub);margin-left:4px">평균 변화 <strong style="color:${avg>0?'var(--green)':(avg<0?'var(--red)':'var(--text-sub)')}">${avg>0?'+':''}${avg}점</strong></span>`:''}
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>학생</th>${trendStatus==='전체'?'<th>상태</th>':''}<th>중간</th><th>기말</th><th>변화</th><th>1학기 합산</th></tr></thead>
      <tbody>${rows.map(r=>{ const gr=g=>g?` <span style="font-size:11px;color:var(--text-muted)">${g}등급</span>`:'';
        const sc=n=>n&&n.score?n.score+gr(n.grade):(n&&n.grade?gr(n.grade).trim():'<span style="color:var(--text-muted)">-</span>');
        return `<tr>
        <td><strong>${r.st.name}</strong>${r.st.school?`<span style="font-size:11px;color:var(--text-muted)"> · ${r.st.school}</span>`:''}</td>
        ${trendStatus==='전체'?`<td>${statusBadge(studentStatus(r.st))}</td>`:''}
        <td>${sc(r.mid)}</td>
        <td>${sc(r.fin)}</td>
        <td>${dcell(r)}</td>
        <td>${r.sem&&r.sem.grade?`<span class="badge b-primary">${r.sem.grade}등급</span>`:'<span style="color:var(--text-muted)">-</span>'}</td>
      </tr>`;}).join('')}</tbody>
    </table></div>
    <div style="font-size:11px;color:var(--text-muted);margin-top:8px">· 변화량은 점수의 숫자만 뽑아 계산해요(94+ → 94, 40점대 → 40). 숫자가 없으면 '-'.</div>`
    :`<div style="text-align:center;padding:24px;color:var(--text-muted)">${trendStatus==='전체'?'전체':trendStatus+'생'} 중 <strong>${trendSubject}</strong> 내신이 입력된 학생이 없어요.</div>`}
  </div>`;
}

function renderNaesinRoster(){
  const el=document.getElementById('naesinRoster'); if(el) el.innerHTML=naesinRosterHtml();
  const sm=document.getElementById('ns-summary'); if(sm){ const f=naesinFilledCount(); sm.textContent=`${f.done} / ${f.total}명`; }
}
async function doSaveAllNaesin(){
  const sts=naesinStudents(); let n=0;
  try{
    for(const st of sts){
      const sc=(document.getElementById('ns-sc-'+st.id)||{}).value||'';
      const gr=(document.getElementById('ns-gr-'+st.id)||{}).value||'';
      const nt=(document.getElementById('ns-nt-'+st.id)||{}).value||'';
      const exist=getNaesin(st.id,naesinSubject,naesinTerm);
      if(!sc.trim() && !gr.trim() && !nt.trim() && !exist) continue;      // 빈 신규는 건너뜀
      if(!sc.trim() && !gr.trim() && !nt.trim() && exist){ await deleteNaesin(exist.id); continue; }  // 다 지웠으면 삭제
      await upsertNaesin(st, naesinSubject, naesinTerm, {score:sc, grade:gr, note:nt}); n++;
    }
    showToast(`${naesinTerm}고사 내신 ${n}명 저장 완료 🏫`,'success'); renderNaesinRoster();
  }catch(e){ showToast('저장 실패: '+e.message,'error'); }
}

async function updateExam(id,d){ await db.collection('exams').doc(id).update(d); if(!cachePut('exams', id, d)) await loadExams(); }
async function deleteExam(id){ await db.collection('exams').doc(id).delete(); if(!cacheDel('exams', id)) await loadExams(); }
async function doSaveExam(){
  const classId=document.getElementById('ex-cls').value,title=document.getElementById('ex-title').value.trim();
  if(!classId||!title){showToast('반과 시험명을 입력해주세요','error');return;}
  const cls=CLASSES.find(c=>c.id===classId);
  const data={classId,className:cls?.name||'',title,range:document.getElementById('ex-range').value.trim(),maxScore:parseInt(document.getElementById('ex-max').value)||100,date:document.getElementById('ex-date').value};
  try{
    if(exEditId){ await updateExam(exEditId,data); exEditId=null; showToast(`"${title}" 시험 수정 완료 ✏️`,'success'); rGrades(); }
    else{ await saveExam(data); showToast(`"${title}" 시험이 등록되었어요! 📋`,'success'); rGrades(); }
  }catch(e){ showToast('저장 실패: '+e.message,'error'); }
}
async function doDelExam(id,title){
  if(!confirm(`"${title}" 시험을 삭제할까요?\n(입력된 점수·피드백도 함께 사라질 수 있어요)`)) return;
  try{ await deleteExam(id); if(exEditId===id)exEditId=null; showToast('시험을 삭제했어요','warning'); rGrades(); }
  catch(e){ showToast('삭제 실패: '+e.message,'error'); }
}
async function doGrade(sid){

async function upsertExamScore(exam, student, score, comment){
  const existing=getExamSubs().find(s=>s.examId===exam.id && s.studentId===student.id);
  if(existing){ const patch={score, comment}; await db.collection('examSubs').doc(existing.id).update(patch); if(!cachePut('examSubs', existing.id, patch)) await loadExamSubs(); }
  else{ const doc={ examId:exam.id, examTitle:exam.title, classId:exam.classId, className:exam.className, studentId:student.id, studentName:student.name, submittedAt:new Date().toLocaleString('ko-KR'), score, comment, ts:Date.now() };
    const ref=await db.collection('examSubs').add(doc); if(!cacheAdd('examSubs', ref.id, doc)) await loadExamSubs(); }
}
async function doSaveDirect(examId, studentId){
  const exam=getExams().find(e=>e.id===examId), st=getStudents().find(s=>s.id===studentId);
  const v=document.getElementById('ds-sc-'+studentId).value;
  if(v===''){ showToast('점수를 입력해주세요','error'); return; }
  try{ await upsertExamScore(exam, st, parseInt(v), document.getElementById('ds-cm-'+studentId).value.trim()); showToast(`${st.name} ${parseInt(v)}점 저장 ✓`,'success'); }
  catch(e){ showToast('저장 실패: '+e.message,'error'); }
}
async function doSaveAllDirect(examId){
  const exam=getExams().find(e=>e.id===examId), sts=getStudentsByClass(exam.classId);
  let n=0;
  try{
    for(const st of sts){ const v=document.getElementById('ds-sc-'+st.id).value; if(v==='')continue; await upsertExamScore(exam, st, parseInt(v), document.getElementById('ds-cm-'+st.id).value.trim()); n++; }
    showToast(`${n}명 점수 저장 완료 🏆`,'success'); renderDirectScores();
  }catch(e){ showToast('저장 실패: '+e.message,'error'); }
}

function fbOnExam(){

function perqRowsHtml(wrongStr, perqArr){
  const nos=(wrongStr||'').split(',').map(s=>s.trim()).filter(Boolean);
  if(!nos.length) return '<div style="font-size:12px;color:var(--text-muted);padding:6px">틀린 문항 번호를 입력하고 ‘문항칸 만들기’ 또는 ‘AI 피드백 생성’을 누르세요</div>';
  const map={}; (perqArr||[]).forEach(p=>{ map[String(p.no)]=p.text||p.feedback||''; });
  return nos.map(no=>`<div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:8px">
    <div style="flex:0 0 50px;text-align:center;background:#FEE2E2;color:var(--red);border-radius:8px;padding:9px 0;font-weight:700">${no}번</div>
    <textarea class="form-textarea" id="fb-q-${no}" style="flex:1;min-height:52px" placeholder="${no}번: 왜 틀렸고 무엇을 더 연습할지">${map[no]||''}</textarea>
  </div>`).join('');
}
function collectPerq(){
  const out=[]; document.querySelectorAll('[id^="fb-q-"]').forEach(t=>{ out.push({no:t.id.replace('fb-q-',''), text:t.value}); }); return out;
}
function buildPerqRows(){ const w=document.getElementById('fb-wrong').value; document.getElementById('fb-perq').innerHTML=perqRowsHtml(w, collectPerq()); }
function renderFeedbackEditor(){

async function doSaveFeedback(){
  const examId=document.getElementById('fb-exam').value, stId=document.getElementById('fb-student').value;
  const exam=getExams().find(e=>e.id===examId), st=getStudents().find(s=>s.id===stId);
  if(!exam||!st){ showToast('시험·학생을 선택하세요','error'); return; }
  const scoreV=document.getElementById('fb-score').value;
  const payload={
    wrongNos:document.getElementById('fb-wrong').value.trim(),
    weakAbilities:document.getElementById('fb-weak').value.split(',').map(s=>s.trim()).filter(Boolean),
    comment:document.getElementById('fb-summary').value.trim(),
    perQuestion:collectPerq().filter(p=>p.text.trim())
  };
  if(scoreV!=='') payload.score=parseInt(scoreV);
  try{
    const existing=getExamSubs().find(s=>s.examId===examId&&s.studentId===stId);
    if(existing){ await db.collection('examSubs').doc(existing.id).update(payload); if(!cachePut('examSubs', existing.id, payload)) await loadExamSubs(); }
    else{ const doc={ examId:exam.id, examTitle:exam.title, classId:exam.classId, className:exam.className, studentId:st.id, studentName:st.name, submittedAt:new Date().toLocaleString('ko-KR'), score:scoreV!==''?parseInt(scoreV):null, ts:Date.now(), ...payload };
      const ref=await db.collection('examSubs').add(doc); if(!cacheAdd('examSubs', ref.id, doc)) await loadExamSubs(); }
    showToast(`${st.name} 성적 리포트 저장 완료 📊`,'success'); renderFeedbackEditor();
  }catch(e){ showToast('저장 실패: '+e.message,'error'); }
}

function rQuestions(){
  const qs=getQuestions();
  const pending=qs.filter(q=>q.status!=='answered'),answered=qs.filter(q=>q.status==='answered');
  const qBadge=s=>({answered:'<span class="badge b-green">답변 완료</span>',ai_draft:'<span class="badge b-primary">AI 초안</span>',pending:'<span class="badge b-gray">답변 대기</span>'}[s]||'');
  function qCard(q){return`
    <div class="q-card">
      <div class="q-head">
        <div><strong>${q.studentName}</strong><span class="chip" style="margin-left:6px">${q.className}</span><span style="margin-left:8px;font-size:12px;color:var(--text-muted)">📖 ${q.textbook} p.${q.page} ${q.number}</span></div>
        <div style="display:flex;align-items:center;gap:8px"><span style="font-size:11px;color:var(--text-muted)">${q.createdAt}</span>${qBadge(q.status)}</div>
      </div>
      ${q.aiHint?`<div style="padding:14px 18px;background:#EFF6FF;border-bottom:1px solid #BFDBFE"><div style="font-size:12px;font-weight:700;color:#2563EB;margin-bottom:6px">🤖 AI 힌트 (데모)</div><p style="font-size:13px;color:#1E40AF;line-height:1.7">${q.aiHint}</p></div>`:''}
      ${q.teacherAnswer?`<div style="padding:14px 18px;background:var(--green-light)"><div style="font-size:12px;font-weight:700;color:var(--green);margin-bottom:6px">👩‍🏫 내 답변</div><p style="font-size:13px;color:#065F46;line-height:1.7">${q.teacherAnswer}</p></div>`:`
        <div style="padding:14px 18px;background:var(--bg)">
          <div style="font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:8px">답변 작성</div>
          <textarea class="form-textarea" id="ans-${q.id}" style="min-height:70px" placeholder="학생에게 답변을 남겨주세요..."></textarea>
          <button class="btn btn-green btn-sm" style="margin-top:8px" onclick="doAns('${q.id}')">답변 저장</button>
        </div>`}
    </div>`;}
  document.getElementById('questionsContent').innerHTML=`
    ${pending.length?`<div class="sec-label" style="color:var(--red)">⚠️ 답변 필요 (${pending.length})</div>${pending.map(qCard).join('')}`:''}
    ${answered.length?`<div class="sec-label">✅ 답변 완료 (${answered.length})</div>${answered.map(qCard).join('')}`:''}
    ${!qs.length?'<div class="card" style="text-align:center;padding:40px;color:var(--text-muted)">질문이 없어요 🎉</div>':''}`;
}
async function doAns(qid){
  const ans=document.getElementById('ans-'+qid)?.value.trim();
  if(!ans){showToast('답변을 입력해주세요','error');return;}
  try{ await answerQ(qid,ans); showToast('답변이 저장되었어요! 💬','success'); rQuestions(); }
  catch(e){ showToast('저장 실패: '+e.message,'error'); }
}

let mkRosterOpenId=null;
function makeupRoster(m){
  const active=STUDENTS_CACHE.filter(isActiveStudent);
  const nm=(m.className||'').trim();
  if(nm){ const byName=active.filter(s=>s.name===nm); if(byName.length) return byName; }   // 개인 이름이면 그 학생
  if(m.school){ const ms=normSchool(m.school); const r=active.filter(s=>(s.school||'')===ms); if(r.length) return r; }  // 직보=학교 전체
  if(nm){
    const cls=CLASSES.find(c=>c.name===nm);                                                  // 반 이름이면 그 반
    if(cls) return active.filter(s=>((s.classIds)||(s.classId?[s.classId]:[])).includes(cls.id));
    const r=active.filter(s=>(s.classNames||[]).some(n=>n&&(nm.includes(n)||n.includes(nm))));
    if(r.length) return r;
  }
  return active;   // 대상 특정 실패 → 재원 전체
}

// 🪄 시험 전날 직보 자동 생성 — 수학시험 전날: 그날 학교시험 있으면 2시, 없으면 5시
// 🔶 직보 날짜 — 수학시험 전날부터 거슬러 올라가며 잡는다.
//   쉬는 날(주말·공휴일)이 이어지는 동안 계속 잡고, 그 앞의 평일 하루까지 잡는다.
//   즉 주말이 끼면 그 앞 금요일까지 간다:
//     · 주말 낀 월요일 시험 → 금·토·일 (3일)
//     · 주말 낀 화요일 시험 → 금·토·일·월 (4일)
//     · 신성고 10월: 수학 10/6(화), 10/5 월이 공휴일 → 10/2 금·10/3 토·10/4 일·10/5 월 (4일)
//   쉬는 날이 아예 없으면 자연히 '전날 하루'가 된다.
//   시간: 토·일·공휴일 12시 / 금요일 3시 / 그 밖의 평일 2시.
function jikboAdd(ds,k){ const d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+k); const p=x=>String(x).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function jikboIsOff(ds){ const dow=new Date(ds+'T00:00:00').getDay(); return dow===0||dow===6||!!holidayName(ds); }
// 직보 시간 — 토·일·공휴일 12시 / 금요일 3시 /
//   그 밖의 평일은 그날 학교 시험이 있으면 2시(시험 끝나고 옴), 없으면 5시(학교 마치고 옴).
function jikboTime(ds, e){
  const dow=new Date(ds+'T00:00:00').getDay();
  if(dow===0||dow===6||holidayName(ds)) return '12:00~';   // 토·일·공휴일
  if(dow===5) return '15:00~';                              // 금요일
  const inExam = !!(e && e.startDate && e.endDate && ds>=e.startDate && ds<=e.endDate);
  return inExam ? '14:00~' : '17:00~';
}
function jikboDatesOf(e){
  const mds=examMathDates(e).map(m=>m.date).filter(Boolean).sort();
  if(!mds.length) return [];
  const set=new Set();
  if(e.jikboStart){ const last=mds[mds.length-1]; let d=e.jikboStart; while(d<last){ set.add(d); d=jikboAdd(d,1); } }
  else {
    mds.forEach(md=>{
      let d=jikboAdd(md,-1);
      for(let i=0;i<9;i++){                 // 연휴가 길어도 9일까지만 거슬러 올라간다
        set.add(d);
        const prev=jikboAdd(d,-1);
        // 평일이어도 그 앞이 쉬는 날이면(=주말 앞 금요일 등) 더 거슬러 올라간다.
        // 평일이 연달아 나오면 거기서 멈춘다 → 쉬는 날이 없으면 '전날 하루'.
        if(!jikboIsOff(d) && !jikboIsOff(prev)) break;
        d=prev;
      }
    });
  }
  mds.forEach(md=>set.delete(md));
  return [...set].sort();
}
async function doAutoMakeups(){
  const today=new Date().toISOString().slice(0,10);
  const pad=n=>String(n).padStart(2,'0');
  const plans=[];
  visibleSchoolExams().forEach(e=>{
    jikboDatesOf(e).forEach(mkDate=>{
      if(mkDate<today) return;
      const dow=new Date(mkDate+'T00:00:00').getDay();
      const hol=holidayName(mkDate);
      const inExam = !!(e.startDate && e.endDate && mkDate>=e.startDate && mkDate<=e.endDate);
      const why = (dow===0||dow===6) ? '주말' : (hol ? hol : (dow===5 ? '금요일' : (inExam ? '그날 시험O' : '그날 시험X')));
      plans.push({date:mkDate, school:e.school, grade:e.grade||'', time:jikboTime(mkDate, e), why});
    });
  });
  if(!plans.length){ showToast('자동 생성할 다가오는 수학 시험이 없어요','warning'); return; }
  if(!confirm(`다가오는 수학시험 기준으로 직보 ${plans.length}일을 자동 생성할까요?\n· 토·일·공휴일 → 12시\n· 금요일 → 3시\n· 그 밖의 평일: 그날 학교시험 O → 2시 / X → 5시\n(주말이 끼면 그 앞 금요일까지 잡아요)\n(자동으로 만든 건 지금 규칙에 맞게 고쳐집니다)`)) return;
  let created=0, fixed=0, skipped=0;
  for(const p of plans){
    const note=`수학시험 직보 (${p.why})`;
    const ex=getMakeups().find(x=>x.date===p.date && (x.school===p.school || (x.className||'').includes(p.school)));
    if(ex){
      // 자동으로 만든 건 지금 규칙에 맞게 시간을 고쳐준다(예전 규칙으로 만들어진 게 그대로 남지 않게).
      // 손으로 만든 보강은 선생님이 정한 시간이므로 건드리지 않는다.
      if(ex.auto && (ex.time!==p.time || ex.note!==note)){
        try{ await updateMakeupFS(ex.id, {time:p.time, note}); fixed++; }catch(e){ skipped++; }
      } else skipped++;
      continue;
    }
    const doc={
      date:p.date, className:`${p.school}${p.grade?' '+p.grade:''} 직보`, school:p.school,
      time:p.time, note,
      auto:true, ts:Date.now()
    };
    const ref=await db.collection('makeups').add(doc);
    if(!cacheAdd('makeups', ref.id, doc)) await loadMakeups();
    created++;
  }
  const tail=[fixed?`${fixed}건 고침(시간·메모)`:'', skipped?`${skipped}건 그대로`:''].filter(Boolean).join(' · ');
  showToast(`🪄 직보 ${created}건 생성${tail?` (${tail})`:''}`,'success'); rNaesin();
}

let rpStId='';
// 출석률 = 결석 표시 기준. 수업일(=숙제 마감일)에서 '결석'으로 표시한 만큼만 빼요. 안 빠지면 100%.
function calcAttendance(assignments, absentSet, today){
  const sessions = new Set();
  assignments.forEach(a=>{
    const d = a.dueDate || a.startDate || a.createdAt || '';
    if(d && d <= today) sessions.add(d);
  });
  const total = sessions.size;
  const absent = Math.min(total, (absentSet && absentSet.size) || 0);
  const present = Math.max(0, total - absent);
  return { total, present, absent, rate: total?Math.round(present/total*100):null };
}
function subMap(subs){ const m={}; subs.forEach(s=>{ if(s.assignmentId) m[s.assignmentId]=s; }); return m; }
// 제출률 집계 시작일(hwStart): 새 교재 시작 시 리셋 — 이 날짜(출제일 기준) 이후 숙제만 제출률에 반영
function classHwStart(classId){ const c=CLASSES.find(x=>x.id===classId); return (c&&c.hwStart)||''; }
function asnInHwWindow(a){ const st=classHwStart(a.classId); if(!st) return true; const d=a.startDate||a.createdAt||a.dueDate||''; return !d || d>=st; }

let CURRICULUM_CACHE=[], PROGLOG_CACHE=[];
let currClassId='', currWeek='';   // 진도표에서 보고 있는 반 / 주(월요일 YYYY-MM-DD)
async function loadCurriculum(){ try{ const s=await db.collection('curriculum').get(); CURRICULUM_CACHE=s.docs.map(d=>({id:d.id,...d.data()})); }catch(e){ CURRICULUM_CACHE=[]; } }
async function loadProgLog(){ try{ const s=await db.collection('progressLog').get(); PROGLOG_CACHE=s.docs.map(d=>({id:d.id,...d.data()})); }catch(e){ PROGLOG_CACHE=[]; } }
function cPad(x){ return String(x).padStart(2,'0'); }
function mondayOf(dateStr){ const n=dateStr?new Date(dateStr+'T00:00:00'):new Date(); const dow=(n.getDay()+6)%7; n.setDate(n.getDate()-dow); return `${n.getFullYear()}-${cPad(n.getMonth()+1)}-${cPad(n.getDate())}`; }
function addDays(dateStr,k){ const n=new Date(dateStr+'T00:00:00'); n.setDate(n.getDate()+k); return `${n.getFullYear()}-${cPad(n.getMonth()+1)}-${cPad(n.getDate())}`; }
function mdLabel(d){ const p=(d||'').split('-'); return p.length===3?`${+p[1]}/${+p[2]}`:d; }
function curPlan(classId, weekStart){ return CURRICULUM_CACHE.find(c=>c.classId===classId && c.weekStart===weekStart); }
function progOf(classId, date){ return PROGLOG_CACHE.find(p=>p.classId===classId && p.date===date); }
let CURR_TERM={startDate:'', weeks:13};   // 진도표 학기: 시작일(월요일)·주 수
async function loadCurrTerm(){ try{ const d=await db.collection('settings').doc('curriculumTerm').get(); if(d.exists){ const x=d.data(); CURR_TERM={startDate:x.startDate||'', weeks:x.weeks||13}; } }catch(e){} }

// 그리드 셀 입력 → 자동 저장 (재렌더 없이 캐시만 갱신 → 입력 포커스 유지)
async function doSaveCurrCell(classId, weekStart, val){
  const cls=CLASSES.find(c=>c.id===classId), content=(val||'').trim(), id=classId+'_'+weekStart;
  const ex=CURRICULUM_CACHE.find(c=>c.classId===classId&&c.weekStart===weekStart);

// 진도표 열(반) 선택 — 누른 반만 표에 보임. localStorage에 저장.
let currShowCols=null;
function getCurrCols(){
  if(currShowCols==null){
    try{ const s=JSON.parse(localStorage.getItem('bm_currCols')||'null'); if(Array.isArray(s)){ currShowCols=s; return currShowCols; } }catch(e){}
    const live=CLASSES.filter(c=>isClassActive(c));                       // 끝난 수업은 기본에서 제외
    const hr=live.filter(c=>classIsHomeroom(c)).map(c=>c.id); currShowCols = hr.length?hr:live.map(c=>c.id);   // 기본: 담임반(진행중)
  }
  return currShowCols;
}
function setCurrCols(ids){ currShowCols=ids; try{ localStorage.setItem('bm_currCols', JSON.stringify(ids)); }catch(e){} rCurriculum(); }
function toggleCurrCol(id){ const cur=getCurrCols().slice(); const i=cur.indexOf(id); if(i>=0) cur.splice(i,1); else cur.push(id); setCurrCols(cur); }
// 담임/부담임은 반별 관리에서 지정한 값(classIsHomeroom: c.role 기준, 미지정이면 이름 X/Y/Z로 추정)
function currRoleSet(role){ const live=CLASSES.filter(c=>isClassActive(c));   // 진행중 반만 (끝난 수업 제외)
  let ids; if(role==='homeroom') ids=live.filter(c=>classIsHomeroom(c)).map(c=>c.id); else if(role==='assistant') ids=live.filter(c=>!classIsHomeroom(c)).map(c=>c.id); else ids=live.map(c=>c.id);
  if(!ids.length){ showToast(role==='all'?'반이 없어요':(role==='homeroom'?'담임반이 없어요 (반별 관리에서 지정)':'부담임반이 없어요 (반별 관리에서 지정)'),'warning'); return; } setCurrCols(ids); }

// ⌨️ 진도표 방향키 이동 — 엑셀처럼 ↑↓←→ / Enter(아래) 로 칸 이동
function currCellKey(e, el){
  const k=e.key;
  if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(k)) return;
  // ←→ 는 글자 중간에서 커서 이동이 우선 (끝에 닿았을 때만 옆 칸으로)
  if(k==='ArrowLeft' && el.selectionStart>0) return;
  if(k==='ArrowRight' && el.selectionEnd<(el.value||'').length) return;

  else if(k==='ArrowRight') nc=c+1;

function studentStats(st){
  if(!st) return {hwRate:'-',retryRate:'-',attRate:'-',recent:'-',lateRate:'-',punct:{total:0,onTime:0,lateCount:0,missing:0,onTimeRate:null,lateRate:null}};
  const myClassIds=st.classIds||(st.classId?[st.classId]:[]);
  const myAsgn=getAssignments().filter(a=>myClassIds.includes(a.classId));
  const myAsgnHw=myAsgn.filter(a=>asnInSeason(a,selectedSeason()));   // 제출률은 선택 시즌 구간만
  const mySubs=getSubmissions().filter(s=>s.studentId===st.id);
  const hwRate=myAsgnHw.length?Math.round(myAsgnHw.reduce((sum,a)=>sum+subCompletion(mySubs.find(s=>s.assignmentId===a.id)),0)/myAsgnHw.length)+'%':'-';
  const retrySubs=mySubs.filter(s=>s.needsRetry).length;
  // 오답 완료율 = 틀린 문제 중 확인(oapOk)까지 끝난 비율 — 학생 화면과 같은 기준
  let oapTotal=0, oapDone=0;
  mySubs.forEach(sub=>{ if(!Array.isArray(sub.wrongNos)) return;
    sub.wrongNos.map(String).forEach(n=>{ oapTotal++; if(sub.oapOk && sub.oapOk[n]) oapDone++; }); });
  const retryRate = oapTotal ? Math.round(oapDone/oapTotal*100)+'%' : '-';
  const attInfo=calcAttendance(myAsgn, absentDatesOf(st.id), new Date().toISOString().slice(0,10));
  const attRate=attInfo.total?attInfo.rate+'%':'-';
  const myScores=getExamSubs().filter(s=>s.studentId===st.id&&s.score!=null).sort((a,b)=>(b.ts||0)-(a.ts||0));
  const recent=myScores.length?myScores[0].score+'점':'-';
  const punct=hwPunctuality(myAsgnHw, mySubs);   // ⏰ 제때/지각/미제출
  return {hwRate,retryRate,attRate,recent,punct,lateRate:punct.lateRate==null?'-':punct.lateRate+'%'};
}
// ✨ 리포트 코멘트 자동 초안 — 성적 추이 + 자주 틀린 능력 + 오답량 + 성실도로 문장 생성 (선생님이 다듬어 저장)
function autoReportComment(stId){
  const st=getStudents().find(s=>s.id===stId); if(!st) return '';
  const nm=st.name||'학생', stat=studentStats(st), parts=[];
  const numFromScore=s=>{ const m=String(s==null?'':s).match(/-?\d+(\.\d+)?/); return m?parseFloat(m[0]):null; };
  // 📝 모의고사 추이
  const mocks=getMockSubs().filter(s=>s.studentId===stId && s.score!=null).map(s=>{ const m=getMockExams().find(x=>x.id===s.mockId)||{}; return {date:m.date||'', score:+s.score, grade:(s.grade||'').trim()}; }).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  if(mocks.length>=2){ const f=mocks[0], l=mocks[mocks.length-1], d=l.score-f.score;
    if(d>=3) parts.push(`모의고사 성적이 ${f.score}→${l.score}점으로 꾸준히 오르고 있어요 📈${l.grade?` (현재 ${l.grade})`:''}. 노력이 결과로 이어지고 있어요!`);
    else if(d<=-3) parts.push(`최근 모의고사가 ${f.score}→${l.score}점으로 다소 주춤했어요. 부족한 부분을 함께 점검하며 다시 끌어올려볼게요.`);
    else parts.push(`모의고사는 ${l.score}점 안팎으로 꾸준히 유지되고 있어요${l.grade?` (${l.grade})`:''}.`);
  } else if(mocks.length===1){ parts.push(`모의고사 ${mocks[0].score}점${mocks[0].grade?`(${mocks[0].grade})`:''}을 기록했어요. 다음 시험과 비교해 추이를 지켜볼게요.`); }
  // 🏫 내신 추이(과목별 중간→기말 상승)
  const naesin=NAESIN_CACHE.filter(n=>n.studentId===stId), bySub={};
  naesin.forEach(n=>{ (bySub[n.subject||'과목']=bySub[n.subject||'과목']||{})[n.term]=n; });
  const naeUp=[]; Object.entries(bySub).forEach(([sub,t])=>{ const mv=numFromScore(t['중간']&&t['중간'].score), fv=numFromScore(t['기말']&&t['기말'].score); if(mv!=null&&fv!=null&&(fv-mv)>=3) naeUp.push(`${sub} ${mv}→${fv}점`); });
  if(naeUp.length) parts.push(`내신도 ${naeUp.join(', ')}으로 올라, 학교 시험 대비가 잘 되고 있어요!`);
  // 🎯 자주 틀린 능력(weakAbilities) — '이 부분이 부족'
  const freq={}; getExamSubs().filter(s=>s.studentId===stId).forEach(s=>(s.weakAbilities||[]).forEach(w=>{ if(w) freq[w]=(freq[w]||0)+1; }));
  const weak=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]);
  if(weak.length) parts.push(`다만 ${weak.map(w=>`‘${w}’`).join(', ')} 쪽에서 자주 막혀서, 이 부분을 집중적으로 연습하면 한 단계 더 올라갈 수 있어요.`);
  // ✏️ 오답량 — 실수/양치기 신호
  const oapSubs=getSubmissions().filter(s=>s.studentId===stId && Array.isArray(s.wrongNos));
  const totalWrong=oapSubs.reduce((n,s)=>n+s.wrongNos.length,0);
  if(oapSubs.length && totalWrong/oapSubs.length>=8) parts.push(`오답이 한 번에 많이 나오는 편이라, 틀린 문제를 그날 바로 다시 푸는 습관을 함께 잡아가고 있어요.`);
  // 🙂 성실도 마무리
  const hw=parseInt(stat.hwRate)||0, att=parseInt(stat.attRate)||0, good=[];
  if(hw>=80) good.push('숙제'); if(att>=90) good.push('출석');
  if(good.length) parts.push(`${good.join('·')}도 성실하게 잘 해주고 있어요.`);
  // ⏰ 지각 — 제출률만 보면 안 보이는 축(늦게라도 내는 습관)
  const pu=stat.punct||{};
  if(pu.total>=4 && pu.lateRate!=null){
    if(pu.lateRate>=40) parts.push(`다만 숙제를 ${pu.lateCount}번은 마감 뒤에 냈어요(지각률 ${pu.lateRate}%). 내용은 해오는 만큼, 이제 '제때 내기'만 잡으면 훨씬 좋아져요.`);
    else if(pu.lateRate>=20) parts.push(`숙제는 하는데 가끔 늦어요(지각 ${pu.lateCount}회). 마감 하루 전에 미리 챙기는 습관을 같이 만들어볼게요.`);
    else if(pu.lateCount===0 && pu.onTime>=4) parts.push(`숙제를 한 번도 늦지 않고 제때 내고 있어요 ⏱️ 정말 칭찬할 점이에요.`);
  }
  parts.push(`${nm} 앞으로도 꼼꼼히 확인하며 챙기겠습니다. 😊`);
  return parts.join(' ');
}

// ===== 오래된 사진 자동정리 (하루 1회) — 사진 비용 절약 =====
// 원칙: 지우는 건 '아이들이 올린 사진'뿐. 기록은 남긴다.
//  · 제출·답안지·질문의 사진만 Storage에서 지우고 문서는 그대로 둔다
//    (제출률·지각률·성적 이력이 사진 때문에 사라지면 안 되니까)
//  · 학사일정(schoolExams)·공휴일·시즌·진도표 같은 학원 자료는 건드리지 않는다
//  · 퇴원 6개월 지난 학생만 개인정보 보호 차원에서 통째로 정리한다
async function pruneOldFirebase(){
  const today=new Date().toISOString().slice(0,10);
  if(localStorage.getItem('bm_lastPrune')===today) return;  // 하루 1회만
  const cutoff=Date.now() - 92*24*60*60*1000;  // 약 3개월
  const delPhotos=async (urls)=>{ if(Array.isArray(urls)) for(const u of urls){ try{ await firebase.storage().refFromURL(u).delete(); }catch(e){} } };
  try{
    // 숙제 제출: 사진만 지우고 '냈다 / 제때 냈다' 기록은 남긴다
    const subs=await db.collection('submissions').where('ts','<',cutoff).get();
    for(const d of subs.docs){
      const v=d.data();
      if(v.photosPruned) continue;                       // 이미 정리한 건 건너뜀
      await delPhotos(v.photos); await delPhotos(v.retryPhotos);
      await d.ref.update({ photos:[], retryPhotos:[], corrections:{}, photosPruned:true });
    }
    // 답안지: 사진만 삭제(점수는 보존)
    const es=await db.collection('examSubs').where('ts','<',cutoff).get();
    for(const d of es.docs){ const s=d.data(); if(Array.isArray(s.photos)&&s.photos.length){ await delPhotos(s.photos); await d.ref.update({photos:[]}); } }
    // 질문·상담: 사진만 지우고 글은 남긴다 (출석 기록은 손대지 않음)
    for(const col of ['questions','consultations']){
      const snap=await db.collection(col).where('ts','<',cutoff).get();
      for(const d of snap.docs){
        const v=d.data();
        if(v.photosPruned || !(Array.isArray(v.photos)&&v.photos.length)) continue;
        await delPhotos(v.photos);
        await d.ref.update({ photos:[], photosPruned:true });
      }
    }
    // 🚪 퇴원 6개월(183일) 경과 학생 자동 정리 — 학생 문서 + studentId로 연결된 기록/사진 삭제
    const leaveCut=new Date(Date.now()-183*24*60*60*1000).toISOString().slice(0,10);
    for(const s of STUDENTS_CACHE){
      if(studentStatus(s)!=='퇴원' || !s.statusDate || s.statusDate>leaveCut) continue;
      for(const col of ['submissions','examSubs','reviewSubs','naesin','questions','mockSubs']){
        try{ const snap=await db.collection(col).where('studentId','==',s.id).get();
          for(const d of snap.docs){ const dt=d.data(); await delPhotos(dt.photos); await delPhotos(dt.retryPhotos); await d.ref.delete(); } }
        catch(e){}
      }
      try{ await db.collection('students').doc(s.id).delete(); }catch(e){}
    }
    await loadStudents();
    localStorage.setItem('bm_lastPrune', today);
  }catch(e){ /* 색인 준비 전이면 조용히 패스 */ }
}

    loadNotices(),       // 공지사항

    loadMockExams(),     // 모의고사 (자가 등록)
    loadMockSubs(),      // 모의고사 학생 제출
    loadMakeups(),       // 보강 일정
    loadAbsences(),      // 결석 기록
    loadSeasons(),       // 제출률 시즌(집계 기간)
    loadBogang(),        // 보강 체크(방학 보충 참석)

    loadProgLog(),       // 진도 기록(일자별)
    loadCurrTerm(),      // 진도표 학기(시작일·주수)
    loadClassChecks(),   // 반별 오답 마무리 체크·데일리테스트 기록
    loadMyTodos(),       // 내 체크리스트(개인 할 일)
    loadSchoolBooks(),   // 학교별 교재·출판사
    loadHiddenTextbooks(), // 숨긴 교재 칩
    loadVideoViews()     // 영상 시청 기록
  ].map(p=>Promise.resolve(p).catch(e=>console.warn('일부 데이터 로드 실패(무시):',e))));
  try{ const n=await applyPendingMoves(); if(n) showToast(`예약된 반 이동 ${n}건이 오늘 적용됐어요 🔜`,'success'); }catch(e){}
  rDashboard();
  pruneOldFirebase();            // 3개월 지난 사진·기록 자동 정리 (백그라운드)
  // 홈 화면 '숙제 입력' 바로가기로 들어오면 빠른 입력창 자동 열기
  if(location.search.indexOf('quick=hw')>=0) setTimeout(openQuickHw, 300);
}
document.addEventListener('DOMContentLoaded',init);
